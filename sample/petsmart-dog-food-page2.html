, and texture that encourages them to chew thoroughly. Incorporate this tasty kibble to your Golden Retriever's diet as a standalone meal or by alternating it with Royal Canin wet food to help maintain variety and keep them interested and hydrated.\u003c/p\u003e\u003cp\u003e\u003cb\u003eFeatures \u0026 Benefits: \u003c/b\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\t\t\t\t\u003cli\u003eFOR ADULT GOLDEN RETRIEVERS OVER 15 MONTHS: Royal Canin Adult Golden Retriever dry dog food is formulated to meet the specific nutritional needs of the breed\u003c/li\u003e\r\n\t\t\t\t\u003cli\u003eSUPPORTS SKIN \u0026#38; COAT HEALTH: Enriched with a nutrient complex, including EPA and DHA, to help maintain a healthy skin and coat \r\n\t\t\t\t\u003c/li\u003e\r\n\t\t\t\t\u003cli\u003eSPECIFIC NUTRIENTS: Including taurine, EPA, and DHA, help support healthy cardiac function \r\n\t\t\t\t\u003c/li\u003e\r\n\t\t\t\t\u003cli\u003eWEIGHT MAINTENANCE: An appropriate calorie and fat content helps your Golden Retriever maintain a healthy weight \r\n\t\t\t\t\u003c/li\u003e\r\n\t\t\t\t\u003cli\u003eSPECIALLY DESIGNED KIBBLE: With a size, shape, and texture to encourage chewing \r\n\t\t\t\t\u003c/li\u003e\r\n\t\t\t\t\u003cli\u003eDESIGNED \u0026#38; FORMULATED BY SCIENTIFIC EXPERTS: Always follow your veterinarian's feeding guidelines- Perfect complement to Royal Canin Breed Health Nutrition Golden Retriever Adult Wet Food- Check out the full range of Royal Canin dog food for dogs of all ages, sizes and breeds\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cb\u003eSpecies: \u003c/b\u003eDog\u003c/p\u003e\u003cp\u003e\u003cb\u003eBrand: \u003c/b\u003eRoyal Canin\u0026reg; BREED HEALTH NUTRITION\u0026reg;\u003c/p\u003e\u003cp\u003e\u003cb\u003eFood Type: \u003c/b\u003eKibble\u003c/p\u003e\u003cp\u003e\u003cb\u003eBreed Size: \u003c/b\u003eLarge\u003c/p\u003e\u003cp\u003e\u003cb\u003eLife Stage: \u003c/b\u003eAdult\u003c/p\u003e\u003cp\u003e\u003cb\u003eNutritional Benefits: \u003c/b\u003eBHN A us Oxide, Calcium Iodate, Sodium Selenite), Mixed Tocopherols for freshness, Natural Flavors, Beta-Carotene \u003cbr\u003e    \r\n\r\n\u003cp\u003e\u003cb\u003eCaloric Content: \u003c/b\u003e  358\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eFEEDING INSTRUCTIONS\u003c/b\u003e\u003cbr\u003ePlease follow specific daily feeding instructions included on packaging.\u003cbr\u003e\u003cp\u003eThese amounts are a starting point only and should be adjusted to maintain proper weight. When feeding this food for the first time, mix increasing amounts of the pet\u0026#39;s new food with decreasing amounts of the old food over a 7-day period.\r\n\u003cp\u003e\u003cb\u003eTransition Instructions:\u003c/b\u003e\u003cbr\u003e Please see package for complete feeding instructions. Adjust feeding amounts as necessary to maintain optimal weight. If you are unsure, ask your veterinarian. New to this food? Mix increasing amounts of your pet\u0026#39;s new food with decreasing amounts of the old food over a 7 day period. Keep fresh water available at all times! Your pet\u0026#39;s nutritional needs may change as they age. Ask your vet at every check-up.","onlineFrom":1717286400000,"onlineTo":4102444799000,"dogLifestages":["Adult"],"foodPoundsSizeDisplays":["24 Lb and Over"],"customHealthConsideration":["General Health"],"kibbleSizes":["All Breeds"],"customPet":["Dog"],"productAvailabilityLocations":["In Store"],"avalaraTaxCode":"EEE","bvAverageRating":4.7,"bvReviewCount":183,"conversionRate":40,"customBvAverageRating":4,"manufacturerName":"HILLS PET NUTRITION, INC.","manufacturerSku":"608505","shipToHome-isCASupported":true,"shoppingOptions-isBopisEligible":true,"shoppingOptions-isInStoreOnly":false,"shoppingOptions-isSoldOnlineOnly":false,"customScheduledDeliveryEligible":true,"isSubscriptionEnabled":true,"isInStockInStore":true,"upc":"052742068626","isSearchableFlag":true,"isSKUAvailable":true,"price":{"number":89.99,"strikethrough-number":null,"validUntil":"","formatted":{"primary":"$ ood and a little more Pro Plan until you're feeding Pro Plan exclusively. This gradual transition will help avoid dietary upsets.","foodCategory":"Specialized Nutrition","onlineFrom":1587081600000,"onlineTo":4102444799000,"dogLifestages":["Puppy"],"foodPoundsSizeDisplays":["24 Lb and Over"],"customHealthConsideration":["General Health"],"kibbleSizes":["Large Breed"],"nutritionalOptions":["With-Grain"],"customPet":["Dog"],"productAvailabilityLocations":["In Store"],"avalaraTaxCode":"EEE","bvAverageRating":4.7,"bvReviewCount":2354,"conversionRate":30,"customBvAverageRating":4,"manufacturerName":"NESTLE PURINA DRY","manufacturerSku":"38100-18744","shoppingOptions-isBopisEligible":true,"shoppingOptions-isInStoreAvailable":true,"shoppingOptions-isInStoreOnly":false,"shoppingOptions-isInStorePickUp":true,"shoppingOptions-isSoldOnlineOnly":false,"customScheduledDeliveryEligible":true,"isSubscriptionEnabled":true,"isInStockInStore":true,"upc":"038100187444","isSearchableFlag":true,"isSKUAvailable":true,"price":{"number":95.99,"strikethrough-number":null,"validUntil":"","formatted":{"primary":"$52.99-$95.99"},"displayType":"range"},"variations":["3 Sizes","1 Flavor"],"categories":[[{"id":"6007000","name":{"default":"Same Day Delivery"}},{"id":"6000000","name":{"default":"Featured Shops"}}],[{"id":"5000083","name":{"default":"Purina Pro Plan"}},{"id":"5000000","name":{"default":"Featured Brands"}}],[{"id":"60080122","name":{"default":"Timezone Test"}},{"id":"6000000","name":{"default":"Featured Shops"}}],[{"id":"100246","name":{"default":"Dry Food"}},{"id":"100409","name":{"default":"Food"}},{"id":"100000","name":{"default":"Dog"}}],[{"id":"10040901","name":{"default":"Puppy Food"}},{"id":"100409","name":{"default":"Food"}},{"id":"100000","name":{"default":"Dog"}}],[{"id":"600275","name":{"default":"Purina"}},{"id":"5000000","name":{"default":"Featured Brands"}}],[{"id":"S10-OE","name":{"default":"October Event"}},{"id":"sale","name":{"default":"Sale"}}],[{"id":"6000030","nam  daily\u003cbr\u003e\r\n70 lb: 5-1/4 cans daily\u003cbr\u003e\r\n80 lb: 5-3/4 cans daily\u003cbr\u003e\r\n100 lb: 6-3/4 cans daily\u003cbr\u003e\r\n120 lb: 7-3/4 cans daily\u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eTransition Instructions:\u003c/b\u003e\u003cbr\u003e Pets can be sensitive to sudden changes in their diets. For this reason, it is extremely important to follow a gradual transition plan to best support your pet\u0026#39;s health and product effectiveness. It is recommended to follow at least a 7-day transition plan before exclusively feeding your pet a new food. Cats will often refuse mixed diets, so we recommend adding the new food to a separate bowl from the old food. Start by mixing 75% of your pet's current diet with 25% of the new diet on Day 1 and Day 2. On Day 3 and Day 4, mix 50% of the current diet with 50% of the new diet. On Day 5 and Day 6, mix 25% of the current diet with 75% of the new diet. On Day 7, you can feed your pet the new food exclusively. Ask your Veterinarian about the best way to transition your pet toa new food.","foodCategory":"Vet-Authorized Diets","pharmacy-sku":"5303291","onlineFrom":1620604800000,"onlineTo":4102444799000,"dogLifestages":["Adult"],"foodOuncesSizeDisplays":["8-15 Oz"],"customHealthConsideration":["Digestive Care","Gastrointestinal"],"kibbleSizes":["All Breeds"],"petType-breeds":[""],"customPet":["Dog"],"productAvailabilityLocations":["In Store"],"vetAuthorizedDiets":["Hill's Gastrointestinal Biome"],"avalaraTaxCode":"777","bvAverageRating":4.5,"bvReviewCount":177,"conversionRate":40,"customBvAverageRating":4,"manufacturerName":"HILLS PET NUTRITION","manufacturerSku":"605362","pharmacy-type":"rx_food","shipToHome-isCASupported":true,"shoppingOptions-isInStoreAvailable":true,"shoppingOptions-isInStoreOnly":false,"shoppingOptions-isInStoreOnlyOverride":false,"shoppingOptions-isInStorePickUp":true,"shoppingOptions-isSoldOnlineOnly":false,"isInStockInStore":false,"upc":"052742036878","isSearchableFlag":true,"is ealth, Heart Health, Hip \u0026 Joint Support, Immune Support, Energy \u0026 Vitality Support, Eye Health\u003cbr\u003e\r\n\u003cb\u003eFlavor:\u003c/b\u003e Chicken\u003cbr\u003e\r\n\u003cb\u003eWeight:\u003c/b\u003e 40.4 lb\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eNUTRITIONAL INFORMATION\u003c/b\u003e\u003cbr\u003e    \r\n\r\n\u003cp\u003e\u003cb\u003eIngredients:\u003c/b\u003e\u003cbr\u003eChicken (Source Of Glucosamine), Rice Flour, Corn Gluten Meal, Whole Grain Corn, Chicken By-Product Meal (Source Of Glucosamine), Whole Grain Wheat, Soybean Meal, Beef Fat Naturally Preserved With Mixed-Tocopherols, Glycerin, Liver Flavor, Calcium Carbonate, Mono And Dicalcium Phosphate, Salt, Caramel Color, Dried Carrots, Dried Peas, Potassium Chloride, Vitamins [Vitamin E Supplement, Niacin (Vitamin B-3), Vitamin A Supplement, Calcium Pantothenate (Vitamin B-5), Thiamine Mononitrate (Vitamin B-1), Vitamin B-12 Supplement, Riboflavin Supplement (Vitamin B-2), Pyridoxine Hydrochloride (Vitamin B-6), Folic Acid (Vitamin B-9), Menadione Sodium Bisulfite Complex (Vitamin K), Vitamin D-3 Supplement, Biotin (Vitamin B-7)], Minerals [Zinc Sulfate, Ferrous Sulfate, Manganese Sulfate, Copper Sulfate, Calcium Iodate, Sodium Selenite], Choline Chloride, L-Lysine Monohydrochloride, Sulfur. X-4154 \u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eGuaranteed Analysis:\u003c/b\u003e\u003cbr\u003e Crude Protein (Min) 26.0%, Crude Fat (Min) 16.0%, Crude Fiber (Max) 3.0%, Moisture (Max) 12.0%, Linoleic Acid (Min) 1.4%, Calcium (Ca)(Min) 1.0%, Phosphorus (P)(Min) 0.8%, Zinc (Zn)(Min) 150mg/kg, Selenium (Se)(Min) 0.35mg/kg, Vitamin A (Min) 13,000 IU/kg, Vitamin E (Min) 250 IU/kg, Glucosamine* (Min) 350 ppm, Omega-6 Fatty Acids* (Min) 1.6%, *Not recognized as an essential nutrient by the AAFCO Dog Food Nutrient Profiles.\u003cbr\u003e \r\n\r\n\u003cp\u003e\u003cb\u003eCaloric Content: \u003c/b\u003e 3,993 kcal/kg, 383 kcal/cup \u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eFEEDING INSTRUCTIONS\u003c/b\u003e\u003cbr\u003e |Weight|Daily Feeding (Cups)|\r\n\u003cbr\u003e|---|---|\r\n\u003cbr\u003e|3 - 12 lbs.|1/3 - 1|\r\n\u003cbr\u003e|13 - 20 lbs.|1 - 1 1/2|\r\n\u003cbr\u003e|21 - 35 lbs.|1 1/2 - 2 1/4|\r\n\u003cbr\u003e|36 - 50 lbs.|2 1/4 - 3|\r\n\u003cbr\u003e|51 - 75 lbs.|3 - 4|\r\n\u003cbr\u003e|76 - 100 lbs.|4 - 5|\r\n\u003cbr\u003e|Over 100 lbs.|5 + 1/2 for each 10 lbs. over 100 lbs.| \u003cbr\u003e\r\n\r\n\u003cp\u003eThe recommended feeding amounts indicated are based upon the average nutritional needs of an adult dog with normal activity. Factors, such as a dog's metabolism, breed size, activity level, age and whether the dog is spayed or neutered, will affect the amount of Purina ONE needed to maintain an ideal body condition. If you find that your dog is losing weight or becomes overweight when fed these amounts, please adjust accordingly. To help your dog maintain an ideal body condition, monitor your dog\u0026#39;s weight on a regular basis, making sure that his ribs are easily felt and the waist is visible when viewed from above. \u003cbr\u003e\r\n\r\n\u003cp\u003e**Puppies:** Start puppies on moistened Purina ONE as early as they will nibble at solid foods, generally 3-4 weeks of age. Feed pups (to six months of age) all of the moistened or dry Purina ONE they will consume at intervals throughout the day. If water is added, use no more than one part warm (not hot) liquid to four parts Purina ONE, changing frequently to ensure freshness. If fed dry,this formula may be kept before pups at all times. \u003cbr\u003e\r\n\r\n\u003cp\u003e**Reproduction:** Purina ONE provides the extra nutrition needed by reproducing females in stages of gestation and lactation. Food consumption may vary during gestation, so feed the amount needed to maintain the pregnant female\u0026#39;s good body condition. Food intake may double or even quadruple during lactation.\u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eTransition Instructions:\u003c/b\u003e\u003cbr\u003e A y Food","long_description":"\u003cp\u003e\u003cb\u003eDESCRIPTION \u003c/b\u003e\u003cp\u003e Authority\u0026reg Chicken \u0026 Rice Formula All Life Stages Dog Food provides lifelong nutrition in a bite-size kibble for puppies, adults, mothers, and mature dogs, making it perfect for multi-dog homes. Our veterinarian recommended products reflect decades of research and experience, all aimed to deliver next-level nutrition. Which is key, because we believe that\u0026#39;s the foundation for a healthy, active, rewarding life for your pet. Exclusively at PetSmart. \u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eFeatures: \u003c/b\u003e \u003cli\u003e Deboned chicken is #1 ingredient\u003cli\u003eNo added artificial colors, flavors, or preservatives\u003cli\u003eDental support with the Ora-Shield System\u0026reg. Unique formula and texture helps reduce plaque \u0026 tartar\u003cli\u003eAuthority Biome+\u0026#8482; featuring prebiotics for gut microbiome + ingredients to support skin \u0026 coat, dental, \u0026 immune health\u003cli\u003ePerfect for multi-dog homes: lifelong nutrition for every age, size, and breed\u003cli\u003eVeterinarian recommended  \r\n\u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eBrand: \u003c/b\u003e Authority\u0026reg \u003cbr\u003e\r\n\u003cb\u003eFood Type: \u003c/b\u003e Kibble (small bites)\u003cbr\u003e\r\n\u003cb\u003eLife Stage: \u003c/b\u003e All life stages \u003cbr\u003e\r\n\u003cb\u003eFlavor:\u003c/b\u003e Chicken \u0026 Rice \u003cbr\u003e\r\n\u003cb\u003eWeight:\u003c/b\u003e 34 LB (15.4 kg)\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eNUTRITIONAL INFORMATION\u003c/b\u003e\u003cbr\u003e    \r\n\r\n\u003cp\u003e\u003cb\u003eIngredients:\u003c/b\u003e Deboned Chicken, Chicken Meal, Brown Rice, Corn, Soybean Meal, Chicken Fat (Preserved with Mixed Tocopherols), Oatmeal, Dried Plain Beet Pulp, Natural Flavor, Dicalcium Phosphate, Fish Oil (Preserved with Mixed Tocopherols), Dried Egg Product, Potassium Chloride, Salt, Sodium Hexametaphosphate, Minerals (Zinc Sulfate, Ferrous Sulfate, Manganese Sulfate, Copper Sulfate, Sodium Selenite), Choline Chloride, Inulin, Vitamins (Vitamin E Supplement, Vitamin A Supplement, Niacin Supplement, d-Calcium Pantothenate, Riboflavin Supplement, Thiamine Mononitrate, Biotin, Vitamin B12 Supplement, Pyridoxine Hydrochloride, Vitamin D3 Supplement, Calcium Iodate, Folic Acid), Citric Acid (A Preservative), Mixed Tocopherols (A Preservative), Rosemary Extract\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eGuaranteed Analysis:\u003c/b\u003e\u003cbr\u003e    \r\nCrude Protein (min) 26.0% \u003cbr\u003e    \r\nCrude Fat (min) 14.0% \u003cbr\u003e    \r\nCrude Fiber (max) 4.0%\u003cbr\u003e     \r\nMoisture (max) 10.0% \u003cbr\u003e    \r\nLinoleic Acid (min) 1.5% \u003cbr\u003e    \r\nDocosahexaenoic Acid (DHA) (min) 0.05% \u003cbr\u003e    \r\nCalcium (min) 1.2% \u003cbr\u003e    \r\nPhosphorus (min) 1.0% \u003cbr\u003e    \r\nZinc (min) 175 mg/kg \u003cbr\u003e    \r\nSelenium (min) 0.35 mg/kg \u003cbr\u003e    \r\nVitamin A (min) 15,000 IU/kg \u003cbr\u003e    \r\nVitamin E (min) 225 IU/kg \u003cbr\u003e    \r\nGlucosamine* (min) 150 mg/kg \u003cbr\u003e    \r\nOmega-6 Fatty Acids* (min) 2.5%\u003cbr\u003e     \r\nOmega-3 Fatty Acids* (min) 0.2%\u003cbr\u003e     \r\n*Not recognized as an essential nutrient by the AAFCO Dog Food Nutrient Profiles\u003cbr\u003e    \r\n\r\n\r\n\u003cp\u003e\u003cb\u003eCalorie Content (ME Calculated): \u003c/b\u003e 3,615 kcal/kg, 377 kcal/cup \u003cbr\u003e\r\n\r\n\r\n\u003cp\u003e\u003cb\u003eNutritional Adequacy Statement:\u003c/b\u003e AUTHORITY\u0026reg Chicken \u0026 Rice Formula All Life Stages Dog Food is formulated to meet the nutritional levels established by the Association of American Feed Control Officials (AAFCO) Dog Food Nutrient Profiles for All Life Stages, including growth of large size dogs (70 lbs or more as an adult).\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eFEEDING INSTRUCTIONS\u003c/b\u003e\u003cbr\u003e\r\n\r\n\u003cp\u003eAdult Dogs: Feed AUTHORITY\u0026reg dog food either dry or moistened with water. Begin with the recommendations provided and adjust to maintain body weight. Dogs may be fed once or twice per day.  Weaning Puppies: Start puppies on AUTHORITY\u0026reg dog food as early as they begin to nibble at solid foods, generally 3-4 weeks of age. Growing Puppies: Feed puppies the moistened AUTHORITY\u0026reg dog food per feeding guidelines at intervals throughout the day. If fed dry, AUTHORITY\u0026reg dog food may be kept before the puppies at all times. Reproducing Dogs: AUTHORITY\u0026reg dog food provides the extra nutrition needed by reproducing females in stages of gestation and lactation. Food consumption may vary during gestation, so feed the amount needed to maintain the pregnant female\u0026#39;s ideal body condition. Food intake may increase 2-4 times during lactation. Provide your dog with a clean container of fresh water daily. Always consult your veterinarian  with any health questions.\u003cbr\u003e\u003cp\u003e\r\n\r\nRecommended Daily Feeding Amounts (using a standard 8 OZ measuring cup)\u003cbr\u003e\r\nSize\t\t\tWeight\t\t\tAmount\u003cbr\u003e\r\nSmall\t\t\t13-25 lbs\t\t\t1 - 1-3/4 cups\u003cbr\u003e\r\nMedium\t\t26-50 lbs\t\t\t1-3/4 - 3 cups\u003cbr\u003e\r\nLarge\t\t\t51-90 lbs\t\t\t3 - 4-3/4 cups\u003cbr\u003e\r\nX-Large\t\t90+ lbs\t\t\t4-3/4 cups*\u003cbr\u003e\r\n*Add 1/3 cup for every 10 lbs over 90 lbs\u003cbr\u003e\u003cp\u003e\r\n\r\nPuppy Weight      6 Weeks-3 MOS       3-6 MOS\t         6-9 MOS\t                9-12 MOS\u003cbr\u003e\r\n2-4 lbs\t                 2/3 - 1 cup\t               1/2 - 1 cup\t         1/2 - 3/4 cup          1/3 - 2/3 cup\u003cbr\u003e\r\n5-9 lbs\t                 1-1/4 - 2 cups\t   1- 1-3/4 cups         1 - 1-1/2 cups        1-2/3 - 1-1/4 cups\u003cbr\u003e\r\n10-19 lbs\t     2 - 3-1/2 cups\t   1-3/4 -  3 cups       1-1/2 - 2-3/4 cups  1-1/4 - 2-1/4 cups\u003cbr\u003e\r\n20-34 lbs\t     3-1/2 - 5-1/2 cups  lifelong health. IT'S NOT FOR ALL DOGS: Purina ONE Skin \u0026#38; Coat Formula is specifically formulated for adult dogs. If you have a puppy, or a pregnant or nursing dog, feed Purina ONE Healthy Puppy Formula.MAY BE SERVED DRY OR MOISTENED: Purina ONE may be fed dry or mixed with water. If mixed, we suggest one part liquid to four parts Purina ONE.FEED ONLY ONE: A dog's digestive system works best when it receives the same food each day. Although humans crave variety in their diets, dogs do not. Feeding different dog foods can turn your dog into a finicky eater. Avoid feeding table scraps, as they can upset the nutrient balance provided by your dog's regular food, and may lead to obesity. The best way to feed your dog is to feed only one dog food each and every day. MAKING THE SWITCH TO PURINA ONE: Please allow 7 \r\n- 10 days to ease the transition from your dog's current food. Each day, simply feed a little less of the previous food and a little more Purina ONE until you're feeding Purina ONE exclusively. This gradual transition will help avoid dietary upsets. NO SUPPLEMENTS NECESSARY: Purina ONE provides 100% complete and balanced nutrition for maintenance of adult dogs. There is no need to add vitamins, minerals or other supplements, unless specifically directed by a veterinarian. FRESH WATER, PROPER DIET \u0026#38; VETERINARY CARE: Be sure to provide fresh water in a clean container for your dog daily. Proper diet, exercise and veterinary care are the best ways to keep your dog healthy. If your dog hasn't had a checkup in the past year, please make an appointment today.\u003c/p\u003e\u003cp\u003e\u003cb\u003eFeeding Chart: \u003c/b\u003e|Weight Range (lbs)| Feeding Amount (cups)| |---|---| |3 \r\n- 12 lbs|1/3 to 3/4| |13 - 20 lbs|3/4 to 1-1/4| |21 - 35 lbs|1-1/4 to 1-3/4| |36 \r\n- 50 lbs|1-3/4 to 2-1/4| |51 - 75 lbs|2-1/4 to 3||76 - 100 lbs|3 to 3-2/3| |Over 100 lbs|3-2/3 cups plus 1/4 cup for each 10 lbs (4.5 kg) of body weight over 100 lbs (45.4 kg)|**AD you and your dog enjoy is onethat is established and built on trust, and so is the relationship Purina has with you both. We\u0026#39;re your partners in making sure your dog gets the nutrition he needs, with a taste he loves, from a source you trust. That\u0026#39;s why Purina Dog Chow is proudly fed to our own dogs. We maintain a strict code of standards for buying, storing and processing ingredients that are used in our pet foods. These standards are among the strictest in the pet food industry, and we're very serious about enforcing them. To ensure you feed your dog our food with confidence, our products are backed by over 90 years of trusted Purina history. We work hard to make sure all of our pet foods are up to the high standards you demand for your best friend, because the dog foods we make aren\u0026#39;t just for your dog - they\u0026#39;re for ours too.\u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eKey Benefits: \u003c/b\u003e\u003cli\u003e100 percent complete and balanced for adult dogs.\u003cli\u003e Features 23 vitamins and minerals for dogs to help support a healthy, active life\u003cli\u003ePurina Dog Chow Complete adult dog food with high protein for strong muscles\u003cli\u003e Crunchy dog kibble helps clean teeth\u003cli\u003e Highly digestible wholesome dog food formula \u003cbr\u003e\r\n\u003cp\u003e\u003cb\u003eItem Number: \u003c/b\u003e 5349452\u003cbr\u003e\r\n\u003cb\u003eBrand: \u003c/b\u003e Purina Dog Chow Complete\u003cbr\u003e\r\n\u003cb\u003eFood Type: \u003c/b\u003e Kibble\u003cbr\u003e\r\n\u003cb\u003eBreed Size: \u003c/b\u003e All\u003cbr\u003e\r\n\u003cb\u003eLife Stage: \u003c/b\u003e Adult\u003cbr\u003e\r\n\u003cb\u003eNutritional Option: \u003c/b\u003e With Vitamins\u003cbr\u003e\r\n\u003cb\u003eHealth Consideration:\u003c/b\u003e Digestive Health, Immune Support\u003cbr\u003e\r\n\u003cb\u003eFlavor:\u003c/b\u003e Chicken\u003cbr\u003e\r\n\u003cb\u003eWeight:\u003c/b\u003e 40.3 lb\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eNUT , see your veterinarian regularly.\u003cbr\u003e\u003cp\u003e\r\n|Weight|Adult Daily Feeding (Cups)|\r\n\u003cbr\u003e|---|---|\r\n\u003cbr\u003e|3 - 12 lbs.|1/2 - 1|\r\n\u003cbr\u003e|13 - 20 lbs.|1 - 1 1/2|\r\n\u003cbr\u003e|21 - 35 lbs.|1 1/2 - 2 1/8|\r\n\u003cbr\u003e|36 - 50 lbs.|2 1/4 - 2 3/4|\r\n\u003cbr\u003e|51 - 75 lbs.|2 3/4 - 3 1/3|\r\n\u003cbr\u003e|76 - 100 lbs.|3 2/3 - 4 1/3|\r\n\u003cbr\u003e|Over 100 lbs.|4 1/3 + 1/4 for each 10 lbs. over 100 lbs.| \u003cbr\u003e\r\n\u003cp\u003eAmounts are recommended for an average adult dog with normal activity. Remember food intake requirements vary depending on age, activity and environment, and should be adjusted accordingly.\u003cbr\u003e\r\n\r\n\u003cp\u003e\u003cb\u003eTransition Instructions:\u003c/b\u003e\u003cbr\u003e When switching to Dog Chow from another food, please allow 7-10 days for the transition. Gradually add more Dog Chow and less of the previous food to your pet\u0026#39;s dish each day until the changeover is complete. This gradual transition will help avoid dietary upsets.","onlineFrom":1679270400000,"onlineTo":4102444799000,"dogLifestages":["Adult"],"foodPoundsSizeDisplays":["24 Lb and Over"],"customHealthConsideration":["General Health"],"kibbleSizes":["All Breeds"],"customPet":["Dog"],"productAvailabilityLocations":["In Store"],"avalaraTaxCode":"EEE","bvAverageRating":4.7,"bvReviewCount":1786,"conversionRate":65,"customBvAverageRating":4,"manufacturerName":"NESTLE PURINA DRY","manufacturerSku":"1780010021","shoppingOptions-isBopisEligible":true,"shoppingOptions-isInStoreAvailable":true,"shoppingOptions-isInStoreOnly":false,"shoppingOptions-isInStorePickUp":true,"shoppingOptions-isSoldOnlineOnly":false,"customScheduledDeliveryEligible":true,"isSubscriptionEnabled":true,"isInStockInStore":true,"upc":"017800100212","isSearchableFlag":true,"isSKUAvailable":true,"price":{"number":27.99,"strikethrough-number":null,"validUntil":"","formatted":{"primary":"$27.99"},"displayType":"single"},"variat
