gh&sortOrder=desc"}, {"sortOption": "Price Low-High", "isSelected": false, "sortUrl": "/s/kitchen/1?sortField=sort_register_price_low&sortOrder=asc"}, {"sortOption": "Price High-Low", "isSelected": false, "sortUrl": "/s/kitchen/1?sortField=sort_register_price_high&sortOrder=desc"}, {"sortOption": "Top Rated", "isSelected": false, "sortUrl": "/s/kitchen/1?sortField=average_overall_rating&sortOrder=desc"}, {"sortOption": "Best Sellers", "isSelected": false, "sortUrl": "/s/kitchen/1?sortField=sort_sales_quantity_high&sortOrder=desc"}], "data": {"title": " Kitchen", "titleTagAmendments": "Kitchen Storage", "categoryId": 6, "totalCount": 1751, "currentPage": 1, "lastPage": 30, "pageRange": "1 - 60", "pageSize": 60, "breadcrumbs": [{"name": "Kitchen", "href": "/s/kitchen/1"}], "nextPageUrl": "/s/kitchen/1?p=60&ps=60", "prevPageUrl": "", "seoTitle": "Kitchen Storage - The Container Store", "metaDescription": "Discover Kitchen Storage Solutions: Get organized with cabinet, drawer, pantry, fridge, sink, & countertop organizers. Shop now at The Container Store!", "longDescription": "<div> <h3>Kitchen Storage Solutions: Everything You Need to Get Started</h3><br><p>Use these kitchen organization ideas and organizers to tackle all the areas in your kitchen:<br><ul><li>Cabinet organizers: Kitchen cabinet organizers are especially helpful in small kitchens. They allow you to make room for everything from dinnerware and cookware to dry goods and napkins. For example, use cabinet shelves to maximize vertical cabinet space and separate plates, bowls and glasses.</li><li>Kitchen drawer organizers: Create custom storage for kitchen tools, gadgets, utensils and flatware with drawer organizers. Either fill your drawer with individual organizers or use an expandable utensil tray. You can also use expandable drawer dividers to separate long-handled wooden utensils and spatulas.</li><li>Pantry organizers: Pantry organizers maximize your storage space and give you easy access to your food and small appliances. Group like items in caddies, stackable baskets, and storage bins. Use Lazy susans to put condiments, oils and spices within reach - especially in corners. And free up space with tiered spice racks and can organizers.</li><li>Refrigerator and freezer organizers: Food storage containers lessen food waste by keeping ingredients and leftovers fresh and organized. Look for ones with modular designs and leak-proof seals. Clear stackable storage bins and drawers keep contents visible and make the most of fridge space.</li><li>Sink and under-sink organizers: Help keep your sink and under-sink area tidy and organized with products such as dish racks, utensil holders, shelves for cleaning supplies, and pull-out drawers for linens.</li><li>Countertop organizers: Items such as paper towel holders, knife blocks, wine racks, and cutting board racks help give you more counter space to work with while cooking.</li></ul></p></div>", "isCategoryLanding": false, "isClpTemplateType": true, "categories": [{"id": 93286, "displayName": "COLLEGE: SNACKS", "imageAltText": "College: Snacks", "imageUrl": "/catalogimages/643727/250x250xcenter/EL_10037559_printer_fridge_platinum.jpg", "generatedUrl": "/s/featured/the-college-shop/kitchen-essentials/123"}, {"id": 93297, "displayName": "BEYOND: KITCHEN", "imageAltText": "Beyond: Kitchen", "imageUrl": "/catalogimages/644070/250x250xcenter/10116381-335665-BBB-ven.jpg", "generatedUrl": "/s/bed-bath-and-beyond/kitchen-bed-bath-beyond/12"}, {"id": 74106, "displayName": "PANTRY ORGANIZERS", "imageAltText": "Pantry Organizers", "imageUrl": "/catalogimages/518865/250x250xcenter/10079454-urban-stackable-basket-deep.jpg", "generatedUrl": "/s/kitchen/pantry-organizers/12"}, {"id": 176, "displayName": "FOOD STORAGE", "imageAltText": "Food Storage", "imageUrl": "/catalogimages/518095/250x250xcenter/10075145-OXO-1.1-qt-POP-Container-Sm.jpg", "generatedUrl": "/s/kitchen/food-storage/12"}, {"id": 184, "displayName": "CABINET ORGANIZERS", "im
