s://schema.org\"},\"review\":[{\"author\":{\"name\":\"GEORGE F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-25T09:17:37\",\"description\":\"Been in a funk since the pandemic. Have taken my cameras out with me on occasion, but just was out of it creatively. I've been thinking about a GR since the GRII and decided something i can take with me a put in my pocket would help get the juices flowing. I'm very happy to say that the spark is back. its a very fun camera to use and so simple to take with you. I've shot about 1000+ photos so far and I'm loving it and making photos again. I'm now wielding two cameras on me even when I'm out in the woods riding my bike. Really enjoying taking it around with me wherever i go!\",\"name\":\"Put it in you pocket and go!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Orawan S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-18T18:04:23\",\"description\":\"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.\",\"name\":\"Exactly what I was looking for in a camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"RODRIGO O.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-09T08:45:47\",\"description\":\"Everything is perfect, great camera, great service!\",\"name\":\"Perfect\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Andrew D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-07T09:49:56\",\"description\":\"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \\\"good enough\\\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.\",\"name\":\"Travel\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ANDREW S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-22T19:55:17\",\"description\":\"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.\",\"name\":\"Amazing and Annoying\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":18,\"item\":{\"name\":\"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Charcoal Silver\",\"description\":\"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Charcoal Silver\",\"url\":\"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-xc-13-33-mm-lens/p/ifjxt30m3kcs\ escription\":\"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !\",\"name\":\"WORTH EVERY PENNY\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"CAMILA F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-11T18:26:01\",\"description\":\"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.\",\"name\":\"Fun learning experience\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ANA E.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-11T12:51:51\",\"description\":\"It's a great camera, love that you can use recipes and it aarived really quick\",\"name\":\"Best camera ever\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"NOMAN F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-02-26T14:33:08\",\"description\":\"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!\",\"name\":\"Love it!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"AUSTIN D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-02-15T11:03:05\",\"description\":\"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.\",\"name\":\"Greatest Camera Ever\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"John H.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-01-29T12:56:24\",\"description\":\"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\\n\\nSomethings I dislike about this camera are\\n\\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\\n\\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\\n\\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\\n\\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam\",\"name\":\"Great entry levels with some gripes\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":19,\"item\":{\"name\":\"Sony Alpha a7 IV Mirrorless Camera, Bundle with Camera Backpack, Green Extreme NP-FZ100 Battery\",\"description\":\"Sony Alpha a7 IV Mirrorless Camera, Bundle with Included Value\",\"url\":\"https://www.adorama.com/sony-alpha-a7-iv-mirrorless-camera-bundle-128gb-backpack-battery/p/isoa7m4ak\",\"mpn\":\"ILCE-7M4/B AK\",\"sku\":\"ISOA7M4AK\",\"image\":\"https://www.adorama.com/images/product/sony-alpha-a7-iv-mirrorless-black_isoa7m4ak.webp\",\"offers\":[{\"priceCurrency\":\"USD\",\"itemCondition\":\"https://schema.org/NewCondition\",\"businessFunction\":\"http://purl.org/goodrelations/v1#Sell\",\"availability\":\"https://schema.org/InStock\",\"price\":\"1998.00\",\"seller\":{\"@type\":\"Organization\",\"name\":\"Adorama\"},\"shippingDetails\":{\"@type\":\"OfferShippingDetails\",\"shippingRate\":{\"@type\":\"MonetaryAmount\",\"value\":\"0.00\",\"currency\":\"USD\"},\"shippingDestination\":{\"@type\":\"DefinedRegion\",\"addressCountry\":\"US\"},\"deliveryT \":{\"name\":\"Joshua W.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-06T18:45:50\",\"description\":\"Love the quality straight out the camera, the large buttons are very nice. Just gets warm pretty quick.\",\"name\":\"Pretty solid\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"BRIAN S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-26T10:00:52\",\"description\":\"This is an excellent camera, highly recommended!\",\"name\":\"Excellent Camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Sean123423\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-17T20:00:00\",\"description\":\"Warning: Think twice before ordering expensive equipment directly from Sony.\\n\\nI ordered approximately $3,500 worth of camera equipment directly from Sony because their website promised delivery in time for an event I was hosting. The package never arrived.\\n\\nFedEx tracking showed multiple delivery exceptions. Sony requested it be returned to warehouse, yet Sony's website still marked my order as \\\"Delivered\\\" and \\\"Completed.\\\"\\n\\nAfter nearly two weeks of contacting both Sony and FedEx, I was finally told that the camera had been returned to Sony's warehouse and that I would receive a refund. Its not been 10 days since that message and there has been NO REFUNDS FOR THE PRODUCT. They have STOLEN $3500 from me.\\n\\nAs of writing this review, the only refund I have received is $109 for the protection plan. I am still out approximately $3,500.\\n\\nShipping problems happen. Terrible customer service doesn't have to.\\n\\nThe worst part of this experience was:\\n? No proactive communication\\n? Confusing and inaccurate tracking information\\n? Being bounced between Sony and FedEx\\n? Having an order marked delivered when it never was\\n? Still waiting on thousands of dollars to be refunded\\n\\nSony is a multibillion dollar company and they have stolen $3500 from me. as a customer who spent $3,500 and still doesn't have the product or my money back, that's exactly how this experience feels.\",\"name\":\"DO NOT BUY FROM SONY - HORRIBLE CUSTOMER SERVICE\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ROBERT R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-26T11:47:07\",\"description\":\"For me it was Definitely a good choice.\",\"name\":\"Sony a7iv\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Derrick M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-12T13:36:31\",\"description\":\"Great camera..Definitely worth the money.\",\"name\":\"Get it!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Deepraj M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-12T10:54:44\",\"description\":\"Superb and awesome\",\"name\":\"Beastly Best\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ALEJANDRO M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-05T08:15:25\",\"description\":\"Great camera. Using it for sports. Lightweight, and amazing quality.\",\"name\":\"Great Camera, quality and price\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Aaron L.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-03T14:19:37\",\"description\":\"I decided that sony was the move so what did I do, I sold my gear to Adorama for a used A7IV and the condition I received was amazing! Sure I would have loved something new, I could only afford something used and even still I would have thought it was new in box from the factory.\",\"name\":\"Used A7IV First Impressions\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Mario H.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-27T11:12:00\",\"description\":\"Very good camera for a starter\",\"name\":\"Great starter\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Brandon R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-14T11:24:14\",\"description\":\"Really a great camera.  Probably Sony's best entry level professional camera (you need simultaneous shooting).  \\n\\nIf you do video - do a slight upgrade to the FX2.  The fan, shutter angle and timecode are worth the extra cost.  I have been able to overheat this camera when shooting long moments in 4K.  \\n\\nBut this camera rocks.  Beast in lowlight.  When using it for video - I've repeatedly been surprised by how high I can crank the ISO.  Even when shooting with an FX3 - ISO 12,800 often looked just as good on this camera.  I've shot some dance footage at weddings that was very grainy, but usually it performs perfectly.  Even the most lowlight photos will cleanup wonderfully.\\n\\nIf you can afford the A7V go for it.  The autofocus improvements alone are worth it.  If not - this camera is worth every penny.  I've used it for years and have loved every shoot I've done with it.\",\"name\":\"One of the best\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"valerielindseyphotography\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-16T20:00:00\",\"description\":\"I purchased an A7IV in October of 2022 and in July of 2025 it gave me an error message. The IBIS system had apparently malfunctioned- whatever, no big deal, I get that happens sometimes. Purchased a new one in July 2025 to replace the one being repaired, six months later (literally January 2026) the NEW camera I bought in July is giving me the same error. I cannot get in contact with a Sony representative to get this issue resolved, and if i do, they tell me to turn it off and back on and replace the battery (which i've done). Nobody will take it seriously and give me a legitimate reason why, after six months, a brand new camera stops working. Never been dropped or bumped either, mind you. I can only use it on electronic shutter mode otherwise it stops working. Unacceptable. I spent almost $3k on this camera and it gave out after six months of not even heavy use?\",\"name\":\"Shutter Malfunction Beware!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"KRISTIN T.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-02-12T02:13:57\",\"description\":\"After my fiancé bought this camera I started to get interested in photography. He bought his mostly for videos but also to do photography as well. I'm mostly interested in it for photography but love the option of video. Truly an awesome versatile camera and I've been having so much fun learning and taking photos! Has quickly become a passion!\",\"name\":\"If you're on the fence.. just get it! You won't regret it!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Sebastian B.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-02-03T08:18:40\",\"description\":\"Best. Camera quality for this price\",\"name\":\"Amazing\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"BRITTON D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-12-25T08:24:12\",\"description\":\"So far so good.  Amateur here so still learning my way around it but so far it's been great.\",\"name\":\"Loving it\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"HAROLD R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-12-10T10:53:29\",\"description\":\"So far a great upgrade from my a6500. The low light performance, auto focus and video quality are a world better.\",\"name\":\"Upgrade worth it\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"CARLOS A.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-10-24T10:53:49\",\"description\":\"I purchased the Sony A7 IV in October 2024, and after using it alongside my Sony A9, the conclusion is clear: the A7 IV is a less durable camera in almost every aspect.\\n\\nThe main issue I encountered is the rear screen. Even with a protective glass applied from day one, the screen still ended up cracked under normal use. I never experienced this problem with the A9, which confirms that the A7 IV is built with weaker materials. For a camera at this price point, that is disappointing.\\n\\nOverall, the camera delivers on image quality and features, but its durability is not at the level required for demanding professional use. In photography, where equipment must withstand real working conditions, specifications on paper mean very little if the body cannot handle the workload.\\n\\nIn conclusion, the Sony A7 IV offers strong specs, but the fragility of its screen and the overall lack of sturdiness compared to the A9 make it a poor choice for those who value long-term reliability and resistance.\",\"name\":\"? My Personal Review of the Sony A7 IV\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"KENNETH P.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-08-15T15:51:20\",\"description\":\"I am very, very pleased with my purchase of the Sony A7 IV camera through Adorama. The last time I used a full frame camera was a Pentax 35mm film. The pictures are beautiful. I've only been viewing them on an iPad and I can't wait to do some enlargement prints. This is a great low-level professional level mirrorless, and it has tons of features, but the visible controls are traditional so I could charge up the battery and start shooting with great results. If you're willing to go a little over $2k, you won't regret it. Adorama is always great to deal with and worked with me on some camera/lenses trade-ins. If your thinking about going full frame, give this camera some consideration.\",\"name\":\"Great Full Frame Camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Laszlo F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-07-30T13:16:09\",\"description\":\"I had a very pleasant experience buying this beautiful item, thank you.\",\"name\":\"A7 iv is great highly recommended, great shopping thank you\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"MARK M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-07-29T21:48:14\",\"description\":\"Great bundle and the camera is everything I was looking for.\",\"name\":\"Short and sweet\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"KATE A.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-07-18T08:08:01\",\"description\":\"Ordering was smooth, the site worked perfectly, and the bundle matched the complete product description. It shipped in two business days, arrived well-packaged, and everything works flawlessly. No issues with the camera or accessories. Overall, a positive experience and I'd buy from them again.\",\"name\":\"Great experience buying Sony a7 IV bundle from Adorama!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"SHALOM C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-07-15T08:39:57\",\"description\":\"This camera was quite an upgrade! Going from my a7iii to the iv is a world of difference and Adorama made it easy!\\n10 bit color, the new menu system, the shots are amazing straight out of camera!\\nWould recommend easily as a great hybrid for photo or video, both stunning.\",\"name\":\"Quite an upgrade!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"RICH D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-05-28T10:44:58\",\"description\":\"Terrific camera. Love it\",\"name\":\"Rld\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ARCHIE M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-05-21T08:20:12\",\"description\":\"Amazing camera!\",\"name\":\"Sony a74\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ALINA K.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-05-01T08:07:05\",\"description\":\"I really recommend this camera! The best\",\"name\":\"The best!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"JESSE W.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-04-23T03:11:07\",\"description\":\"This is my second A7iv, and there is a reason I bought another. Because I like it, and I needed a backup body.\",\"name\":\"Standby\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"GUY L.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-01-04T09:27:11\",\"description\":\"This is my 2nd Sony a7iv. Love this versatile all around camera. It always makes my work easier. Adorama's bundle just makes the experience that much better. Thanks Adorama!\",\"name\":\"Sony A7IV\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"EUGENE G.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-01-01T07:22:17\",\"description\":\"The a7 IV is a fantastic camera for a variety of photographers ranging from the amateur to the advanced/professional. While I'm still learning the many features, I love the wide range of customization it provides.\",\"name\":\"a7 IV initial thoughts\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"JUDY R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2024-12-24T08:00:38\",\"description\":\"After a lot of shopping around for our camera, Adorama gave us the best pricing and fabulous customer service!  Meyer is the best!!\",\"name\":\"Look no further?\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":20,\"item\":{\"name\":\"Canon EOS R6 Mark II Mirrorless Camera, Bundle with LP-E6NH Battery, 64GB Memory Card \u0026 Smart Charger Kit\",\"description\":\"Canon EOS R6 Mark II Camera, Bundle with Included Value\",\"url\":\"https://www.adorama.com/canon-eos-r6-mark-ii-mirrorless-camera-body-bundle-lp-e6nh-battery-64gb-card/p/car6m2ek\",\"mpn\":\"5666C002 EK\",\"sku\":\"CAR6M2EK\",\"image\":\"https://www.adorama.com/images/product/canon-eos-r6-mark-ii-mirrorless_car6m2ek.webp\",\"offers\":[{\"priceCurrency\":\"USD\",\"itemCondition\":\"https://schema.org/NewCondition\",\"businessFunction\":\"http://purl.org/goodrelations/v1#Sell\",\"availability\":\"https://schema.org/InStock\",\"price\":\"1999.00\",\"seller\":{\"@type\":\"Organization\",\"name\":\"Adorama\"},\"shippingDetails\":{\"@type\":\"OfferShippingDetails\",\"shippingRate\":{\"@type\":\"MonetaryAmount\",\"value\":\"0.00\",\"currency\":\"USD\"},\"shippingDestination\":{\"@type\":\"DefinedRegion\",\"addressCountry\":\"US\"},\"deliveryTime\":{\"@type\":\"ShippingDeliveryTime\",\"handlingTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":0,\"maxValue\":1,\"unitCode\":\"DAY\"},\"transitTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":1,\"maxValue\":1,\"unitCode\":\"DAY\"},\"businessDays\":[{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":[\"https://schema.org/Monday\",\"https://schema.org/Tuesday\",\"https://schema.org/Wednesday\",\"https://schema.org/Thursday\",\"https://schema.org/Friday\"],\"opens\":\"09:00\",\"closes\":\"17:00\"},{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":\"https://schema.org/Sunday\",\"opens\":\"10:00\",\"closes\":\"17:00\"}]}},\"hasMerchantReturnPolicy\":{\"@type\":\"MerchantReturnPolicy\",\"applicableCountry\":\"US\",\"returnPolicyCategory\":\"https://schema.org/MerchantReturnFiniteReturnWindow\",\"merchantReturnDays\":30,\"returnMethod\":\"https://schema.org/ReturnByMail\",\"returnFees\":\"https://schema.org/FreeReturn\"},\"@type\":\"Offer\",\"@context\":\"https://schema.org\"}],\"@type\":\"Product\",\"@context\":\"https://schema.org\",\"brand\":\"Canon\",\"aggregateRating\":{\"reviewCount\":\"238\",\"bestRating\":\"5\",\"ratingValue\":\"4.5\",\"worstRating\":\"1\",\"@type\":\"AggregateRating\",\"@context\":\"https://schema.org\"},\"review\":[{\"author\":{\"name\":\"PhotoBomb\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-13T20:00:00\",\"description\":\"Wose camera I ever bought, broke 4 times after the year warranty and now, it's broke again. Sticky shutters, bad UI, stuck in video mode, stuck in MF, just like thing after thing.\",\"name\":\"Don't Buy This Camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Brandon S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-08T19:10:30\",\"description\":\"I love this camera! Made the jump to mirrorless from the Canon EOS 5D Mark IV and WOW it is night and day. The image quality is 100% more crisp, the OS is easy to navigate and set up, the AI autofocusing and subject tracking is top tier, and the overall build quality is unmatched. I can not say how much I enjoy this camera.\",\"name\":\"Best camera purchase I've made in years\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Sourav B.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-08T09:23:47\",\"description\":\"Overall, I'm very happy with my Canon R6 Mark II. The image quality and overall shooting experience have been excellent, and the camera feels very capable for travel, street, and everyday photography.\\n\\nThe battery life is decent and works well for my typical shooting needs.\\n\\nOne issue I have noticed is that the camera sometimes shows \\\"Busy\\\" while capturing photos, even though I'm using a 128GB UHS-II memory card.\",\"name\":\"Canon EOS R6 Mark II - Review\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Sourav B.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-08T09:22:35\",\"description\":\"Overall, I'm very happy with my Canon R6 Mark II. The image quality and overall shooting experience have been excellent, and the camera feels very capable for travel, street, and everyday photography.\\nThe battery life is decent and works well for my typical shooting needs.\\n\\nOne issue I have noticed is that the camera sometimes shows \\\"Busy\\\" while capturing photos, even though I'm using a 128GB UHS-II memory card.\",\"name\":\"Canon EOS R6 Mark II - Overall Review\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"John C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-07T16:19:36\",\"description\":\"I've team R6MII with a RF100-500MM lens to shoot primarily my daughter soccer games (first use of the camera). The attached photo was taken at approximate 70 yards away, 500mm zoom, 1/1600 second, and 3200 ISO. It was cropped a bit.  Since I am taking soccer photos, my desire is to keep the shutter speed above 1/1000 and let the camera adjust the ISO as needed.  Noise is not an issue.\\n\\nIn a night-time semi-professional game, I had to raise the ISO to 16,000 to achieve a shutter speed of 1/1,250 sec at 118mm. While there is some noise when zoomed in, when viewing the entire photo it is not a problem.\\n\\nI've found the camera to be very easy to use with intuitive menus.\\n\\nRegarding the 100-500mm lens, true it has less bokah than a F/2.8 but I love the reach of obtaining good pictures at 70+ yards. Furthermore, in soccer, you want some context as to other players around the ball.\",\"name\":\"Soccer\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DANA C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-25T08:14:59\",\"description\":\"Better than advertised and so excited to have been able to upgrade!!\",\"name\":\"Adorama for the W!!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"MARIA C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-21T08:19:53\",\"description\":\"I had change my Camera from Niko to Canon and what a big difference?\",\"name\":\"Very happy with my purchase\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"JD12 C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-19T20:00:00\",\"description\":\"The Canon EOS R6 Mark II has been an excellent upgrade for my portrait photography. Autofocus is fast and dependable, eye detection makes working with clients much easier, and the image quality gives me plenty of flexibility when editing RAW files. The controls feel intuitive, performance is responsive, and the combination of strong still-photo features with capable video makes it a versatile camera for both client work and social media content.\",\"name\":\"Canon EOS R6 Mark II: A Versatile Upgrade for Portraits and Video\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Tab H.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-12T20:00:00\",\"description\":\"Solid camera body. Def a great upgrade. Easy to update.\",\"name\":\"Happy buyer\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Paige W.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-06T10:04:33\",\"description\":\"Great camera and quick shipping! Arrived in a couple of days in great shape, well packaged.\",\"name\":\"Quick shipping, great gear\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DANIEL B.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-05T06:40:10\",\"description\":\"I've been shooting with Nikon cameras since the 80's and that's fine since I've mostly been shooting stills.  But more and more, I'm also shooting more video, and my experience with Canon mirrorless has made getting good video much easier.  \\nI decided to move to Canon for both video and stills and am still getting accustomed to the menus etc, but the quality I'm seeing is much better than what I could do w/Nikon.\",\"name\":\"Former Nikon guy, now Canon guy....it's been a 40 yr journey\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"shawn t.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-01T19:34:01\",\"description\":\"My first mirrorless camera and I'm in love!\",\"name\":\"Amazing\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Danielle M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-01T07:33:15\",\"description\":\"The Canon R6 Mark II is an incredible camera, so much lighter than my DSLR (Mark 5 IV)! Image quality is supurb and and I can't recommend it enough! I shoot a lot of different content from portraits to street photography to events, and this camera can do it all!\",\"name\":\"Amazing Camera!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Kerby\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-22T20:00:00\",\"description\":\"I order my camera on a Tuesday and paid for 2 day shipping.  I need the camera for that sunday wedding.  Fed Ex said they tried to deliver on Thursday and we were not home which is a lie.  On the camera you can see Fed ex get out at our garage, take a picture and leave.  They came back again on Friday and did the same thing.  Then they came again on Monday and said it was delivered but no one was home as we left after the wedding on Sunday and there was not camera at the house.  I tried calling Canon but you CAN NOT get ahold of anyone.  So I filed a dispute with my credit card.  This is a joke that you can not get ahold of anyone at Canon.\",\"name\":\"Horrible Experience\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ROBERT D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-17T09:40:03\",\"description\":\"Great purchase\",\"name\":\"Great\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DAVE C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-28T13:50:08\",\"description\":\"Excellent camera and fast delivery. Everything ordered arrived well packaged. Thanks again Adorama for superb service.\",\"name\":\"Great camera and fast delivery.\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"PENNY M.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-20T07:58:35\",\"description\":\"Love this camera!  Adorama was great to work with and all shipped promptly\",\"name\":\"Great camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"r p.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-14T20:00:00\",\"description\":\"Second time owning the R6 Mark II.  Good camera, just the right amount of megapixels for me.  Produces nice images with a proper lens.\",\"name\":\"Nice Camera System\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DAVE C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-12T12:12:45\",\"description\":\"What a great upgrade from the R10. Love all the items in the bundle. And the shipping was incredibly fast!\",\"name\":\"Upgraded from R10 to R6MKii\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"MEGHAN K.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-12T08:15:20\",\"description\":\"This camera is absolutely amazing and came with a perfect package of included items. I have loved using it so far and can't wait to see what wonderful photos it brings in the future! Definitely recommend this camera and Adorama.\",\"name\":\"R6 Mark ii - THE BEST\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DENNIS D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-03T11:42:11\",\"description\":\"Love everything in the kit. \\nStill learning to use the camera\\nWhat an upgrade from a DSLR T1 .\",\"name\":\"Upgrade from T1i\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Jim C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-25T05:27:08\",\"description\":\"Great camera, thouroughly enjoying it\",\"name\":\"R6 Mark II is awesome\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"AIDAN P.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-23T09:11:54\",\"description\":\"Excellent value for one of the best cameras in the game right now\",\"name\":\"Jump on this\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Jim C.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-18T16:32:40\",\"description\":\"My first quality camera purchase. I had rented this camera for a Yellowstone vacation and got to trial/error with it. Even the \\\"errors\\\" produced very good images. When I decided to purchase, I did not hesitate to use Adorama. It's been a great camera the past 6 months and I am looking forward to a lot of happy experiences with it.\",\"name\":\"Canon R6 Mark II\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"CHRISTINE B.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-17T08:41:47\",\"description\":\"The Canon EOS R6 Mark II is an incredibly capable camera that delivers true professional performance in both photo and video. The autofocus is fast, accurate, and locks onto subjects effortlessly, with excellent eye tracking that makes shooting people especially easy. Low-light performance is outstanding, allowing clean images at higher ISOs without sacrificing detail.\\n\\nThe in-body image stabilization is a huge advantage for handheld shooting, producing smooth, usable footage without needing heavy gear. Video quality is sharp and detailed, with Canon's color science producing natural, flattering skin tones right out of the camera.\\n\\nErgonomically, it's comfortable to use for extended sessions, with an intuitive menu system and a fully articulating screen that's perfect for solo shooting. Battery life has also been reliable.\\n\\nOverall, the R6 Mark II is a powerful, well-rounded camera that performs consistently in real-world conditions and elevates the quality of any workflow.\",\"name\":\"Canon EOS R6 Mark II: Fast, Reliable, and Professional-Level Performance for Photo and Video in Any Lighting Conditions\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"TIFFANY R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-16T11:43:36\",\"description\":\"I got this to upgrade my Canon 5D Mark III and was somewhat worried to \\\"step down\\\" to the R6 vs the R5. However this was truly a step UP even though it's not the same \\\"series\\\".  This camera out performs my old 5D Mark III in almost every way.  It was a bit rough transitioning to the different buttons and such, but overall it was pretty easy once I figured out where everything was.  Adorama had the best bundle price, which is a fantastic way to save on some extra accessories.  This was my first time buying from Adorama, and I'm very happy with my purchase!\",\"name\":\"Great Mirrorless Option!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"TIFFANY R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-09T12:11:10\",\"description\":\"This is a fantastic bundle of you are looking to get the Canon R6! It comes with so many helpful extras and add ons and at the time when I purchased it, it was literally the same price as just the body was, so it was such a great deal. Overall I'm very happy with this bundle.\",\"name\":\"Great Bundle!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Bryan S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-03T09:39:59\",\"description\":\"Just picked it up recently, and wow, the jump from the Canon 90D is huge. I still love the 90D, but I've been wanting to dive into mirrorless for a while, and this is my first real entry into that world. Can't wait to get more shoots in. I'm having a ton of fun with it already.\",\"name\":\"Upgrade\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"PHILIP D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-24T09:16:10\",\"description\":\"I bought this as an upgrade from an EOS RP.  It is a BIG upgrade, the R6 Mark II is better in every aspect.  There is a lot to learn, but I'm retired and have the time.  I'm Very satisfied.\",\"name\":\"A worthy upgrade from an EOS RP\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Rico\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-20T20:00:00\",\"description\":\"Excellent camera at an excellent price.  The camera may not be the latest model but it is all you need.\",\"name\":\"I got lucky\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":21,\"item\":{\"name\":\"Ricoh GR IV HDF Digital Camera\",\"description\":\"Ricoh GR IV HDF Digital Camera\",\"url\":\"https://www.adorama.com/ricoh-gr-iv-hdf-digital-camera/p/ircgr4nhdf\",\"mpn\":\"01568\",\"sku\":\"IRCGR4NHDF\",\"image\":\"https://www.adorama.com/images/product/ricoh-gr-iv-hdf-premium-compact-camera_ircgr4nhdf.webp\",\"offers\":[{\"priceCurrency\":\"USD\",\"itemCondition\":\"https://schema.org/NewCondition\",\"businessFunction\":\"http://purl.org/goodrelations/v1#Sell\",\"availability\":\"https://schema.org/InStock\",\"price\":\"1696.95\",\"seller\":{\"@type\":\"Organization\",\"name\":\"Adorama\"},\"shippingDetails\":{\"@type\":\"OfferShippingDetails\",\"shippingRate\":{\"@type\":\"MonetaryAmount\",\"value\":\"0.00\",\"currency\":\"USD\"},\"shippingDestination\":{\"@type\":\"DefinedRegion\",\"addressCountry\":\"US\"},\"deliveryTime\":{\"@type\":\"ShippingDeliveryTime\",\"handlingTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":0,\"maxValue\":1,\"unitCode\":\"DAY\"},\"transitTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":1,\"maxValue\":1,\"unitCode\":\"DAY\"},\"businessDays\":[{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":[\"https://schema.org/Monday\",\"https://schema.org/Tuesday\",\"https://schema.org/Wednesday\",\"https://schema.org/Thursday\",\"https://schema.org/Friday\"],\"opens\":\"09:00\",\"closes\":\"17:00\"},{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":\"https://schema.org/Sunday\",\"opens\":\"10:00\",\"closes\":\"17:00\"}]}},\"hasMerchantReturnPolicy\":{\"@type\":\"MerchantReturnPolicy\",\"applicableCountry\":\"US\",\"returnPolicyCategory\":\"https://schema.org/MerchantReturnFiniteReturnWindow\",\"merchantReturnDays\":30,\"returnMethod\":\"https://schema.org/ReturnByMail\",\"returnFees\":\"https://schema.org/FreeReturn\"},\"@type\":\"Offer\",\"@context\":\"https://schema.org\"}],\"@type\":\"Product\",\"@context\":\"https://schema.org\",\"brand\":\"Ricoh\",\"aggregateRating\":{\"reviewCount\":\"5\",\"bestRating\":\"5\",\"ratingValue\":\"5\",\"worstRating\":\"1\",\"@type\":\"AggregateRating\",\"@context\":\"https://schema.org\"},\"review\":[{\"author\":{\"name\":\"GEORGE F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-25T09:17:37\",\"description\":\"Been in a funk since the pandemic. Have taken my cameras out with me on occasion, but just was out of it creatively. I've been thinking about a GR since the GRII and decided something i can take with me a put in my pocket would help get the juices flowing. I'm very happy to say that the spark is back. its a very fun camera to use and so simple to take with you. I've shot about 1000+ photos so far and I'm loving it and making photos again. I'm now wielding two cameras on me even when I'm out in the woods riding my bike. Really enjoying taking it around with me wherever i go!\",\"name\":\"Put it in you pocket and go!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Orawan S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-18T18:04:23\",\"description\":\"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.\",\"name\":\"Exactly what I was looking for in a camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"RODRIGO O.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-09T08:45:47\",\"description\":\"Everything is perfect, great camera, great service!\",\"name\":\"Perfect\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Andrew D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-07T09:49:56\",\"description\":\"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \\\"good enough\\\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.\",\"name\":\"Travel\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ANDREW S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-22T19:55:17\",\"description\":\"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.\",\"name\":\"Amazing and Annoying\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":22,\"item\":{\"name\":\"Hasselblad X2D II 100C Medium Format Mirrorless Camera + Hasselblad XCD 35-100mm f/2.8-4 E Lens\",\"description\":\"Hasselblad X2D II 100C Mirrorless Camera with XCD 35-100mm f/2.8-4 E Lens\",\"url\":\"https://www.adorama.com/hasselblad-x2d-ii-100c-mirrorless-camera-xcd-35-100-mm-f-2-8-4/p/hscphb92701l\",\"mpn\":\"CP.HB.00000927.01 L\",\"sku\":\"HSCPHB92701L\",\"image\":\"https://www.adorama.com/images/product/hasselblad-x2d-ii-100c-35-100mm-lens_hscphb92701l.webp\",\"offers\":[{\"priceCurrency\":\"USD\",\"itemCondition\":\"https://schema.org/NewCondition\",\"businessFunction\":\"http://purl.org/goodrelations/v1#Sell\",\"availability\":\"https://schema.org/InStock\",\"price\":\"12398.00\",\"seller\":{\"@type\":\"Organization\",\"name\":\"Adorama\"},\"shippingDetails\":{\"@type\":\"OfferShippingDetails\",\"shippingRate\":{\"@type\":\"MonetaryAmount\",\"value\":\"0.00\",\"currency\":\"USD\"},\"shippingDestination\":{\"@type\":\"DefinedRegion\",\"addressCountry\":\"US\"},\"deliveryTime\":{\"@type\":\"ShippingDeliveryTime\",\"handlingTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":0,\"maxValue\":1,\"unitCode\":\"DAY\"},\"transitTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":1,\"maxValue\":1,\"unitCode\":\"DAY\"},\"businessDays\":[{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":[\"https://schema.org/Monday\",\"https://schema.org/Tuesday\",\"https://schema.org/Wednesday\",\"https://schema.org/Thursday\",\"https://schema.org/Friday\"],\"opens\":\"09:00\",\"closes\":\"17:00\"},{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":\"https://schema.org/Sunday\",\"opens\":\"10:00\",\"closes\":\"17:00\"}]}},\"hasMerchantReturnPolicy\":{\"@type\":\"MerchantReturnPolicy\",\"applicableCountry\":\"US\",\"returnPolicyCategory\":\"https://schema.org/MerchantReturnFiniteReturnWindow\",\"merchantReturnDays\":30,\"returnMethod\":\"https://schema.org/ReturnByMail\",\"returnFees\":\"https://schema.org/FreeReturn\"},\"@type\":\"Offer\",\"@context\":\"https://schema.org\"}],\"@type\":\"Product\",\"@context\":\"https://schema.org\",\"brand\":\"Hasselblad\",\"aggregateRating\":{\"reviewCount\":\"14\",\"bestRating\":\"5\",\"ratingValue\":\"4.5\",\"worstRating\":\"1\",\"@type\":\"AggregateRating\",\"@context\":\"https://schema.org\"},\"review\":[{\"author\":{\"name\":\"Walter G.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-09-10T23:48:57\",\"description\":\"Unbelievable, excellence. I purchased this for myself for my 81st birthday. And I am in heaven on earth.\",\"name\":\"Hasselblad nothing more needs to be said??\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ELENA K.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-21T08:44:34\",\"description\":\"Went out West with this thing!  Used it like a street camera,  used it during lowest light conditions during a Rodeo,  used it close to waterfalls,  and facing a buffalo herd.  The only shot I missed was the milky way because I didn't have a tripod.  I did not throw out the camera,  actually I started treating it like the most precious jewel in my life,  this thing is superb! Just flawless.  At least for me,  having moved up from the original first, this camera is IT.\",\"name\":\"No single regret\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"KENNETH A.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-20T02:15:55\",\"description\":\"Dream camera finally achieved\",\"name\":\"Perfection\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Walter G.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-18T23:17:41\",\"description\":\"Well after selling all of my Hasselblad film cameras over 20 years ago. I have been a Leica fan for years.\\nI'm now in my 80's and have always missed the Hassy format. So for my 81st birthday I have returned to this magical camera again. I go on nature walks around my small town and drive a short distance to the Coburg hills for my landscape photography. I just have a passion for beautiful nature photography here in Oregon. I own a small ice cream store and compliment the shop with my landscapes all on canvas for sale. They sale very well.So I ordered a brand new hasselblad camera and lens. The medium format is just the best on earth. Nothing else comes close.\",\"name\":\"Back to the Hasselblad after 20 years with my Leica's.\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"EDWARD L.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-23T08:31:29\",\"description\":\"Fantastic camera that arrived in perfect condition\",\"name\":\"Hasselblad\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"EDWARD L.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-06-16T11:57:00\",\"description\":\"This is just the best camera ever made\",\"name\":\"Fabulous\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"DC P.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-05-17T10:36:55\",\"description\":\"Worked my way up to it. I have had Cannon EOS Mk 5, Olympus PEN F, Sony A7R IV, Leica SL2 then a Hasselblad X2D. Had the X2D for 2 weeks until I found an X2D II in stock at Adorama.\\n     This camera takes the best pictures bar none. Leica was close, but now that I have found Medium format, there is no going back. \\n     The detail is amazing, but better than that, the color science of the Hasselblad blows all the others out of the water. Straight out of the camera, the shots are awesome, But then edited with the Phocus app, astounding. \\n     The materials and build quality make the price reasonable. You get what you pay for. \\n     I could care less that it does not shoot video. I am a stills photographer anyway. One can only imagine the size of a video file if shot with this 100mp sensor.\\n     I was lucky enough to find a XCD 35-100mm F/2.8-4 E Lens to go with it and find its versatality, materials and build quality on the same par as the camera body. \\n     The simplicity of the menu is also a welcome feature. \\n     I am finally DONE! The search is over!!\",\"name\":\"The absolute best camera taking the best pictures. PERIOD!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"julie b.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-01-20T14:12:17\",\"description\":\"I got this camera with the 38v, and this camera blows me away. After 30 years of shooting. I forgot how it feels to be inspired by the actual camera itself. The image quality is shockingly incredible.   Just about every image has a soothing quality to it. I work outside in NYC, and I wear it around my neck at all times outside.  It's surprisingly light enough to carry all day. And it's built like a tank.  The EVF is the best I've ever used. It makes me feel one with the camera in an inspiring way.  The UX is very intuitive with minor gripes.  I also wish there were an option to choose a smaller MP file. And the Hasselblad Phocus program that you have to use is not the best and is sort of a pain.  But the camera and images are so amazing that I'm not too bent out of shape about it.\",\"name\":\"At the very least go try this camera at the store. it's amazing!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Seshadri R.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-01-08T11:02:40\",\"description\":\"Excellent camera A although the lens has not yet arrived! Got the 28 mm for the time being to use with the camera. Without that I could not even test it!\",\"name\":\"Excellent camera-\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"VINCENT K.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-12-05T06:37:31\",\"description\":\"Very pleased with the picture quality. Selected full auto for my first walk around town and can't wait for my favorite night light shots. I'll send a few when my CF card reader shows up. The capabilities are in excess of my my imagination.\",\"name\":\"In Excess of my Imagination\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Stephane S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-11-27T19:10:22\",\"description\":\"Be careful !!! None of the other lenses for the H2DII are compatible with any of the X2D II improvements over the X2D I ; you can take pictures yes but you cannot use HDR, auto focus continuous, PdAf and LiDAR focus, 5-Axis, 10-Stop In-Body Image Stabilisation won't work neither unless you buy the lenses that just came out.\\n\\nAlso Hasselblad changed manufacturing for the lcd so it's no longer true to colors but slightly towards blue tones?\",\"name\":\"Buyer BEWARE !!! Lens Incompatibility !\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"MICHAEL J.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2025-09-25T08:36:10\",\"description\":\"Image quality is the best out there. Plus, the camera is gorgeous.\",\"name\":\"Hasselblad X2D2\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"TIMOTHY O.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\
