<html><head><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"deviceType":"desktop","isFullReload":true,"forceReload":false,"isUsedProducts":false,"viewType":"list","banner":{"bodyContent":"\u003csection id=\"promoBanner1ColDataWrap\" class=\"static-bannerism clear cf\"\u003e\u003ca href=\"https://www.adorama.com/g/canon-bundle-and-save\"  target='_blank'  data-promo=\"Canon bundle and save\"\u003e\u003cpicture class=\"product-display-banner\" data-lazyload-images\u003e\u003csource media = \"(max-width: 599px)\" srcset=\"https://www.adorama.com/images/cms/73775Canon_Bundle_and_Save-PLP-Banner-Mobile@2x_44439.jpg\" data-lazyload-images\u003e\u003csource media = \"(min-width: 599px)\" srcset=\"https://www.adorama.com/images/cms/73775Canon_Bundle_and_Save-PLP-Banner-Desktop@2x_05255.jpg\" data-lazyload-images\u003e \u003cimg src= \"https://www.adorama.com/images/cms/73775Canon_Bundle_and_Save-PLP-Banner-Desktop@2x_05255.jpg\"  alt=\"Canon bundle and save\"   data-aspect-ratio-mobile=\"15/8\" data-aspect-ratio-desktop=\"539/72\"  data-lazyload-images loading='lazy'\u003e\u003c/picture\u003e\u003c/a\u003e\u003c/section\u003e"},"brandLogo":"","categorySeoText":"Whether you're a beginner or a seasoned photographer, digital cameras offer the perfect solution for capturing your world in stunning detail. From lightweight point-and-shoot models to advanced professional-grade equipment, the selection of digital cameras available at Adorama meets every need and budget. These cameras provide high-quality results with the convenience of digital technology, making it easier than ever to take your photography to the next level.\r\nIn addition to standalone digital cameras, Adorama also carries digital camera kits that come with essential accessories to help you get started. These kits often include lenses, memory cards, camera bags, and other must-have items, so you can be ready for your next shoot without any delays. Whether you're shooting landscapes, portraits, or videos, these kits are designed to provide all the tools needed for optimal performance.\r\nWith a broad selection from top brands like Canon, Nikon, Sony, and Fujifilm, you can trust that the digital cameras and digital camera kits at Adorama will deliver reliable, high-quality results. Explore our collection to find the ideal camera setup for your needs, whether you're capturing everyday moments or embarking on a more specialized photography project.\r\n\r\n\u003cp\u003eCameras come in a range of shapes, sizes, styles, and capabilities. The first step in finding the right camera for your needs is to determine what exactly you hope to use it for. Are you a nature photographer who travels the world? Do you record short videos for your YouTube channel? Each type of camera is best suited for a different kind of use.\u003c/p\u003e\r\n\u003ch2\u003eWhat Different Types of Cameras Does Adorama Sell?\u003c/h2\u003e\r\n\u003cp\u003eAt Adorama, we carry a wide range of cameras for a variety of uses. Let\u0026rsquo;s take a look at the different types and what makes them unique.\u003c/p\u003e\r\n\u003ch3\u003eCompact Digital Cameras\u003c/h3\u003e\r\n\u003cp\u003ePoint-and-shoot cameras, also known as compact digital cameras, prioritize a smaller size and ease of use over professional-grade results or functionality. While they offer some flexibility in their manual settings, they\u0026rsquo;re typically used for quick shots.\u003c/p\u003e\r\n\u003ch3\u003eDigital SLR Cameras\u003c/h3\u003e\r\n\u003cp\u003e\u003ca href=\"https://www.adorama.com/l/Photography/Cameras/Digital-SLR-Cameras\r\n\"\u003eDSLR cameras\u003c/a\u003e feature an interchangeable lens format for added flexibility. Many DSLRs have larger sensors and need to accommodate an internal mirror, so they\u0026rsquo;re physically larger than other types of cameras.\u003c/p\u003e\r\n\u003cp\u003eIf you\u0026rsquo;re looking for a camera that excels at photography and videography with plenty of manual and automatic settings, you should consider a DSLR.\u003c/p\u003e\r\n\u003ch3\u003eMirrorless Cameras\u003c/h3\u003e\r\n\u003cp\u003eMirrorless cameras\u0026nbsp;strike the balance between DSLR functionality and point-and-shoot size. These cameras work without mirrors, so your viewfinder shows you an electronic preview of your image. Mirrorless cameras also have interchangeable lenses and are commonly used by intermediate to professional photographers.\u003c/p\u003e\r\n\u003ch3\u003eMedium Format Digital Cameras\u003c/h3\u003e\r\n\u003cp\u003eMedium format cameras, most often used by professional photographers, feature a much larger sensor than your average DSLR or mirrorless camera. These cameras offer some of the highest possible resolution so you can print or display your images in a large size without quality loss.\u003c/p\u003e\r\n\u003ch3\u003eAction Cameras\u003c/h3\u003e\r\n\u003cp\u003eThese cameras are best known for their durability and their ability to withstand drops, shakes, moisture, dust, and other hazards. They\u0026rsquo;re small and portable, and you can hold them or attach them to objects such as helmets, bikes, or surfboards.\u0026nbsp;\u003ca href=\"https://www.adorama.com/brands/GoPro\"\u003eGoPro\u003c/a\u003e is one of the most popular action camera brands.\u003c/p\u003e\r\n\u003ch3\u003e360 Cameras\u003c/h3\u003e\r\n\u003cp\u003e360 cameras\u0026nbsp;usually have two or more lenses to capture full 360-degree images and videos. These cameras let you capture amazing footage without worrying about framing.\u003c/p\u003e\r\n\u003ch3\u003eFilm Cameras\u003c/h3\u003e\r\n\u003cp\u003eFilm cameras are fully analog and use common film formats like 35mm film or instant film cartridges. If you want to know more, check out our article on the\u0026nbsp;\u003ca href=\"https://www.adorama.com/alc/what-are-the-different-types-of-cameras-used-for-photography\"\u003edifferent types of cameras\u003c/a\u003e.\u003c/p\u003e\r\n\u003cp\u003eChoose from the Highest-Quality Cameras\u003c/p\u003e\r\n\u003cp\u003eNo matter what type of photography you prefer, you can look to brands like\u0026nbsp;\u003ca href=\"https://www.adorama.com/l/Photography/Canon~Cameras\"\u003eCanon\u003c/a\u003e,\u0026nbsp;\u003ca href=\"https://www.adorama.com/l/Photography/Sony~Cameras\"\u003eSony\u003c/a\u003e,\u0026nbsp;\u003ca href=\"https://www.adorama.com/l/Photography/Nikon~Cameras\"\u003eNikon\u003c/a\u003e,\u0026nbsp;\u003ca href=\"https://www.adorama.com/l/Photography/Panasonic~Cameras\"\u003ePanasonic\u003c/a\u003e, and\u0026nbsp;\u003ca href=\"https://www.adorama.com/l/Photography/Fujifilm~Cameras\"\u003eFujifilm\u003c/a\u003e to produce reliable, high-quality equipment designed to improve your photographic experience.\u003c/p\u003e","siteSettings":{"imagePaths":{"product":"https://www.adorama.com/images/product/","full":"https://www.adorama.com/images/300x300/","large":"https://www.adorama.com/images/Large/","xLarge":"https://www.adorama.com/images/XLarge/","thumb":"https://www.adorama.com/images/small/","medium":"https://www.adorama.com/images/130x130/"},"AbsoluteSiteUrl":"https://www.adorama.com","SearchPageUrl":"/l/","CompanyName":"Adorama","CMSImageOriginalSizePath":"https://www.adorama.com/images/cms/","EnableScubaPLP":false,"SortByBrandEnabled":false,"SortByPriceEnabled":true,"SortBySavingsEnabled":true,"SortByNewestItemsEnabled":true,"SortByRatingEnabled":true,"IsShowOutOfStockStatus":"false","ExpertListPageUrl":"https://www.adorama.com/creators","RewardPercentPopupUrl":"/api/getContent?contentname=rewards-modal\u0026output=desktop\u0026svfor=7day\u0026v=1","DefaultNoPicImageName":"NOPIC.JPG","EnableGoogleTagManager":true,"GoogleTagManagerCode":"https://tap.adorama.com/gtm.js?id=GTM-T5VX63","enableRewardsforStudents":true,"CRS.EnableRecommendations":true,"ShippingEnableRuleU2AFreeThreshold":true,"CartDisplayUrl":"https://www.adorama.com/cartview","MyAccountLink":"/MyAccount","EnableLoyalty":true,"TrackOrderURL":"https://www.adorama.com t":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[],"variantSku":"IRCGR4AEK","monthlyPaymentContent":"\u003ca rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"150\",\"TotalPrice\":\"1799.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo\u0026Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"\u003e\u003cspan class=\"promo-financing-rate promo-financing-rate-dollars\"\u003e\u003cspan\u003e$\u003c/span\u003e150\u003c/span\u003e\u003cspan class=\"promo-financing-rate\"\u003e/mo\u003c/span\u003e suggested payments with 12\u0026#8209;month special financing. \u003cspan class=\"promo-financing-learn-how\"\u003eLearn\u0026nbsp;how.\u003c/span\u003e\u003c/a\u003e","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"GEORGE F.","creationDate":"2026-08-25T09:17:37","text":"Been in a funk since the pandemic. Have taken my cameras out with me on occasion, but just was out of it creatively. I've been thinking about a GR since the GRII and decided something i can take with me a put in my pocket would help get the juices flowing. I'm very happy to say that the spark is back. its a very fun camera to use and so simple to take with you. I've shot about 1000+ photos so far and I'm loving it and making photos again. I'm now wielding two cameras on me even when I'm out in the woods riding my bike. Really enjoying taking it around with me wherever i go!","title":"Put it in you pocket and go!"},{"authorName":"Orawan S.","creationDate":"2026-08-18T18:04:23","text":"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.","title":"Exactly what I was looking for in a camera"},{"authorName":"RODRIGO O.","creationDate":"2026-07-09T08:45:47","text":"Everything is perfect, great camera, great service!","title":"Perfect"},{"authorName":"Andrew D.","creationDate":"2026-04-07T09:49:56","text":"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \"good enough\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.","title":"Travel"},{"authorName":"ANDREW S.","creationDate":"2026-03-22T19:55:17","text":"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.","title":"Amazing and Annoying"}],"highlights":["Superior image quality with 25.7 MP sensor.","Compact, durable build for on-the-go photography.","Easy-to-use touchscreen ensures effortless control.","Extended battery life for prolonged shooting sessions.","Swift autofocus captures sharp, clear images easily."],"freeShipTypeName":"Free Expedited Shipping","isPrintiqueProduct":false,"variants":[{"sku":"IRCGR4AEK","primaryImageName":"IRCGR4AEK.JPG","primaryImageNameWebp":"ricoh-gr-iv-digital-camera-black_ircgr4aek.webp","options":[],"websiteUrl":"https://www.adorama.com/ricoh-gr-iv-30th-anniversary-edition-kit/p/ircgr4aek","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1799.95,"effectivePriceCode":5,"highPrice":1799.95,"guestPrice":1799.95,"isSale":false,"isEdu":false},"isAvailableForStorePickup":false,"isAvailableInStore":false,"thumbnailImageName":"IRCGR4AEK.JPG","thumbnailImageNameWebp":"ricoh-gr-iv-digital-camera-black_ircgr4aek.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true},{"sku":"OMPENBK","persuasionStrategies":null,"brand":"OM SYSTEM","prices":{"price":1099.99,"youSave":{"dollar":54,"percent":5},"highPrice":1153.99},"stock":"Out","subStatus":{"name":"Pre Order Now","description":"Manufacturer will start shipping this item on 10/14/2026. Orders will be filled on a first come first serve basis. We do not charge your card until we actually ship the item to you."},"badgeText":"New Arrival","categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/om-system-pen-mirrorless-camera-14-42-mm/p/ompenbk","flags":{"isRefurbished":false,"isUsed":false,"isPreOrder":true,"isPreAnnounced":false,"isNoReturns":false,"isAvailableForPurchase":true,"hasAccessories":true,"hasFreeBundleToChoose":false,"isHidden":false,"isAvailableForComparison":true,"hasFAQ":false},"sho omo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"134\",\"TotalPrice\":\"1599.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo\u0026Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"\u003e\u003cspan class=\"promo-financing-rate promo-financing-rate-dollars\"\u003e\u003cspan\u003e$\u003c/span\u003e134\u003c/span\u003e\u003cspan class=\"promo-financing-rate\"\u003e/mo\u003c/span\u003e suggested payments with 12\u0026#8209;month special financing. \u003cspan class=\"promo-financing-learn-how\"\u003eLearn\u0026nbsp;how.\u003c/span\u003e\u003c/a\u003e","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"GEORGE F.","creationDate":"2026-08-25T09:17:37","text":"Been in a funk since the pandemic. Have taken my cameras out with me on occasion, but just was out of it creatively. I've been thinking about a GR since the GRII and decided something i can take with me a put in my pocket would help get the juices flowing. I'm very happy to say that the spark is back. its a very fun camera to use and so simple to take with you. I've shot about 1000+ photos so far and I'm loving it and making photos again. I'm now wielding two cameras on me even when I'm out in the woods riding my bike. Really enjoying taking it around with me wherever i go!","title":"Put it in you pocket and go!"},{"authorName":"Orawan S.","creationDate":"2026-08-18T18:04:23","text":"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.","title":"Exactly what I was looking for in a camera"},{"authorName":"RODRIGO O.","creationDate":"2026-07-09T08:45:47","text":"Everything is perfect, great camera, great service!","title":"Perfect"},{"authorName":"Andrew D.","creationDate":"2026-04-07T09:49:56","text":"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \"good enough\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.","title":"Travel"},{"authorName":"ANDREW S.","creationDate":"2026-03-22T19:55:17","text":"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.","title":"Amazing and Annoying"}],"highlights":["Superior digital camera image quality \u0026 detail.","Compact camera design for easy portability and travel.","Effortless digital camera ease of use with touchscreen.","Long-lasting battery life for extended shoots.","Competitive price for an advanced digital camera."],"freeShipTypeName":"Free Expedited Shipping","isPrintiqueProduct":false,"variants":[{"sku":"IRCGR4N","primaryImageName":"IRCGR4N.JPG","primaryImageNameWebp":"ricoh-gr-iv-digital-camera_ircgr4n.webp","options":[],"websiteUrl":"https://www.adorama.com/ricoh-gr-iv-digital-camera-aps-c/p/ircgr4n","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1599.95,"effectivePriceCode":5,"highPrice":1599.95,"guestPrice":1599.95,"trialPrice":112,"isSale":false,"isEdu":false},"isAvailableForStorePickup":false,"isAvailableInStore":false,"thumbnailImageName":"IRCGR4N.JPG","thumbnailImageNameWebp":"ricoh-gr-iv-digital-camera_ircgr4n.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":112},{"sku":"IFJXT30M3KCS","persuasionStrategies":null,"brand":"Fujifilm","prices":{"price":1149,"highPrice":1149},"stock":"In","subStatus":{"name":"In Stock"},"categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/fujifilm-x-t30-iii-mirrorless-camera-xc-13-33-mm-lens/p/ifjxt30m3kcs","flags":{"isRefurbished":false,"isUsed":false,"isPreOrder":false,"isPreAnnounced":false,"isNoReturns":false,"isAvailableForPurchase":true,"hasAccessories":true,"hasFreeBundleToChoose":false,"isHidden":false,"isAvailableForComparison":true,"hasFAQ":false},"promoFlags":[{"name":"financing 24 months","startTimeStamp":"2020-08-18T04:00:00Z","endTimeStamp":"2028-01-30T05:00:00Z"}],"shortTitle":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Charcoal Silver","mainImageName":"IFJXT30M3KCS.JPG","mainImageNameWebp":"fujifilm-x-t30-iii-charcoal-silver_ifjxt30m3kcs.webp","ratings":{"count":11,"averageRatingStars":5},"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Fu T.","creationDate":"2026-06-19T08:59:59","text":"Came packaged well!","title":"Camera"},{"authorName":"Robert P.","creationDate":"2026-06-02T15:44:34","text":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtländer lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["26.1MP APS-C sensor for crisp images.","Exceptional image quality, rich detail capture.","Shoot cinematic 6.2K video resolution.","Compact mirrorless design, versatile performance.","Fast autofocus ensures sharp, clear shots."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXT30M3KCS","primaryImageName":"IFJXT30M3KCS.JPG","primaryImageNameWebp":"fujifilm-x-t30-iii-charcoal-silver_ifjxt30m3kcs.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-xc-13-33-mm-lens/p/ifjxt30m3kcs","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1149,"effectivePriceCode":5,"highPrice":1149,"guestPrice":1149,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStor ionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Tony A.","creationDate":"2026-08-10T09:15:22","text":"A great package to get started in the Sony photography world.  The a7 iv meets all of my needs and is quite an upgrade going from a Cannon t2i.  The FE 24-70 f2.8 GMII is a great lens.","title":"Amazing Package Deal"},{"authorName":"DALLIN B.","creationDate":"2026-07-07T11:28:56","text":"Amazing camera exactly what I was looking for!","title":"Perfect!!!"},{"authorName":"Joshua W.","creationDate":"2026-07-06T18:45:50","text":"Love the quality straight out the camera, the large buttons are very nice. Just gets warm pretty quick.","title":"Pretty solid"},{"authorName":"BRIAN S.","creationDate":"2026-06-26T10:00:52","text":"This is an excellent camera, highly recommended!","title":"Excellent Camera"},{"authorName":"Sean123423","creationDate":"2026-06-17T20:00:00","text":"Warning: Think twice before ordering expensive equipment directly from Sony.\n\nI ordered approximately $3,500 worth of camera equipment directly from Sony because their website promised delivery in time for an event I was hosting. The package never arrived.\n\nFedEx tracking showed multiple delivery exceptions. Sony requested it be returned to warehouse, yet Sony's website still marked my order as \"Delivered\" and \"Completed.\"\n\nAfter nearly two weeks of contacting both Sony and FedEx, I was finally told that the camera had been returned to Sony's warehouse and that I would receive a refund. Its not been 10 days since that message and there has been NO REFUNDS FOR THE PRODUCT. They have STOLEN $3500 from me.\n\nAs of writing this review, the only refund I have received is $109 for the protection plan. I am still out approximately $3,500.\n\nShipping problems happen. Terrible customer service doesn't have to.\n\nThe worst part of this experience was:\n? No proactive communication\n? Confusing and inaccurate tracking information\n? Being bounced between Sony and FedEx\n? Having an order marked delivered when it never was\n? Still waiting on thousands of dollars to be refunded\n\nSony is a multibillion dollar company and they have stolen $3500 from me. as a customer who spent $3,500 and still doesn't have the product or my money back, that's exactly how this experience feels.","title":"DO NOT BUY FROM SONY - HORRIBLE CUSTOMER SERVICE"},{"authorName":"ROBERT R.","creationDate":"2026-05-26T11:47:07","text":"For me it was Definitely a good choice.","title":"Sony a7iv"},{"authorName":"Derrick M.","creationDate":"2026-05-12T13:36:31","text":"Great camera..Definitely worth the money.","title":"Get it!"},{"authorName":"Deepraj M.","creationDate":"2026-05-12T10:54:44","text":"Superb and awesome","title":"Beastly Best"},{"authorName":"ALEJANDRO M.","creationDate":"2026-05-05T08:15:25","text":"Great camera. Using it for sports. Lightweight, and amazing quality.","title":"Great Camera, quality and price"},{"authorName":"Aaron L.","creationDate":"2026-05-03T14:19:37","text":"I decided that sony was the move so what did I do, I sold my gear to Adorama for a used A7IV and the condition I received was amazing! Sure I would have loved something new, I could only afford something used and even still I would have thought it was new in box from the factory.","title":"Used A7IV First Impressions"},{"authorName":"Mario H.","creationDate":"2026-04-27T11:12:00","text":"Very good camera for a starter","title":"Great starter"},{"authorName":"Brandon R.","creationDate":"2026-04-14T11:24:14","text":"Really a great camera.  Probably Sony's best entry level professional camera (you need simultaneous shooting).  \n\nIf you do video - do a slight upgrade to the FX2.  The fan, shutter angle and timecode are worth the extra cost.  I have been able to overheat this camera when shooting long moments in 4K.  \n\nBut this camera rocks.  Beast in lowlight.  When using it for video - I've repeatedly been surprised by how high I can crank the ISO.  Even when shooting with an FX3 - ISO 12,800 often looked just as good on this camera.  I've shot some dance footage at weddings that was very grainy, but usually it performs perfectly.  Even the most lowlight photos will cleanup wonderfully.\n\nIf you can afford the A7V go for it.  The autofocus improvements alone are worth it.  If not - this camera is worth every penny.  I've used it for years and have loved every shoot I've done with it.","title":"One of the best"},{"authorName":"valerielindseyphotography","creationDate":"2026-03-16T20:00:00","text":"I purchased an A7IV in October of 2022 and in July of 2025 it gave me an error message. The IBIS system had apparently malfunctioned- whatever, no big deal, I get that happens sometimes. Purchased a new one in July 2025 to replace the one being repaired, six months later (literally January 2026) the NEW camera I bought in July is giving me the same error. I cannot get in contact with a Sony representative to get this issue resolved, and if i do, they tell me to turn it off and back on and replace the battery (which i've done). Nobody will take it seriously and give me a legitimate reason why, after six months, a brand new camera stops working. Never been dropped or bumped either, mind you. I can only use it on electronic shutter mode otherwise it stops working. Unacceptable. I spent almost $3k on this camera and it gave out after six months of not even heavy use?","title":"Shutter Malfunction Beware!"},{"authorName":"KRISTIN T.","creationDate":"2026-02-12T02:13:57","text":"After my fiancé bought this camera I started to get interested in photography. He bought his mostly for videos but also to do photography as well. I'm mostly interested in it for photography but love the option of video. Truly an awesome versatile camera and I've been having so much fun learning and taking photos! Has quickly become a passion!","title":"If you're on the fence.. just get it! You won't regret it!"},{"authorName":"Sebastian B.","creationDate":"2026-02-03T08:18:40","text":"Best. Camera quality for this price","title":"Amazing"},{"authorName":"BRITTON D.","creationDate":"2025-12-25T08:24:12","text":"So far so good.  Amateur here so still learning my way around it but so far it's been great.","title":"Loving it"},{"authorName":"HAROLD R.","creationDate":"2025-12-10T10:53:29","text":"So far a great upgrade from my a6500. The low light performance, auto focus and video quality are a world better.","title":"Upgrade worth it"},{"authorName":"CARLOS A.","creationDate":"2025-10-24T10:53:49","text":"I purchased the Sony A7 IV in October 2024, and after using it alongside my Sony A9, the conclusion is clear: the A7 IV is a less durable camera in almost every aspect.\n\nThe main issue I encountered is the rear screen. Even with a protective glass applied from day one, the screen still ended up cracked under normal use. I never experienced this problem with the A9, which confirms that the A7 IV is built with weaker materials. For a camera at this price point, that is disappointing.\n\nOverall, the camera delivers on image quality and features, but its durability is not at the level required for demanding professional use. In photography, where equipment must withstand real working conditions, specifications on paper mean very little if the body cannot handle the workload.\n\nIn conclusion, the Sony A7 IV offers strong specs, but the fragility of its screen and the overall lack of sturdiness compared to the A9 make it a poor choice for those who value long-term reliability and resistance.","title":"? My Personal Review of the Sony A7 IV"},{"authorName":"KENNETH P.","creationDate":"2025-08-15T15:51:20","text":"I am very, very pleased with my purchase of the Sony A7 IV camera through Adorama. The last time I used a full frame camera was a Pentax 35mm film. The pictures are beautiful. I've only been viewing them on an iPad and I can't wait to do some enlargement prints. This is a great low-level professional level mirrorless, and it has tons of features, but the visible controls are traditional so I could charge up the battery and start shooting with great results. If you're willing to go a little over $2k, you won't regret it. Adorama is always great to deal with and worked with me on some camera/lenses trade-ins. If your thinking about going full frame, give this camera some consideration.","title":"Great Full Frame Camera"},{"authorName":"Laszlo F.","creationDate":"2025-07-30T13:16:09","text":"I had a very pleasant experience buying this beautiful item, thank you.","title":"A7 iv is great highly recommended, great shopping thank you"},{"authorName":"MARK M.","creationDate":"2025-07-29T21:48:14","text":"Great bundle and the camera is everything I was looking for.","title":"Short and sweet"},{"authorName":"KATE A.","creationDate":"2025-07-18T08:08:01","text":"Ordering was smooth, the site worked perfectly, and the bundle matched the complete product description. It shipped in two business days, arrived well-packaged, and everything works flawlessly. No issues with the camera or accessories. Overall, a positive experience and I'd buy from them again.","title":"Great experience buying Sony a7 IV bundle from Adorama!"},{"authorName":"SHALOM C.","creationDate":"2025-07-15T08:39:57","text":"This camera was quite an upgrade! Going from my a7iii to the iv is a world of difference and Adorama made it easy!\n10 bit color, the new menu system, the shots are amazing straight out of camera!\nWould recommend easily as a great hybrid for photo or video, both stunning.","title":"Quite an upgrade!"},{"authorName":"RICH D.","creationDate":"2025-05-28T10:44:58","text":"Terrific camera. Love it","title":"Rld"},{"authorName":"ARCHIE M.","creationDate":"2025-05-21T08:20:12","text":"Amazing camera!","title":"Sony a74"},{"authorName":"ALINA K.","creationDate":"2025-05-01T08:07:05","text":"I really recommend this camera! The best","title":"The best!"},{"authorName":"JESSE W.","creationDate":"2025-04-23T03:11:07","text":"This is my second A7iv, and there is a reason I bought another. Because I like it, and I needed a backup body.","title":"Standby"},{"authorName":"GUY L.","creationDate":"2025-01-04T09:27:11","text":"This is my 2nd Sony a7iv. Love this versatile all around camera. It always makes my work easier. Adorama's bundle just makes the experience that much better. Thanks Adorama!","title":"Sony A7IV"},{"authorName":"EUGENE G.","creationDate":"2025-01-01T07:22:17","text":"The a7 IV is a fantastic camera for a variety of photographers ranging from the amateur to the advanced/professional. While I'm still learning the many features, I love the wide range of customization it provides.","title":"a7 IV initial thoughts"},{"authorName":"JUDY R.","creationDate":"2024-12-24T08:00:38","text":"After a lot of shopping around for our camera, Adorama gave us the best pricing and fabulous customer service!  Meyer is the best!!","title":"Look no further?"}],"highlights":["33MP Full-Frame: Exceptional image quality.","Advanced 4K video: Stunning clarity \u0026 detail.","Real-time autofocus: Capture every moment.","5-axis stabilization: Sharp, steady results.","E-mount lens versatility: Wide lens options."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"ISOA7M4","image":"ISOA7M4.JPG","imageWebp":"sony-alpha-a7-iv-mirrorless-camera_isoa7m4.webp","desc":"Sony Alpha a7 IV Mirrorless Camera","isConfigurable":false,"productId":"ISOA7M4"},{"sku":"SLALPINE190","image":"SLALPINE190.JPG","imageWebp":"slinger-alpine-190-backpack-black_slalpine190.webp","desc":"Slinger Alpine 190 Lightweight Backpack for Camera, Laptop or Drone","isConfigurable":false,"productId":"SLALPINE190"},{"sku":"GXNPFZ100V2","image":"GXNPFZ100V2.JPG","imageWebp":"green-extreme-np-fz100-battery-pack_gxnpfz100v2.webp","desc":"Green Extreme NP-FZ100 17.3Wh 7.2V 2400mAh Li-Ion Battery Pack w/USB-C Port","isConfigurable":fa s-r6-mark-ii-mirrorless-camera-body-bundle-lp-e6nh-battery-64gb-card/p/car6m2ek","trackData":"listing page, ways to save, bundle","type":3}],"variantSku":"CAR6M2EK","monthlyPaymentContent":"\u003ca rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"167\",\"TotalPrice\":\"1999\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo\u0026Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"\u003e\u003cspan class=\"promo-financing-rate promo-financing-rate-dollars\"\u003e\u003cspan\u003e$\u003c/span\u003e167\u003c/span\u003e\u003cspan class=\"promo-financing-rate\"\u003e/mo\u003c/span\u003e suggested payments with 12\u0026#8209;month special financing. \u003cspan class=\"promo-financing-learn-how\"\u003eLearn\u0026nbsp;how.\u003c/span\u003e\u003c/a\u003e","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"PhotoBomb","creationDate":"2026-09-13T20:00:00","text":"Wose camera I ever bought, broke 4 times after the year warranty and now, it's broke again. Sticky shutters, bad UI, stuck in video mode, stuck in MF, just like thing after thing.","title":"Don't Buy This Camera"},{"authorName":"Brandon S.","creationDate":"2026-09-08T19:10:30","text":"I love this camera! Made the jump to mirrorless from the Canon EOS 5D Mark IV and WOW it is night and day. The image quality is 100% more crisp, the OS is easy to navigate and set up, the AI autofocusing and subject tracking is top tier, and the overall build quality is unmatched. I can not say how much I enjoy this camera.","title":"Best camera purchase I've made in years"},{"authorName":"Sourav B.","creationDate":"2026-09-08T09:23:47","text":"Overall, I'm very happy with my Canon R6 Mark II. The image quality and overall shooting experience have been excellent, and the camera feels very capable for travel, street, and everyday photography.\n\nThe battery life is decent and works well for my typical shooting needs.\n\nOne issue I have noticed is that the camera sometimes shows \"Busy\" while capturing photos, even though I'm using a 128GB UHS-II memory card.","title":"Canon EOS R6 Mark II - Review"},{"authorName":"Sourav B.","creationDate":"2026-09-08T09:22:35","text":"Overall, I'm very happy with my Canon R6 Mark II. The image quality and overall shooting experience have been excellent, and the camera feels very capable for travel, street, and everyday photography.\nThe battery life is decent and works well for my typical shooting needs.\n\nOne issue I have noticed is that the camera sometimes shows \"Busy\" while capturing photos, even though I'm using a 128GB UHS-II memory card.","title":"Canon EOS R6 Mark II - Overall Review"},{"authorName":"John C.","creationDate":"2026-09-07T16:19:36","text":"I've team R6MII with a RF100-500MM lens to shoot primarily my daughter soccer games (first use of the camera). The attached photo was taken at approximate 70 yards away, 500mm zoom, 1/1600 second, and 3200 ISO. It was cropped a bit.  Since I am taking soccer photos, my desire is to keep the shutter speed above 1/1000 and let the camera adjust the ISO as needed.  Noise is not an issue.\n\nIn a night-time semi-professional game, I had to raise the ISO to 16,000 to achieve a shutter speed of 1/1,250 sec at 118mm. While there is some noise when zoomed in, when viewing the entire photo it is not a problem.\n\nI've found the camera to be very easy to use with intuitive menus.\n\nRegarding the 100-500mm lens, true it has less bokah than a F/2.8 but I love the reach of obtaining good pictures at 70+ yards. Furthermore, in soccer, you want some context as to other players around the ball.","title":"Soccer"},{"authorName":"DANA C.","creationDate":"2026-08-25T08:14:59","text":"Better than advertised and so excited to have been able to upgrade!!","title":"Adorama for the W!!"},{"authorName":"MARIA C.","creationDate":"2026-08-21T08:19:53","text":"I had change my Camera from Niko to Canon and what a big difference?","title":"Very happy with my purchase"},{"authorName":"JD12 C.","creationDate":"2026-08-19T20:00:00","text":"The Canon EOS R6 Mark II has been an excellent upgrade for my portrait photography. Autofocus is fast and dependable, eye detection makes working with clients much easier, and the image quality gives me plenty of flexibility when editing RAW files. The controls feel intuitive, performance is responsive, and the combination of strong still-photo features with capable video makes it a versatile camera for both client work and social media content.","title":"Canon EOS R6 Mark II: A Versatile Upgrade for Portraits and Video"},{"authorName":"Tab H.","creationDate":"2026-07-12T20:00:00","text":"Solid camera body. Def a great upgrade. Easy to update.","title":"Happy buyer"},{"authorName":"Paige W.","creationDate":"2026-07-06T10:04:33","text":"Great camera and quick shipping! Arrived in a couple of days in great shape, well packaged.","title":"Quick shipping, great gear"},{"authorName":"DANIEL B.","creationDate":"2026-07-05T06:40:10","text":"I've been shooting with Nikon cameras since the 80's and that's fine since I've mostly been shooting stills.  But more and more, I'm also shooting more video, and my experience with Canon mirrorless has made getting good video much easier.  \nI decided to move to Canon for both video and stills and am still getting accustomed to the menus etc, but the quality I'm seeing is much better than what I could do w/Nikon.","title":"Former Nikon guy, now Canon guy....it's been a 40 yr journey"},{"authorName":"shawn t.","creationDate":"2026-07-01T19:34:01","text":"My first mirrorless camera and I'm in love!","title":"Amazing"},{"authorName":"Danielle M.","creationDate":"2026-07-01T07:33:15","text":"The Canon R6 Mark II is an incredible camera, so much lighter than my DSLR (Mark 5 IV)! Image quality is supurb and and I can't recommend it enough! I shoot a lot of different content from portraits to street photography to events, and this camera can do it all!","title":"Amazing Camera!"},{"authorName":"Kerby","creationDate":"2026-06-22T20:00:00","text":"I order my camera on a Tuesday and paid for 2 day shipping.  I need the camera for that sunday wedding.  Fed Ex said they tried to deliver on Thursday and we were not home which is a lie.  On the camera you can see Fed ex get out at our garage, take a picture and leave.  They came back again on Friday and did the same thing.  Then they came again on Monday and said it was delivered but no one was home as we left after the wedding on Sunday and there was not camera at the house.  I tried calling Canon but you CAN NOT get ahold of anyone.  So I filed a dispute with my credit card.  This is a joke that you can not get ahold of anyone at Canon.","title":"Horrible Experience"},{"authorName":"ROBERT D.","creationDate":"2026-06-17T09:40:03","text":"Great purchase","title":"Great"},{"authorName":"DAVE C.","creationDate":"2026-05-28T13:50:08","text":"Excellent camera and fast delivery. Everything ordered arrived well packaged. Thanks again Adorama for superb service.","title":"Great camera and fast delivery."},{"authorName":"PENNY M.","creationDate":"2026-05-20T07:58:35","text":"Love this camera!  Adorama was great to work with and all shipped promptly","title":"Great camera"},{"authorName":"r p.","creationDate":"2026-05-14T20:00:00","text":"Second time owning the R6 Mark II.  Good camera, just the right amount of megapixels for me.  Produces nice images with a proper lens.","title":"Nice Camera System"},{"authorName":"DAVE C.","creationDate":"2026-05-12T12:12:45","text":"What a great upgrade from the R10. Love all the items in the bundle. And the shipping was incredibly fast!","title":"Upgraded from R10 to R6MKii"},{"authorName":"MEGHAN K.","creationDate":"2026-05-12T08:15:20","text":"This camera is absolutely amazing and came with a perfect package of included items. I have loved using it so far and can't wait to see what wonderful photos it brings in the future! Definitely recommend this camera and Adorama.","title":"R6 Mark ii - THE BEST"},{"authorName":"DENNIS D.","creationDate":"2026-05-03T11:42:11","text":"Love everything in the kit. \nStill learning to use the camera\nWhat an upgrade from a DSLR T1 .","title":"Upgrade from T1i"},{"authorName":"Jim C.","creationDate":"2026-04-25T05:27:08","text":"Great camera, thouroughly enjoying it","title":"R6 Mark II is awesome"},{"authorName":"AIDAN P.","creationDate":"2026-04-23T09:11:54","text":"Excellent value for one of the best cameras in the game right now","title":"Jump on this"},{"authorName":"Jim C.","creationDate":"2026-04-18T16:32:40","text":"My first quality camera purchase. I had rented this camera for a Yellowstone vacation and got to trial/error with it. Even the \"errors\" produced very good images. When I decided to purchase, I did not hesitate to use Adorama. It's been a great camera the past 6 months and I am looking forward to a lot of happy experiences with it.","title":"Canon R6 Mark II"},{"authorName":"CHRISTINE B.","creationDate":"2026-04-17T08:41:47","text":"The Canon EOS R6 Mark II is an incredibly capable camera that delivers true professional performance in both photo and video. The autofocus is fast, accurate, and locks onto subjects effortlessly, with excellent eye tracking that makes shooting people especially easy. Low-light performance is outstanding, allowing clean images at higher ISOs without sacrificing detail.\n\nThe in-body image stabilization is a huge advantage for handheld shooting, producing smooth, usable footage without needing heavy gear. Video quality is sharp and detailed, with Canon's color science producing natural, flattering skin tones right out of the camera.\n\nErgonomically, it's comfortable to use for extended sessions, with an intuitive menu system and a fully articulating screen that's perfect for solo shooting. Battery life has also been reliable.\n\nOverall, the R6 Mark II is a powerful, well-rounded camera that performs consistently in real-world conditions and elevates the quality of any workflow.","title":"Canon EOS R6 Mark II: Fast, Reliable, and Professional-Level Performance for Photo and Video in Any Lighting Conditions"},{"authorName":"TIFFANY R.","creationDate":"2026-04-16T11:43:36","text":"I got this to upgrade my Canon 5D Mark III and was somewhat worried to \"step down\" to the R6 vs the R5. However this was truly a step UP even though it's not the same \"series\".  This camera out performs my old 5D Mark III in almost every way.  It was a bit rough transitioning to the different buttons and such, but overall it was pretty easy once I figured out where everything was.  Adorama had the best bundle price, which is a fantastic way to save on some extra accessories.  This was my first time buying from Adorama, and I'm very happy with my purchase!","title":"Great Mirrorless Option!"},{"authorName":"TIFFANY R.","creationDate":"2026-04-09T12:11:10","text":"This is a fantastic bundle of you are looking to get the Canon R6! It comes with so many helpful extras and add ons and at the time when I purchased it, it was literally the same price as just the body was, so it was such a great deal. Overall I'm very happy with this bundle.","title":"Great Bundle!"},{"authorName":"Bryan S.","creationDate":"2026-04-03T09:39:59","text":"Just picked it up recently, and wow, the jump from the Canon 90D is huge. I still love the 90D, but I've been wanting to dive into mirrorless for a while, and this is my first real entry into that world. Can't wait to get more shoots in. I'm having a ton of fun with it already.","title":"Upgrade"},{"authorName":"PHILIP D.","creationDate":"2026-03-24T09:16:10","text":"I bought this as an upgrade from an EOS RP.  It is a BIG upgrade, the R6 Mark II is better in every aspect.  There is a lot to learn, but I'm retired and have the time.  I'm Very satisfied.","title":"A worthy upgrade from an EOS RP"},{"authorName":"Rico","creationDate":"2026-03-20T20:00:00","text":"Excellent camera at an excellent price.  The camera may not be the latest model but it is all you need.","title":"I got lucky"}],"highlights":["Capture stunning detail with 24.2MP sensor.","Exceptional low-light performance up to ISO 102400.","Record vibrant 4K UHD video at up to 60fps.","Experience fast, accurate Dual Pixel CMOS AF.","Explore versatile RF lens options for every shot."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"CAR6M2","image":"CAR6M2.JPG","imageWebp":"canon-eos-r6-mark-ii-black_car6m2.webp","desc":"Canon EOS R6 Mark II Mirrorless Camera, Black","isConfigurable":false,"productId":"CAR6M2"},{"sku":"GXLPE6NHV2","image":"GXLPE6NHV2.JPG","imageWebp":"green-extreme-lp-e6nh-2400mah_gxlpe6nhv2.webp","desc":"Green Extreme LP-E6NH 17.3Wh 7.2V 2400mAh Li-Ion Battery Pack w/USB-C Port","isConfigurable":false,"productId":"GXLPE6NHV2"},{"sku":"GXCH1","image":"GXCH1.JPG","imageWebp":"green-extreme-compact-smart-charger-base_gxch1.webp","desc":"Green Extreme Compact Smart Charger Base with LCD Screen","isConfigurable":false,"productId":"GXCH1"},{"sku":"GXCHPLPE6","image":"GXCHPLPE6.JPG","imageWebp":"green-extreme-smart-charger-plate-canon-lpe6_gxchplpe6.webp","desc":"Green Extreme Smart Charger Plate for Canon LP-LPE6","isConfigurable":false,"productId":"GXCHPLPE6"},{"sku":"IDSSDEPV364","image":"IDSSDEPV364.jpg","imageWebp":"sandisk-extreme-pro-64gb-sdxc_idssdepv364.webp","desc":"SanDisk 64GB Extreme PRO UHS-I U3 SDXC Memory Card","isConfigurable":false,"productId":"IDSSDEPV364"}],"sku":"CAR6M2EK","primaryImageName "authorName":"Orawan S.","creationDate":"2026-08-18T18:04:23","text":"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.","title":"Exactly what I was looking for in a camera"},{"authorName":"RODRIGO O.","creationDate":"2026-07-09T08:45:47","text":"Everything is perfect, great camera, great service!","title":"Perfect"},{"authorName":"Andrew D.","creationDate":"2026-04-07T09:49:56","text":"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \"good enough\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.","title":"Travel"},{"authorName":"ANDREW S.","creationDate":"2026-03-22T19:55:17","text":"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.","title":"Amazing and Annoying"}],"highlights":["Superior image quality with 25.7MP APS-C CMOS sensor.","Enjoy stable shots with 5-axis sensor-shift stabilization.","Compact and portable design for everyday photography.","Capture crisp Full HD video at 59.94 fps effortlessly.","Intuitive touchscreen LCD ensures effortless camera control."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IRCGR4NHDF","primaryImageName":"IRCGR4NHDF.JPG","primaryImageNameWebp":"ricoh-gr-iv-hdf-premium-compact-camera_ircgr4nhdf.webp","options":[],"websiteUrl":"https://www.adorama.com/ricoh-gr-iv-hdf-digital-camera/p/ircgr4nhdf","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1696.95,"effectivePriceCode":5,"highPrice":1696.95,"guestPrice":1696.95,"trialPrice":119,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":false,"thumbnailImageName":"IRCGR4NHDF.JPG","thumbnailImageNameWebp":"ricoh-gr-iv-hdf-premium-compact-camera_ircgr4nhdf.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":119},{"sku":"HSCPHB92701L","persuasionStrategies":null,"brand":"Hasselblad","prices":{"price":12398,"highPrice":12398},"stock":"In","subStatus":{"name":"In Stock"},"badgeText":"Trending","categoryId":240405,"categoryPath":"Photography/Cameras/Medium Format Cameras","productUrl":"/hasselblad-x2d-ii-100c-mirrorless-camera-xcd-35-100-mm-f-2-8-4/p/hscphb92701l","flags":{"isRefurbished":false,"isUsed":false,"isPreOrder":false,"isPreAnnounced":false,"isNoReturns":false,"isAvailableForPurchase":true,"hasAccessories":true,"hasFreeBundleToChoose":false,"isHidden":false,"isAvailableForComparison":false,"hasFAQ":false},"shortTitle":"Hasselblad X2D II 100C Medium Format Mirrorless Camera + Hasselblad XCD 35-100mm f/2.8-4 E Lens","mainImageName":"HSCPHB92701L.JPG","mainImageNameWebp":"hasselblad-x2d-ii-100c-35-100mm-lens_hscphb92701l.webp","ratings":{"count":14,"averageRatingStars":4.5},"kitIncludes":[{"sku":"HSCPHB92701","image":"HSCPHB92701.JPG","imageWebp":"hasselblad-x2d-ii-100c-100mp_hscphb92701.webp","desc":"Hasselblad X2D II 100C Medium Format Mirrorless Camera","isConfigurable":false,"productId":"HSCPHB92701"},{"sku":"HSCPHB94901","image":"HSCPHB94901.JPG","imageWebp":"hasselblad-xcd-35-100mm-f2_hscphb94901.webp","desc":"Hasselblad XCD 35-100mm f/2.8-4 E Lens","isConfigurable":false,"productId":"HSCPHB94901"}],"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Hasselblad X2D II 100C Mirrorless Camera with XCD 35-100mm f/2.8-4 E Lens","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"HSCPHB92701L page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"CP.HB.00000927.01 L","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[],"variantSku":"HSCPHB92701L","monthlyPaymentContent":"\u003ca rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"1034\",\"TotalPrice\":\"12398\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo\u0026Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"\u003e\u003cspan class=\"promo-financing-rate promo-financing-rate-dollars\"\u003e\u003cspan\u003e$\u003c/span\u003e1034\u003c/span\u003e\u003cspan class=\"promo-financing-rate\"\u003e/mo\u003c/span\u003e suggested payments with 12\u0026#8209;month special financing. \u003cspan class=\"promo-financing-learn-how\"\u003eLearn\u0026nbsp;how.\u003c/span\u003e\u003c/a\u003e","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Walter G.","creationDate":"2026-09-10T23:48:57","text":"Unbelievable, excellence. I purchased this for myself for my 81st birthday. And I am in heaven on earth.","title":"Hasselblad nothing more needs to be said??"},{"authorName":"ELENA K.","creationDate":"2026-08-21T08:44:34","text":"Went out West with this thing!  Used it like a street camera,  used it during lowest light conditions during a Rodeo,  used it close to waterfalls,  and facing a buffalo herd.  The only shot I missed was the milky way because I didn't have a tripod.  I did not throw out the camera,  actually I started treating it like the most precious jewel in my life,  this thing is superb! Just flawless.  At least for me,  having moved up from the original first, this camera is IT.","title":"No single regret"},{"authorName":"KENNETH A.","creationDate":"2026-08-20T02:15:55","text":"Dream camera finally achieved","title":"Perfection"},{"authorName":"Walter G.","creationDate":"2026-08-18T23:17:41","text":"Well after selling all of my Hasselblad film cameras over 20 years ago. I have been a Leica fan for years.\nI'm now in my 80's and have always missed the Hassy format. So for my 81st birthday I have returned to this magical camera again. I go on nature walks around my small town and drive a short distance to the Coburg hills for my landscape photography. I just have a passion for beautiful nature photography here in Oregon. I own a small ice cream store and compliment the shop with my landscapes all on canvas for sale. They sale very well.So I ordered a brand new hasselblad camera and lens. The medium format is just the best on earth. Nothing else comes close.","title":"Back to the Hasselblad after 20 years with my Leica's."},{"authorName":"EDWARD L.","creationDate":"2026-06-23T08:31:29","text":"Fantastic camera that arrived in perfect condition","title":"Hasselblad"},{"authorName":"EDWARD L.","creationDate":"2026-06-16T11:57:00","text":"This is just the best camera ever made","title":"Fabulous"},{"authorName":"DC P.","creationDate":"2026-05-17T10:36:55","text":"Worked my way up to it. I have had Cannon EOS Mk 5, Olympus PEN F, Sony A7R IV, Leica SL2 then a Hasselblad X2D. Had the X2D for 2 weeks until I found an X2D II in stock at Adorama.\n     This camera takes the best pictures bar none. Leica was close, but now that I have found Medium format, there is no going back. \n     The detail is amazing, but better than that, the color science of the Hasselblad blows all the others out of the water. Straight out of the camera, the shots are awesome, But then edited with the Phocus app, astounding. \n     The materials and build quality make the price reasonable. You get what you pay for. \n     I could care less that it does not shoot video. I am a stills photographer anyway. One can only imagine the size of a video file if shot with this 100mp sensor.\n     I was lucky enough to find a XCD 35-100mm F/2.8-4 E Lens to go with it and find its versatality, materials and build quality on the same par as the camera body. \n     The simplicity of the menu is also a welcome feature. \n     I am finally DONE! The search is over!!","title":"The absolute best camera taking the best pictures. PERIOD!"},{"authorName":"julie b.","creationDate":"2026-01-20T14:12:17","text":"I got this camera with the 38v, and this camera blows me away. After 30 years of shooting. I forgot how it feels to be inspired by the actual camera itself. The image quality is shockingly incredible.   Just about every image has a soothing quality to it. I work outside in NYC, and I wear it around my neck at all times outside.  It's surprisingly light enough to carry all day. And it's built like a tank.  The EVF is the best I've ever used. It makes me feel one with the camera in an inspiring way.  The UX is very intuitive with minor gripes.  I also wish there were an option to choose a smaller MP file. And the Hasselblad Phocus program that you have to use is not the best and is sort of a pain.  But the camera and images are so amazing that I'm not too bent out of shape about it.","title":"At the very least go try this camera at the store. it's amazing!"},{"authorName":"Seshadri R.","creationDate":"2026-01-08T11:02:40","text":"Excellent camera A although the lens has not yet arrived! Got the 28 mm for the time being to use with the camera. Without that I could not even test it!","title":"Excellent camera-"},{"authorName":"VINCENT K.","creationDate":"2025-12-05T06:37:31","text":"Very pleased with the picture quality. Selected full auto for my first walk around town and can't wait for my favorite night light shots. I'll send a few when my CF card reader shows up. The capabilities are in excess of my my imagination.","title":"In Excess of my Imagination"},{"authorName":"Stephane S.","creationDate":"2025-11-27T19:10:22","text":"Be careful !!! None of the other lenses for the H2DII are compatible with any of the X2D II improvements over the X2D I ; you can take pictures yes but you cannot use HDR, auto focus continuous, PdAf and LiDAR focus, 5-Axis, 10-Stop In-Body Image Stabilisation won't work neither unless you buy the lenses that just came out.\n\nAlso Hasselblad changed manufacturing for the lcd so it's no longer true to colors but slightly towards blue tones?","title":"Buyer BEWARE !!! Lens Incompatibility !"},{"authorName":"MICHAEL J.","creationDate":"2025-09-25T08:36:10","text":"Image quality is the best out there. Plus, the camera is gorgeous.","title":"Hasselblad X2D2"},{"authorName":"TIMOTHY O.","creationDate":"2025-09-17T11:19:39","text":"I've owned the X2D since the launch, and while a great camera the x2d2 is refined in all the right ways. I highly recommend the camera especially at the price point. Just might get a lot more use in my day to day EDC!","title":"Great upgrade."},{"authorName":"JOHN Z.","creationDate":"2025-09-13T03:39:29","text":"Great camera \"IF\" you don't plan on using strobes. Totally incompatible with Flashpoint or Godox strobes, and I've tried EVERY trigger. It's known, even by Hasselblad. It has only been tested with the smallest Profoto flash. Doubtful if it works with their others. Can work with some FJ Westcott strobes, but not in TTL. MAJOR FLAW!","title":"Incompatible with Flashpoint or Godox Strobes!"}],"highlights":["100MP medium-format sensor delivers immense image quality.","15.3 stops dynamic range capture rich tonal details.","Integrated 5-axis 10-stop in-body stabilization.","Robust machined aluminum build quality ensures durability.","Hasselblad XCD lens compatibility, superior optics."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"HSCPHB92701","image":"HSCPHB92701.JPG","imageWebp":"hasselblad-x2d-ii-100c-100mp_hscphb92701.webp","desc":"Hasselblad X2D II 100C Medium Format Mirrorless Camera","isConfigurable":false,"productId":"HSCPHB92701"},{"sku":"HSCPHB94901","image":"HSCPHB94901.JPG","imageWebp":"hasselblad-xcd-35-100mm-f2_hscphb94901.webp","desc":"Hasselblad XCD 35-100mm f/2.8-4 E Lens","isConfigurable":false,"productId":"HSCPHB94901"}],"sku":"HSCPHB92701L","primaryImageName":"HSCPHB92701L.JPG","primaryImageNameWebp":"hasselblad-x2d-ii-100c-35-100mm-lens_hscphb92701l.webp","options":[],"websiteUrl":"https://www.adorama.com/hasselblad-x2d-ii-100c-mirrorless-camera-xcd-35-100-mm-f-2-8-4/p/hscphb92701l","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":12398,"effectivePriceCode":5,"highPrice":12398 raphy fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["Capture stunning 26.1MP mirrorless image quality.","Record cinematic 6.2K 30fps video capabilities.","Compact Fujifilm camera, ultimate portability.","Experience responsive autofocus speed for clarity.","Fujifilm X-Mount ensures diverse lens selection."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXT30M3CS","primaryImageName":"IFJXT30M3CS.JPG","primaryImageNameWebp":"fujifilm-x-t30-iii-charcoal-silver_ifjxt30m3cs.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-body-only-26mp/p/ifjxt30m3cs","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":999,"effectivePriceCode":5,"highPrice":999,"guestPrice":999,"trialPrice":70,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":false,"thumbnailImageName":"IFJXT30M3CS.JPG","thumbnailImageNameWebp":"fujifilm-x-t30-iii-charcoal-silver_ifjxt30m3cs.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":70},{"sku":"IFJXT30M3KBA","persuasionStrategies":[{"expiresDate":null,"message":"Limited Quantity Available – Buy Now","overallRating":null,"persuasionType":1,"reviewerInfo":null}],"brand":"Fujifilm","prices":{"price":1259.89,"youSave":{"dollar":72.89,"percent":5},"highPrice":1332.78},"stock":"In","subStatus":{"name":"In Stock"},"categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/fujifilm-x-t30-iii-mirrorless-camera-13-33-m lse,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"LEMMUEL D.","creationDate":"2026-09-14T08:36:06","text":"Good for a starting camera!","title":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Black"},{"authorName":"THANH T.","creationDate":"2026-06-19T08:59:59","text":"Came packaged well!","title":"Camera"},{"authorName":"Robert P.","creationDate":"2026-06-02T15:44:34","text":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtländer lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["Capture crisp 26.1MP images with APS-C CMOS Sensor.","Experience swift autofocus for sharp Mirrorless photos.","Record stunning 6.2K videos; cinematic video quality.","Compact mirrorless design ensures maximum portability.","Excel in low light conditions with high ISO sensitivity."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"IFJXT30M3KB","image":"IFJXT30M3KB. //schema.org/Tuesday\",\"https://schema.org/Wednesday\",\"https://schema.org/Thursday\",\"https://schema.org/Friday\"],\"opens\":\"09:00\",\"closes\":\"17:00\"},{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":\"https://schema.org/Sunday\",\"opens\":\"10:00\",\"closes\":\"17:00\"}]}},\"hasMerchantReturnPolicy\":{\"@type\":\"MerchantReturnPolicy\",\"applicableCountry\":\"US\",\"returnPolicyCategory\":\"https://schema.org/MerchantReturnFiniteReturnWindow\",\"merchantReturnDays\":30,\"returnMethod\":\"https://schema.org/ReturnByMail\",\"returnFees\":\"https://schema.org/FreeReturn\"},\"@type\":\"Offer\",\"@context\":\"https://schema.org\"}],\"@type\":\"Product\",\"@context\":\"https://schema.org\",\"brand\":\"Ricoh\",\"aggregateRating\":{\"reviewCount\":\"5\",\"bestRating\":\"5\",\"ratingValue\":\"5\",\"worstRating\":\"1\",\"@type\":\"AggregateRating\",\"@context\":\"https://schema.org\"},\"review\":[{\"author\":{\"name\":\"GEORGE F.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-25T09:17:37\",\"description\":\"Been in a funk since the pandemic. Have taken my cameras out with me on occasion, but just was out of it creatively. I've been thinking about a GR since the GRII and decided something i can take with me a put in my pocket would help get the juices flowing. I'm very happy to say that the spark is back. its a very fun camera to use and so simple to take with you. I've shot about 1000+ photos so far and I'm loving it and making photos again. I'm now wielding two cameras on me even when I'm out in the woods riding my bike. Really enjoying taking it around with me wherever i go!\",\"name\":\"Put it in you pocket and go!\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Orawan S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-08-18T18:04:23\",\"description\":\"This is my first camera from Ricoh and it's exactly what I was looking for in a camera. The quality is impressive for it being a truly a pocketable camera. I've used Sony and Canon before and found the settings here to be pretty straight forward. I really appreciated the internal storage when I accidentally ordered a full size sd card instead of a nano sd the day before my trip. I haven't had a point and shoot camera since middle school and this is my favorite thing to throw in my purse now. It is also very easy to transfer photos to your phone via the app. The price difference between the standard and the hdf wasn't that much so I went for the hdf and it's a fun option to turn on for photos as well.\",\"name\":\"Exactly what I was looking for in a camera\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"RODRIGO O.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-07-09T08:45:47\",\"description\":\"Everything is perfect, great camera, great service!\",\"name\":\"Perfect\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"Andrew D.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-04-07T09:49:56\",\"description\":\"I regularly shoot a Canon R5.  But, as I travel more, I decided I need a travel alternative.  The GR IV does the trick.  Definitely \\\"good enough\\\" for experiences likely to be shared with others electronically.  As you probably know, the autofocus is not in the same league as my Canon.  But the 2.8 is good enough for the occasional portrait like photo.  Most travel photos are at F8 where focus is not as important.  Though the snap focus is definitely a thing for most people, I usually tap the screen if it doesn't hit focus immediately.\",\"name\":\"Travel\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"},{\"author\":{\"name\":\"ANDREW S.\",\"@type\":\"Person\",\"@context\":\"https://schema.org\"},\"datePublished\":\"2026-03-22T19:55:17\",\"description\":\"The good parts about it are really good!  It's easy to take everywhere, takes great images when it's in focus, and for the most part it makes me very happy.  But it has all these little software nits -- like randomly changing my aperture and shutter speed in P-Mode with auto-ISO, or changing focus at close-but not-macro distances in back-button focus mode.  And the AF is still not great.   So good and to me worth having, but far from the great it could be.\",\"name\":\"Amazing and Annoying\",\"@type\":\"Review\",\"@context\":\"https://schema.org\"}]},\"@type\":\"ListItem\",\"@context\":\"https://schema.org\"},{\"position\":3,\"item\":{\"name\":\"OM SYSTEM PEN Mirrorless Camera, Black with M.Zuiko Digital 14-42mm f/3.5-5.6 III Lens\",\"description\":\"OM SYSTEM PEN Mirrorless Camera, Black w/14-42mm f/3.5-5.6 III Lens\",\"url\":\"https://www.adorama.com/om-system-pen-mirrorless-camera-14-42-mm/p/ompenbk\",\"mpn\":\"V210081BU000\",\"sku\":\"OMPENBK\",\"image\":\"https://www.adorama.com/images/product/olympus-om-system-pen-mirrorless-black_ompenbk.webp\",\"offers\":[{\"priceCurrency\":\"USD\",\"itemCondition\":\"https://schema.org/NewCondition\",\"businessFunction\":\"http://purl.org/goodrelations/v1#Sell\",\"availability\":\"https://schema.org/PreOrder\",\"price\":\"1099.99\",\"seller\":{\"@type\":\"Organization\",\"name\":\"Adorama\"},\"shippingDetails\":{\"@type\":\"OfferShippingDetails\",\"shippingRate\":{\"@type\":\"MonetaryAmount\",\"value\":\"0.00\",\"currency\":\"USD\"},\"shippingDestination\":{\"@type\":\"DefinedRegion\",\"addressCountry\":\"US\"},\"deliveryTime\":{\"@type\":\"ShippingDeliveryTime\",\"handlingTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":0,\"maxValue\":1,\"unitCode\":\"DAY\"},\"transitTime\":{\"@type\":\"QuantitativeValue\",\"minValue\":1,\"maxValue\":1,\"unitCode\":\"DAY\"},\"businessDays\":[{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":[\"https://schema.org/Monday\",\"https://schema.org/Tuesday\",\"https://schema.org/Wednesday\",\"https://schema.org/Thursday\",\"https
