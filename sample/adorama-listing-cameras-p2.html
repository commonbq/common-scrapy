le":false,"productId":"TFDEFK55"}],"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Sony Alpha a7 IV Camera with FE 28-70mm OSS II Lens,Black, w/Included Value","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"ISOA7M4K1A page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"ILCE7M4M/B A","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[{"title":"Sell or Trade your Gear","link":"/g/used-quote","trackData":"listing page, ways to save, sell or trade","type":4},{"title":"Save up to $400.00 with bundle","link":"https://www.adorama.com/sony-alpha-a7-iv-mirrorless-camera-28-70mm-lens-128gb-bundle/p/isoa7m4k1a","trackData":"listing page, ways to save, bundle","type":3}],"variantSku":"ISOA7M4K1A","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"184\",\"TotalPrice\":\"2198\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>184</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Tony A.","creationDate":"2026-08-10T09:15:22","text":"A great package to get started in the Sony photography world.  The a7 iv meets all of my needs and is quite an upgrade going from a Cannon t2i.  The FE 24-70 f2.8 GMII is a great lens.","title":"Amazing Package Deal"},{"authorName":"DALLIN B.","creationDate":"2026-07-07T11:28:56","text":"Amazing camera exactly what I was looking for!","title":"Perfect!!!"},{"authorName":"Joshua W.","creationDate":"2026-07-06T18:45:50","text":"Love the quality straight out the camera, the large buttons are very nice. Just gets warm pretty quick.","title":"Pretty solid"},{"authorName":"BRIAN S.","creationDate":"2026-06-26T10:00:52","text":"This is an excellent camera, highly recommended!","title":"Excellent Camera"},{"authorName":"Sean123423","creationDate":"2026-06-17T20:00:00","text":"Warning: Think twice before ordering expensive equipment directly from Sony.\n\nI ordered approximately $3,500 worth of camera equipment directly from Sony because their website promised delivery in time for an event I was hosting. The package never arrived.\n\nFedEx tracking showed multiple delivery exceptions. Sony requested it be returned to warehouse, yet Sony's website still marked my order as \"Delivered\" and \"Completed.\"\n\nAfter nearly two weeks of contacting both Sony and FedEx, I was finally told that the camera had been returned to Sony's warehouse and that I would receive a refund. Its not been 10 days since that message and there has been NO REFUNDS FOR THE PRODUCT. They have STOLEN $3500 from me.\n\nAs of writing this review, the only refund I have received is $109 for the protection plan. I am still out approximately $3,500.\n\nShipping problems happen. Terrible customer service doesn't have to.\n\nThe worst part of this experience was:\n? No proactive communication\n? Confusing and inaccurate tracking information\n? Being bounced between Sony and FedEx\n? Having an order marked delivered when it never was\n? Still waiting on thousands of dollars to be refunded\n\nSony is a multibillion dollar company and they have stolen $3500 from me. as a customer who spent $3,500 and still doesn't have the product or my money back, that's exactly how this experience feels.","title":"DO NOT BUY FROM SONY - HORRIBLE CUSTOMER SERVICE"},{"authorName":"ROBERT R.","creationDate":"2026-05-26T11:47:07","text":"For me it was Definitely a good choice.","title":"Sony a7iv"},{"authorName":"Derrick M.","creationDate":"2026-05-12T13:36:31","text":"Great camera..Definitely worth the money.","title":"Get it!"},{"authorName":"Deepraj M.","creationDate":"2026-05-12T10:54:44","text":"Superb and awesome","title":"Beastly Best"},{"authorName":"ALEJANDRO M.","creationDate":"2026-05-05T08:15:25","text":"Great camera. Using it for sports. Lightweight, and amazing quality.","title":"Great Camera, quality and price"},{"authorName":"Aaron L.","creationDate":"2026-05-03T14:19:37","text":"I decided that sony was the move so what did I do, I sold my gear to Adorama for a used A7IV and the condition I received was amazing! Sure I would have loved something new, I could only afford something used and even still I would have thought it was new in box from the factory.","title":"Used A7IV First Impressions"},{"authorName":"Mario H.","creationDate":"2026-04-27T11:12:00","text":"Very good camera for a starter","title":"Great starter"},{"authorName":"Brandon R.","creationDate":"2026-04-14T11:24:14","text":"Really a great camera.  Probably Sony's best entry level professional camera (you need simultaneous shooting).  \n\nIf you do video - do a slight upgrade to the FX2.  The fan, shutter angle and timecode are worth the extra cost.  I have been able to overheat this camera when shooting long moments in 4K.  \n\nBut this camera rocks.  Beast in lowlight.  When using it for video - I've repeatedly been surprised by how high I can crank the ISO.  Even when shooting with an FX3 - ISO 12,800 often looked just as good on this camera.  I've shot some dance footage at weddings that was very grainy, but usually it performs perfectly.  Even the most lowlight photos will cleanup wonderfully.\n\nIf you can afford the A7V go for it.  The autofocus improvements alone are worth it.  If not - this camera is worth every penny.  I've used it for years and have loved every shoot I've done with it.","title":"One of the best"},{"authorName":"valerielindseyphotography","creationDate":"2026-03-16T20:00:00","text":"I purchased an A7IV in October of 2022 and in July of 2025 it gave me an error message. The IBIS system had apparently malfunctioned- whatever, no big deal, I get that happens sometimes. Purchased a new one in July 2025 to replace the one being repaired, six months later (literally January 2026) the NEW camera I bought in July is giving me the same error. I cannot get in contact with a Sony representative to get this issue resolved, and if i do, they tell me to turn it off and back on and replace the battery (which i've done). Nobody will take it seriously and give me a legitimate reason why, after six months, a brand new camera stops working. Never been dropped or bumped either, mind you. I can only use it on electronic shutter mode otherwise it stops working. Unacceptable. I spent almost $3k on this camera and it gave out after six months of not even heavy use?","title":"Shutter Malfunction Beware!"},{"authorName":"KRISTIN T.","creationDate":"2026-02-12T02:13:57","text":"After my fianc\u00e9 bought this camera I started to get interested in photography. He bought his mostly for videos but also to do photography as well. I'm mostly interested in it for photography but love the option of video. Truly an awesome versatile camera and I've been having so much fun learning and taking photos! Has quickly become a passion!","title":"If you're on the fence.. just get it! You won't regret it!"},{"authorName":"Sebastian B.","creationDate":"2026-02-03T08:18:40","text":"Best. Camera quality for this price","title":"Amazing"},{"authorName":"BRITTON D.","creationDate":"2025-12-25T08:24:12","text":"So far so good.  Amateur here so still learning my way around it but so far it's been great.","title":"Loving it"},{"authorName":"HAROLD R.","creationDate":"2025-12-10T10:53:29","text":"So far a great upgrade from my a6500. The low light performance, auto focus and video quality are a world better.","title":"Upgrade worth it"},{"authorName":"CARLOS A.","creationDate":"2025-10-24T10:53:49","text":"I purchased the Sony A7 IV in October 2024, and after using it alongside my Sony A9, the conclusion is clear: the A7 IV is a less durable camera in almost every aspect.\n\nThe main issue I encountered is the rear screen. Even with a protective glass applied from day one, the screen still ended up cracked under normal use. I never experienced this problem with the A9, which confirms that the A7 IV is built with weaker materials. For a camera at this price point, that is disappointing.\n\nOverall, the camera delivers on image quality and features, but its durability is not at the level required for demanding professional use. In photography, where equipment must withstand real working conditions, specifications on paper mean very little if the body cannot handle the workload.\n\nIn conclusion, the Sony A7 IV offers strong specs, but the fragility of its screen and the overall lack of sturdiness compared to the A9 make it a poor choice for those who value long-term reliability and resistance.","title":"? My Personal Review of the Sony A7 IV"},{"authorName":"KENNETH P.","creationDate":"2025-08-15T15:51:20","text":"I am very, very pleased with my purchase of the Sony A7 IV camera through Adorama. The last time I used a full frame camera was a Pentax 35mm film. The pictures are beautiful. I've only been viewing them on an iPad and I can't wait to do some enlargement prints. This is a great low-level professional level mirrorless, and it has tons of features, but the visible controls are traditional so I could charge up the battery and start shooting with great results. If you're willing to go a little over $2k, you won't regret it. Adorama is always great to deal with and worked with me on some camera/lenses trade-ins. If your thinking about going full frame, give this camera some consideration.","title":"Great Full Frame Camera"},{"authorName":"Laszlo F.","creationDate":"2025-07-30T13:16:09","text":"I had a very pleasant experience buying this beautiful item, thank you.","title":"A7 iv is great highly recommended, great shopping thank you"},{"authorName":"MARK M.","creationDate":"2025-07-29T21:48:14","text":"Great bundle and the camera is everything I was looking for.","title":"Short and sweet"},{"authorName":"KATE A.","creationDate":"2025-07-18T08:08:01","text":"Ordering was smooth, the site worked perfectly, and the bundle matched the complete product description. It shipped in two business days, arrived well-packaged, and everything works flawlessly. No issues with the camera or accessories. Overall, a positive experience and I'd buy from them again.","title":"Great experience buying Sony a7 IV bundle from Adorama!"},{"authorName":"SHALOM C.","creationDate":"2025-07-15T08:39:57","text":"This camera was quite an upgrade! Going from my a7iii to the iv is a world of difference and Adorama made it easy!\n10 bit color, the new menu system, the shots are amazing straight out of camera!\nWould recommend easily as a great hybrid for photo or video, both stunning.","title":"Quite an upgrade!"},{"authorName":"RICH D.","creationDate":"2025-05-28T10:44:58","text":"Terrific camera. Love it","title":"Rld"},{"authorName":"ARCHIE M.","creationDate":"2025-05-21T08:20:12","text":"Amazing camera!","title":"Sony a74"},{"authorName":"ALINA K.","creationDate":"2025-05-01T08:07:05","text":"I really recommend this camera! The best","title":"The best!"},{"authorName":"JESSE W.","creationDate":"2025-04-23T03:11:07","text":"This is my second A7iv, and there is a reason I bought another. Because I like it, and I needed a backup body.","title":"Standby"},{"authorName":"GUY L.","creationDate":"2025-01-04T09:27:11","text":"This is my 2nd Sony a7iv. Love this versatile all around camera. It always makes my work easier. Adorama's bundle just makes the experience that much better. Thanks Adorama!","title":"Sony A7IV"},{"authorName":"EUGENE G.","creationDate":"2025-01-01T07:22:17","text":"The a7 IV is a fantastic camera for a variety of photographers ranging from the amateur to the advanced/professional. While I'm still learning the many features, I love the wide range of customization it provides.","title":"a7 IV initial thoughts"},{"authorName":"JUDY R.","creationDate":"2024-12-24T08:00:38","text":"After a lot of shopping around for our camera, Adorama gave us the best pricing and fabulous customer service!  Meyer is the best!!","title":"Look no further?"}],"highlights":["Superior 33MP Full-Frame image quality.","Rapid autofocus for decisive shot capture.","Capture stunning 4K UHD video content.","Portable mirrorless design; perfect for travel.","Versatile lens selection for creative freedom."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"ISOA7M4K1","image":"ISOA7M4K1.JPG","imageWebp":"sony-alpha-a7-iv-mirrorless-black_isoa7m4k1.webp","desc":"Sony Alpha a7 IV 33MP 4K Mirrorless Camera w/FE 28-70mm OSS II Lens,Black","isConfigurable":false,"productId":"ISOA7M4K1"},{"sku":"IDSXD128GG","image":"IDSXD128GG.JPG","imageWebp":"sandisk-extreme-pro-128gb-sdxc_idsxd128gg.webp","desc":"SanDisk Extreme PRO 128GB UHS-I U3 SDXC Memory Card","isConfigurable":false,"productId":"IDSXD128GG"},{"sku":"SLALPINE200","image":"SLALPINE200.jpg","imageWebp":"slinger-alpine-200-black_slalpine200.webp","desc":"Slinger Alpine 200 Lightweight Compact Camera Backpack","isConfigurable":false,"product thorName":"LEMMUEL D.","creationDate":"2026-09-14T08:36:06","text":"Good for a starting camera!","title":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Black"},{"authorName":"THANH T.","creationDate":"2026-06-19T08:59:59","text":"Came packaged well!","title":"Camera"},{"authorName":"Robert P.","creationDate":"2026-06-02T15:44:34","text":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtl\u00e4nder lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["Capture stunning 26.1MP APS-C mirrorless images","Record cinematic 6.2K 30fps video seamlessly","Experience rapid autofocus for sharp precision","Compact Fujifilm design ensures portability","Versatile 13-33mm lens for diverse shooting"],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXT30M3KB","primaryImageName":"IFJXT30M3KB.JPG","primaryImageNameWebp":"fujifilm-x-t30-iii-black_ifjxt30m3kb.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-xc-13-33-mm/p/ifjxt30m3kb","condition":{"abbreviation":"N","name"  go well. I put it on \"large area\" and it didn't seem to track. Putting it right on auto and it seems to track better than the R6.  Why have all of the modes if it doesn't track well in some of them??? Why change all of the modes instead of just making something that is clear work a little better.","title":"Still trying to figure it out for BIF"},{"authorName":"Johalddy G.","creationDate":"2026-09-14T07:40:35","text":"Recomendado al 100 por ciento, se ha convertido en mi c\u00e1mara favorita","title":"100% recomendado"},{"authorName":"ANDRES C.","creationDate":"2026-09-08T05:38:07","text":"Powerful camera for photography and video; recommended for producing professional videos. Highly recommended.","title":"Poweful"},{"authorName":"Diar G.","creationDate":"2026-08-31T15:04:41","text":"Great camera and as usual great experience ordering from adorama","title":"Great Camera"},{"authorName":"LAURENCE L.","creationDate":"2026-08-28T08:40:24","text":"Fantastic camera!  I'm wildlife photographer, moving from a Canon 6Dii and I had no idea what cameras can do nowadays!  Finally had the money to upgrade and I haven't regretted a single minute.  Of course auto focus and pre-continuous shooting, but it really is so easy to use, canon bodies are laid out so similarly.  Thanks Adorama!","title":"The Hype is Real"},{"authorName":"LAURENCE L.","creationDate":"2026-08-21T11:21:34","text":"exactly as described.  flawless performance.  only a few cosmetic blemishes, as noted in the item description.","title":"Canon 100-400 L"},{"authorName":"JON K.","creationDate":"2026-07-26T21:35:58","text":"This R6III is a second body to my.... other R6III. Needless to say, I love it. \nIf buying a second one is not testament enough, I don't know what is!","title":"R6III- yes"},{"authorName":"LAURIE K.","creationDate":"2026-07-21T12:48:15","text":"This is a huge step up for me from my Canon R10 and I am in love!  The camera does weigh a bit more and I don't love that I had to get all new batteries and cards but the upgrade is worth it.  I primarily shoot wildlife and the tracking is fantastic!  I can't wait to go to Africa with this camera in the fall.","title":"Excellent upgrade from the R10"},{"authorName":"Ashish R.","creationDate":"2026-07-09T20:00:00","text":"Lightweight kit and versatile lens. \nPerfect for me to go between photographing landscapes and people.","title":"Great kit for tourism"},{"authorName":"Mwm7430","creationDate":"2026-06-22T20:00:00","text":"Simple review here. This is the best camera for the money period. I have an R5 and this is a better camera in every way. The files look better and it performs so well in low light and high iso. I don't miss the 10 extra megapixels that the R5 has; when I crop photos they images look amazing.","title":"Best camera for the money period!  Perhaps the best camera at any pri."},{"authorName":"JEANNE H.","creationDate":"2026-06-17T10:35:58","text":"I love this camera.  I run 2 camera bodies at the same time and after I got the first one in November, I got the second one.  For me, it's the \"sweat spot\" of mega pixels and I love the pre-shot feature for bird photography.  And I can't begin to say how great the customer service is!  And this was on both purchases.","title":"Such a great camera, I have 2!"},{"authorName":"LEHI J.","creationDate":"2026-06-12T10:17:17","text":"My first mirrorless camera. So far I am loving it. Massive upgrade from my dslr. I use it mostly for birds so the 40 fps is amazing. If you have a dslr I highly recommend upgrading to mirrorless.","title":"Very impressive so far"},{"authorName":"Kenny C.","creationDate":"2026-06-12T05:58:00","text":"This camera is a significant upgrade from my EOS R. The autofocus and eye detection are so amazing. I haven't even begun to dive deep into it, but I'm already extremely impressed!","title":"Amazing camera!"},{"authorName":"Ronald C.","creationDate":"2026-05-30T07:04:08","text":"This was an upgrade from my decade-old camera, and all I can say is wow, the auto focus is so fast.R6 II has lots of tricks I am still learning how to use.","title":"All I can say WOW"},{"authorName":"Kimberly M.","creationDate":"2026-05-18T12:59:01","text":"This is my first mirrorless camera. I must say I'm loving the photos it takes and how easy it is to focus. If you are on the fence about buying, just buy it, this has to be the best rounded Canon mirrorless at this price tag!","title":"Great Mirrorless for the price"},{"authorName":"John1965","creationDate":"2026-05-16T20:00:00","text":"Fantastic camera with absolutely stunning results! I also have an R7 so all my RF lens will now get the full frame treatment!! The camera feels beautiful in the hand. I wish I had gotten the f/4 lens instead of the cheaper one because the lens is not weather sealed like the camera is. The F/4 lens is weather sealed too so I'd feel better about being out in the rain. Burst mode in the camera is terrific with the electronic shutter.","title":"Terrific camera"},{"authorName":"Ra S.","creationDate":"2026-05-15T20:00:00","text":"It's too pricey but the quality is not good as it is in the description, actually l don't recommend for anyone.","title":"Bad feedback"},{"authorName":"TIME L.","creationDate":"2026-05-12T08:05:21","text":"Great for photos and videos.  We use a 70-200 on it for student photos during sporting events and have been extremely happy with the purchase.","title":"Great for students to use"},{"authorName":"NewbiePhotographer","creationDate":"2026-05-10T20:00:00","text":"I bought this camera because of its full frame. I have an R7 which I love but sometimes the APS-C is not what I want. This R6M3 really compliments my R7 very well. Definitely enjoying the performance in low light. Not that the R7 was bad, but this is better. Beautiful feel in my hand. Construction is awesome. So glad I got this camera.","title":"Glad I purchased the camera!!!"},{"authorName":"NICHOLAS V.","creationDate":"2026-05-02T11:05:48","text":"Love the camera and lens combo!","title":"Canon R6 iii and 14-35 combo"},{"authorName":"ROSS A.","creationDate":"2026-04-22T08:19:13","text":"Perfect in every way!","title":"R6MkIII"},{"authorName":"Ann K.","creationDate":"2026-04-06T07:11:43","text":"I feel like I can do anything with this camera and a good lens. It's inspiring me to keep learning and improving. Big initial investment but I expect it to be with me for a long time.","title":"No regrets"},{"authorName":"FRANK E.","creationDate":"2026-03-06T08:36:03","text":"After shooting SLRs and DSLRs for over 50 years, I was apprehensive about mirrorless and an electronic viewfinder. Additional technology brings more complexity and more points of failure. My mind was set at ease the minute I picked this camera up. It is one solid camera. If the electronics have gotten the same attention to quality as the body, then it should be in the same league as the Canon F1 and 5D Mark IV in reliability and performance. The sheer volume of features is head-spinning, so expect a learning curve. Auto focus is lightning fast and accurate. \n\nMy budget did not support buying some L glass to go with the camera, so I opted for a Canon RF 24-240mm f/4-6.3 IS USM Lens and have found it to a good choice. It also seems well built and has so far performed very well.\n\nOne noteworthy downside to the R6 Mark III is that it is on the power-hungry side, so expect to have at least one set of backup batteries if you expect to do long shoots. I purchased a 3rd party equivalent to the Canon BG-R20 Battery Grip as well to extend the battery life and give a more secure hold on the camera, since with the lens I bought and camera, it is a handful at 3.15 lbs. (camera, purchased lens and 1 internal battery.) \n\nTo date, I could not be more pleased with my purchase...","title":"Solidly built, full featured and a great camera"},{"authorName":"yosni","creationDate":"2026-03-03T19:00:00","text":"Super happy, i love the camera, easy to used. The videos and pictures are amazing strongly recommended it for personal and professional.","title":"Amazing camera"},{"authorName":"BikerDude1","creationDate":"2026-02-28T19:00:00","text":"I purchased the R6 MK II Camera in March of 2023 and this has been a wonderful camera to shoot with. Fast, Sharp, Accurate, and a joy to use.  I will keep this simple and just show you some basic photos that were shot with Canon L series lenses including the RF14-35 F4, RF24-105 F4, RF50 1.4, RF70-200 F4, and RF100-500 F4.5-7.1. NO filters & NO Editing were used on the following photos.  Photos provided were shot in the lowest .jpeg format for this camera.","title":"R6 MK II CameraR6 MK II Camera - Great Camera to shoot with"},{"authorName":"Will11","creationDate":"2026-01-29T19:00:00","text":"I have not used enough to go give realistic rating.","title":"Ok"},{"authorName":"Dione34","creationDate":"2026-01-26T19:00:00","text":"Very good camera for the price. I enjoy using the Canon R6 Mark III.","title":"Solid Camera!"},{"authorName":"Larry B.","creationDate":"2026-01-08T11:37:14","text":"Love this new camera. Additions were tremendous across the board. Excellent job to Canon upgrades all beneficial to both stills and videos. One of the mirroeless cameras available period.","title":"Canon EOS R6 Mark 3 camera."},{"authorName":"Elder 5.","creationDate":"2026-01-05T06:28:11","text":"Moving from DSLR to mirrorless, I noticed the difference immediately. The AF is faster, and the burst shooting mode makes it so much easier to choose the best shot. I love it!","title":"First Mirrorless"}],"highlights":["Superior Image Quality with 32.5MP full-frame sensor.","Blazing fast Autofocus Speed captures decisive moments.","Exceptional Low Light performance with expansive ISO.","Professional-grade Video Capabilities, 7K up to 60fps.","Compact, Portable design for effortless shooting mobility."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"CAR6M3","primaryImageName":"CA ":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtl\u00e4nder lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["Capture stunning 26.1MP APS-C X-Trans CMOS 4 images.","Record cinematic 6.2K 30fps video seamlessly.","Experience responsive autofocus speed for clarity.","Utilize compact portability with this mirrorless camera.","Benefit from excellent low light camera performance."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXT30M3B","primaryImageName":"IFJXT30M3B.JPG","primaryImageNameWebp":"fujifilm-x-t30-iii-black_ifjxt30m3b.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-body-only/p/ifjxt30m3b","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":999,"effectivePriceCode":5,"highPrice":999,"guestPrice":999,"trialPrice":70,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":false,"thumbnailImageName":"IFJXT30M3B.JPG","thumbnailImageNameWebp":"fujifilm-x-t30-iii-black_ifjxt30m3b.webp"}],"isA s to save, bundle","type":3},{"title":"Buy for as low as $2,759.00 in Used","trackData":"listing page, ways to save, available in used","type":0}],"variantSku":"ISOA7M5","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"242\",\"TotalPrice\":\"2898\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>242</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"ADAM W.","creationDate":"2026-08-29T22:19:27","text":"Upgraded from A7 II to A7 V and could not be happier","title":"Worth every penny"},{"authorName":"JONATHAN M.","creationDate":"2026-08-18T10:56:24","text":"this camera bundle has surpassed all of my expectations","title":"Great Camera, Great Bundle!"},{"authorName":"Matthew G.","creationDate":"2026-08-08T16:12:40","text":"33mp is barely enough, but aside that this cam stays focused well!","title":"Superb Focus!"},{"authorName":"NATHAN P.","creationDate":"2026-06-26T08:34:04","text":"What a huge upgrade from my A7III. The autofocus is amazing in this camera and the video specs are beautiful!","title":"Best alpha camera for the price"},{"authorName":"NATHAN P.","creationDate":"2026-06-26T08:32:38","text":"What a huge upgrade from my A7III. The autofocus is amazing in this camera and the video specs are beautiful!","title":"Best alpha camera for the price"},{"authorName":"THOMAS T.","creationDate":"2026-06-25T05:57:10","text":"Love my camera! I upgraded bodies from the A7Cii because I wanted a more comfortable EVF experience plus the new pre-capture feature for shooting my fast paced travels. The Sony app works pretty solidly too for remote shooting and transferring handfuls of photos on the fly.","title":"Moved up from the A7Cii and I love it"},{"authorName":"MARY S.","creationDate":"2026-06-17T08:19:07","text":"Absolutely love this camera and lens. I made the switch from Canon to Sony and it's the best decision I've made. Super easy to use and the picture quality is amazing!","title":"Sony for the win!"},{"authorName":"daniel u.","creationDate":"2026-06-01T17:04:39","text":"Honestly, this was my intro to a full-frame camera. Upgraded from the a6700. So far, getting used to the weight and the vast amount of things this camera can capture. So far, I've paired it with the Sigma 24-70 and have no complaints. Looking forward to getting better at capturing moments, not to focus on perfection","title":"Upgrade from aps-c to full frame"},{"authorName":"JASON H.","creationDate":"2026-05-22T12:31:13","text":"Amazing camera and a great upgrade from the IV","title":"A7 V"},{"authorName":"DOUGLAS S.","creationDate":"2026-05-13T02:28:07","text":"I would buy it again!","title":"A7V review"},{"authorName":"JULIAN F.","creationDate":"2026-05-04T23:13:09","text":"Camera came in quick & protected. Been using it for over a month now. Still learning the settings but overall very easy to use and get to know. Great feel and durability.","title":"First Time Sony User"},{"authorName":"ANTHONY N.","creationDate":"2026-04-29T05:31:14","text":"My still images look great. However, I got this camera for sporting events. I finally got a chance to use this camera in a \"sporting venue\". I used it in a steer roping arena with my 70-200 lens. I had set Auto Focus, 1250 ISO, 1/1000 shutter, and 30 shots/sec. I took a little over 2000 photos. With fast moving horses, steers running, and lassos flying, this camera tracked and focused super fast. Of the 2000+ shots I think I lost about 10 due to out of focus, but I believe that was because I brought the camera mid horse stride and just started clicking as they rode by. The camera locked in after a frame or  two. I do have to go back to the manual to find out why I wasn't able to set exposure comp. It kept telling me that it was disable because ISO was set to AUTO, but it wasn't. So clearly I have a mis-understanding. But all-in-all ... fabulous camera.","title":"Fabulously fast tracking, focus ans sharp images"},{"authorName":"JASON W.","creationDate":"2026-04-26T03:40:25","text":"So far so good! I have been using this camera for a few weeks. I am very happy with the ease of use and image quality. This is my first A series frame so I was not sure what to expect. The build quality feels solid. It feels good in the hand, and I am loving the lens ecosystem.","title":"First A series for me"},{"authorName":"ANTHONY N.","creationDate":"2026-04-23T16:11:43","text":"Got a chance to see just how fast the camera is at a steer roping competition. I was shooting at ISO 1200 and 1/1000 secs. The camera caught horses chasing steers and cowboys throwing ropes. Everything was crystal clear and \"frozen\" in time.","title":"Awesomely Fast"},{"authorName":"STEVE M.","creationDate":"2026-04-08T14:47:44","text":"Versatile camera. Pretty straightforward to learn and use. Needed the weather sealing in Iceland! Definitely recommend it.","title":"Great camera in tough conditions"},{"authorName":"BRADLEY F.","creationDate":"2026-04-07T09:17:54","text":"So far so good. I'm still learning the ins and outs of the camera. It seems to have very good battery life and easily navigable menus as well as being light weight and comfortable to hold.","title":"A7V First look"},{"authorName":"STEVE M.","creationDate":"2026-04-02T04:18:05","text":"Just took it on a trip abroad. Worked well in all conditions. Still have to review picture quality, but suspect excellence.","title":"Sony Alpha 7V-Looking good"},{"authorName":"SID A.","creationDate":"2026-03-16T09:49:29","text":"Just everything I need. I have the Sony A9ii and in my opinion, this was a great upgrade for me.","title":"Great upgrade/enchancement!"},{"authorName":"JAMES S.","creationDate":"2026-03-15T08:36:14","text":"great transaction","title":"Wonderful on line transaction"},{"authorName":"JESUS O.","creationDate":"2026-01-30T14:47:23","text":"Upgrading to the Sony a7 V has been a good move. I've always loved the 33MP resolution but the new partially stacked sensor makes everything feel incredibly snappy. The standout for me is the blackout-free 30fps burst shooting","title":"Sony A7V"},{"authorName":"BRYAN T.","creationDate":"2026-01-19T10:19:29","text":"I bought my A7IV when it was released and loved it. My photography has stepped up so much in the short time I've had this camera. I cannot recommend it enough!","title":"A worthy upgrade!"},{"authorName":"JAKE M.","creationDate":"2026-01-12T21:17:25","text":"My preorder had been canceled from another site, i quickly ordered with Adorama and they were in stock and shipped out faster than any other retailer, while taking care of my camera. Brand new perfect condition, i love this camera so much it is the best hybrid on the market!","title":"THE BEST HYBRID + ADORAMA ROCKS"},{"authorName":"JOSEPH B.","creationDate":"2026-01-11T14:32:44","text":"The Sony Alpha A7V, can be described in single words that collectively describe my experience and enjoyment since my purchase through Adorama. Words like, jaw-dropping, intuitive, speed, precapture, excited, and satisfied. I was on the fence to purchase the A7V since I have the A7iii and A7iv, and did I really need to upgrade. We'll, the A7V not only met my expectations, it also blew everyone of them out of the water! Ever since the spec were confirmed I knew I had to pull the trigger. Using my Adorama card, the transaction was flawless, and I also receive my A7V in less than 48 hours! Immediately I bagan putting it to the test of Astrophotography, which was smooth as butter seemless from the A7iv experiences. Then onto the wildlife where the A7V shined like a champion! The Auto focus tracking, precapture, speed, and resolution are a match made in Sony heaven! I would recommend the A7V to anyone wanting the superiority of a top tier camera model priced at the mid level range!","title":"Superior Performance Beyond Expectations"},{"authorName":"MARK R.","creationDate":"2026-01-09T08:35:02","text":"I had a A7R IV I and switched to the A7 V so many features that work great for me it's a great camera \nAdorama is a great company the gave me an amazing price for my previous camera in trade. Everything went smoothly.","title":"Upgrading"},{"authorName":"Tony V.","creationDate":"2026-01-08T11:20:27","text":"After four years use, I upgraded from the Sony A7 IV, an excellent camera in its own right.\nQuite pleased with the new & improved features of the A7V, including shooting stills at 30 fps, higher video quality and the impressive reticulating screen.","title":"Happily upgraded from the A7 IV."},{"authorName":"KELVIN L.","creationDate":"2026-01-08T07:21:28","text":"Upgrading from the Sony a7 IV to the new a7 V has been totally worth it for me. I mostly photograph dogs and cats, and the autofocus/tracking feels quicker and more reliable-especially for wiggly pets and fast little movements-so I'm getting more keepers. Image quality is excellent, handling feels refined, and everything arrived fast and well-packed from Adorama.","title":"Paws-itively Better Than the a7 IV"},{"authorName":"VERNON H.","creationDate":"2026-01-04T18:11:16","text":"Very happy with my 2nd Sony A7 camera","title":"Sony A7V"},{"authorName":"Darren M.","creationDate":"2025-12-24T04:49:25","text":"Nothings perfect but God but as far as camera's go this one is amazing. As a previous owner of the a7iii and a7iv this cameras auto focus and tracking is excellent. I also currently own two Lumix cameras s5iix and the S1R11 each camera has their strengths and weaknesses. But as the honest YouTube creators say in this day and age all of these new mirrorless cameras are great. The only determining factor is need and price.","title":"Mind Blowing"}],"highlights":["Capture stunning 33MP Image Quality with ease.","Experience rapid Autofocus Speed for crisp shots.","Achieve superior low light video capabilities.","Enjoy excellent portability with a compact design.","Dynamic Active Mode enhances video stability."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"ISOA7M5","primaryImageName":"ISOA7M5.JPG","primaryImageNameWebp":"sony-alpha-a7-v-mirrorless-camera_isoa7m5.webp","options":[],"websiteUrl":"https://www.adorama.com/sony-alpha-a7-v-mirrorless-camera/p/isoa7m5","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":2898,"effectivePriceCode":5,"highPrice":2898,"guestPrice":2898,"trialPrice":203,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":true,"thumbnailImageName":"ISOA7M5.JPG","thumbnailImageNameWebp":"sony-alpha-a7-v-mirrorless-camera_isoa7m5.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":203,"rebateSavings":2350},{"sku":"INKD850","persuasionStrategies":[{"expiresDate":"2026-10-04 23:59:00.0","message":"Limited Time Offer <span>3 days 10:43:50</span>","overallRating":null,"persuasionType":4,"reviewerInfo":null}],"brand":"Nikon","prices":{"price":2396.95,"youSave":{"dollar":200,"percent":8},"highPrice":2596.95},"stock":"In","subStatus":{"name":"In Stock"},"badgeText":"Special","categoryId":239798,"categoryPath":"Photography/Cameras/Digital SLR Cameras","productUrl":"/nikon-d850-dslr-camera-body-46-mp/ ateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>200</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":{"expertName":"Seth Miranda","expertPageID":15939,"pageID":16140,"reviewText":"The Nikon D850 and I go way back. It's been my go-to camera for portrait photography, and the camera I recommend to any Nikon shooters ready to step up their game. If you want the highest-res images with sharp, precise details, put the D850 on your list.","skUs":"INKD850"},"productReviews":[{"authorName":"TODD E.","creationDate":"2026-04-08T09:45:07","text":"Truly, an excellent camera. I know many people are heading toward mirrorless but for my money, this D850 cannot be beat. I haven't had a good DSLR since a Canon EOS 1DS mark II many years ago. Now I'm gathering lenses aside from a few primes one of the best lenses I have so far for every day use is a Tamron 28-300 F3.5-6.3 DI PZD VC. For the money it is absolutely superb all the way in or all the way out it's tac sharp.\nI do a lot of large format printing and the 45.7 megapixels make the 16 x 20 prints look truly unbelievable. I could not be happier with the camera or the service received from Adorama.","title":"Nikon D850 yes please! Buy two while you can?"},{"authorName":"ROBERT M.","creationDate":"2026-03-22T15:23:09","text":"Camera and accessories arrived quickly and they were packaged well.  After a trip out to the Mojave Desert, the D850 seems quite the up-grade from my D810.  Although I didn't have much time to become totally acclimated with the D850, I was able to take quality photographs with ease.","title":"New Nikon D850"},{"authorName":"Jason L.","creationDate":"2026-03-10T09:11:10","text":"So I've been a Nikon shooter since I started shooting film with the FG. Something about staring through the viewfinder-penatsprism-mirror of a (D)SLR always has me going back to grabbing my D500 instead of my Z8. Don't get me wrong the Z8 is an amazing camera, but looking at a screen inside the viewfinder is tiring and takes away from my experience/love of photography..let alone the abysmal battery life. So why the D850? I primarily shoot landscapes, sports, birding, and astro...and while the D500 is capable...the color depth/reproduction of a FX sensor looks that much better to my eyes than a DX sensor does. The high megapixel sensor of the D850/Z8 allows for me to crop in when birding or shooting sports. I shot a wedding the same weekend I received the D850 and paired it to a 24-105 f/4 Sigma and the images are amazing! The D850 body feels more balanced with the Nikon 70-200 f/2.8 and Sigma 150-600mm Sport compared to the Z8. Theres not much more needintto be said about the D850 as it's been reviewed plenty over the years. With the current price drop, it's a steal for a flagship camera...the included bag is surprisingly spacious with plenty of storage pockets, I do wish the shoulder strap came with a padded non-slip piece (I can take it from another strap). And the 64GB Sandisk is a great card, but I'd suggest getting larger card especially if you plan to shoot with the continuous shooting modes or RAW.","title":"Gone mirrorless and came back!"},{"authorName":"PHIL M.","creationDate":"2026-03-04T00:08:44","text":"What a great camera. I should have bought it when it first came out.","title":"Awesome"},{"authorName":"SANTIAGO S.","creationDate":"2026-02-17T10:18:59","text":"Excellent camera, hands down.  If you prefer DSLRs, you won't find better than this.","title":"Top notch camera"},{"authorName":"Ernie S.","creationDate":"2025-10-30T18:24:43","text":"GREAT CAMERA","title":"NIKON D850"},{"authorName":"ERNIE S.","creationDate":"2025-10-30T18:23:44","text":"the spare battery is terrible , i have never had any luck with these types of batteries , this one has never got over partly charged and will not energize a camera , please provide something other than this for aspare battery!!!!!  GXENEL15CV3","title":"GXENEL15CV3"},{"authorName":"ANNIE T.","creationDate":"2025-08-29T15:19:46","text":"I bought the D850 as an upgrade for my D810, and I LOVE it so much!  The touch screen is very helpful and how the pinchable zoom in/out feature makes photoshoots takes the \"did I get the sharpness\" guesswork out, which makes me tempted to buy a second D850 camera body!  \n\nThe bundle with the Flashpoint is terrific because this off-camera flash is very lightweight and easy to use.  I've had a Nikon OFC in the past that had a broken piece, and I am very pleased with how fast this charges and how much light is emitted in comparison.","title":"10/10 I'd recommend! In fact, I now want another one!"},{"authorName":"william g.","creationDate":"2025-08-17T13:02:38","text":"great camera-too bad Nikon deceived us all by reducing their prices on these cameras after we just purchased them","title":"typical Nikon excellence"},{"authorName":"MARK R.","creationDate":"2025-08-14T11:43:39","text":"Moving up from a D810 I'm pleasantly surprised about the upgrade. Sadly it is probably the last DSLR and Nikon is moving to mirrorless.","title":"Very Happy"},{"authorName":"ANDREA C.","creationDate":"2025-08-12T08:15:11","text":"Customer service was great to work with and very responsive.","title":"Great experience"},{"authorName":"BRENDA G.","creationDate":"2025-07-20T13:36:44","text":"Great camera!!! I'm sure that I will never use all of the features that it has to offer but I'm glad that as my technical skills improve, this camera body's bells and whistles are available as my knowledge of photography increases.","title":"Wow!!!!!"},{"authorName":"Bruce G.","creationDate":"2025-07-11T09:31:42","text":"Absolutely delighted.\nNikon is phasing out F mount bodies, so I bought this second one on sale.\nI have a substantial investment in F mount lenses, and zero interest in moving to mirrorless.","title":"Like It So Much, I Bought a Second One"},{"authorName":"JAMES G.","creationDate":"2025-07-06T08:08:10","text":"So far I'm left in the d850.  You can come from a d90 that I've been shooting with for the past 13 years. Wanted to make the jump to full frame before a big trip that I have planned. The camera feels rugged and there's plenty of tutorials on how to get the most out of the camera.","title":"I'm loving it"},{"authorName":"CRAIG M.","creationDate":"2025-05-22T00:34:16","text":"Beautiful camera with 42 megapixels the quality is unmatched. You could blow a photo of 10 foot and still look good. Highly recommend it.","title":"I give it a 10 out of 10"},{"authorName":"DAVID W.","creationDate":"2025-03-31T12:44:04","text":"The bundle was nice, the camera is fabulous.","title":"Best DSLR ever made."},{"authorName":"Raymond T.","creationDate":"2025-03-10T07:32:14","text":"I have enjoyed my first D850 for 6 years, and decided to purchase a second one as a backup, and a secondary lens setup on my photography ventures. I have no desire for any other camera with this proven winner. Highly recommend!!","title":"My second D850!"},{"authorName":"Aurelio D.","creationDate":"2025-03-07T19:55:28","text":"I acquired the Nikon D850 upon its release several years ago, primarily for travel photography.  While my passion is travel, not professional photography, the camera's strengths are well-documented. However, its significant weight and size present challenges.  Extended periods with the camera around my neck are uncomfortable, and accessing it from my backpack while traveling is inconvenient.  I predominantly use a zoom lens to minimize lens changes, resulting in underutilization of my 50mm prime lens.  Employing primarily manual settings has rekindled skills honed in my youth with a Leica M2.  The camera's flash capabilities are exceptional, and I intend to explore the use of dual flash units.  Regardless, mastering the D850's full potential necessitates dedicated practice and training. I am 63 merchant marine officer still boarding ships.","title":"Thoughts on my trusty D850, and how heavy it is."},{"authorName":"ALEX P.","creationDate":"2025-02-18T04:25:50","text":"I went from a Nikon D3 to a Nikon 850 which was a quantum leap in image quality.  Built exceptionally well with good balance in the hands.  My only pet peeve is that it doesn't show the exact frame number in the LCD display.  Unless I am doing something wrong, it might be because the memory card holds so many images, it would take up too much space in the display.  With a new card, mine shows 1.7k, which I assume means 1,700.  Otherwise great camera.","title":"Great Camera"},{"authorName":"Kevin L.","creationDate":"2025-02-13T15:06:32","text":"After years of being stingy I upgraded to this camera from the D750. Wow! This is terrific and I wish I'd done it sooner. The file sizes are large enough that I can crop out little mistakes around the edges without ruining my shot. The best part is that I was able to keep all my original lenses without adapters. I highly recommend this camera to anyone with a bit of experience shooting.","title":"Nice upgrade for me"},{"authorName":"Raymond T.","creationDate":"2024-12-09T14:41:58","text":"Purchased a second D850 as a backup to my first one. I have had my first one since 2018. It's a beast, and I would highly recommend it to anyone. I have no desire to go mirrorless.","title":"Highly Recommend The Nikon D850!"},{"authorName":"JOHN S.","creationDate":"2024-12-07T22:50:39","text":"of course the D850 was great. the bundle, unfortunately was a bunch of low quality product, you would think this fairly high end camera would be bundled with better quality stuff. the memory card was fine. battery is after market. card reader has already failed. bag too small for anything. delivery was super quick. even with the crappy bundle, i am happy with adorama and will shop again.","title":"bundle bungle"},{"authorName":"DAKOTA P.","creationDate":"2024-04-09T08:10:24","text":"Great camera! Competitive with current mirrorless and provides native use of F mount lenses which are more affordable and readily available","title":"Great Value!"},{"authorName":"WILLIAM B.","creationDate":"2024-04-02T11:11:17","text":"All I needed was the Nikon 850 but the extras I gave to my kid to use Which was great. The D850 is a strong camera and hopefully will be in the line for a couple more years","title":"D850"},{"authorName":"DAKOTA P.","creationDate":"2024-04-02T05:42:49","text":"Great camera! Competitive with full frame mirrorless bodies (considered Z7II) while maintaining familiar DSLR controls and style. Additionally, great selection of excellent condition DSLR lenses are available from Adorama due to many individuals transitioning to mirrorless. The bundled items were useful and sold me on adorama versus competitors","title":"Great camera & great service"},{"authorName":"REBA G.","creationDate":"2023-11-21T08:54:23","text":"I just did my first session and the clarity is amazing.  The high ISO capabilities are way better than the D610 I used previously. The kit had lots of great extras that buying from Amazon won't give you for the same price.","title":"Nikon D850 is the bomb!"},{"authorName":"Daniel H.","creationDate":"2023-10-20T17:34:21","text":"fantastic images.  Incredible lens choices.","title":"the best Nikon ever"},{"authorName":"Marvellous D.","creationDate":"2023-09-20T07:02:19","text":"Despite the releases of so many new cameras, this camera still remains relevant and will continue to be. The ergonomics, the sensor, the image quality, the easy of use and availability of great lenses makes this a keeper.","title":"Still one of the best cameras available"},{"authorName":"DAYLAN B.","creationDate":"2023-08-11T23:15:12","text":"Bought this camera almost 5 years ago and never looked back. The ergonomics are incredible, the images you capture with this will drop your jaw from the back screen to the big screen, the jpegs SOOC are sublime, as I write this in 2023 in an era where mirrorless is the \"future\" I confidently say there I have zero desire to \"upgrade\" unless my D850 and all other D850s around the the world simultaneously combusted along with the schematics to manufacture new D850s. There's a reason why all the new 45mp mirrorless Nikons being are compared to this 5 year old camera when your assumed that they moved on to a newer camera as a point of refrence: because ithe D850 is just that good. Video is an afterthought, features that Nikon merely tacked on to just say they're on there. Outside of static postiion video recordings, I wouldn't choose this for video if that's in your top 3 list of priorities for a camera purchase, this is a stills Jack-of-all-trades tool","title":"One of the greatest purchases I've ever made"},{"authorName":"DAVID A.","creationDate":"2023-06-06T05:16:48","text":"Came from Nik 810 and before that 800e.\nTried out d850 4 years ago and sensor better if cropping, so really better.  Waited for N upgrade with meaningful better sensor, ie., Z series, but pretty close didn't mean worth upgrade for me.\nAlready have range of N primes, zooms, 300 2.8, nik 200mm macro, etc.  Yet to pull trigger on 500mm.\n20 yr Nikon user.\n\nDecided to use existing lenses w D850.   I bought 250 mb card which prob don't need as won't be doing video.  Point is new cards should be factored into alternative cost of Z9.\nI thought focus shifting a bonus but doesn't work with my macro lenses that aren't afs, menu grayed out, bummer, as focus shift for macro might be nice.\n\nLive view and focus peaking for macro, only in manual mode, works and is useful.  That one reason worth keeping,  for me.\nNikon long telephoto are expensive and so much so that if I add that would strongly consider entire switch to Sony if I decide long tele and birds in flight something   I \"need.\"","title":"Almost as expected."}],"highlights":["Capture stunning detail: 45.7MP FX-Format CMOS.","Exceptional image quality: ISO 64 to 25,600 (expandable).","High-speed shooting: Up to 7 fps for action shots.","Pro Nikon DSLR: Renowned brand, trusted quality.","Record 4K UHD video: Capture cinematic brilliance."],"freeShipTypeName":"Free Overnight Shipping","isPrintiqueProduct":false,"freeBundleItems":{"items":[{"sku":"ILXSD2561667","isConfigurable":false,"title":"Lexar SILVER Series Professional 1667x UHS-II SDXC Memory","stockStatus":"In","productId":"ILXSLVR1667X","brand":"Lexar","mfgModel":"SILVER Professional 1667x","primaryImageName":"ILXSD2561667.JPG","primaryImageNameWebp":"lexar-silver-series-1667x-256gb_ilxsd2561667.webp","subStatusInfo":{"name":"In Stock"},"isAvailableForStorePickup":true,"isAvailableInStore":true,"quantityMinimum":1,"quantityMaximum":1},{"sku":"COPROSCCB","isConfigurable":false,"title":"Capture One Pro, Camera Bundle Prepaid Subscription, Coupon Code (Sold with Bundle Only)","stockStatus":"In","productId":"COPROSCCB","brand":"Capture One","mfgModel":"Pro Subscription Coupon","primaryImageName":"COPROSCCB.JPG","primaryImageNameWebp":"capture-one-pro-camera-bundle_coprosccb.webp","subStatusInfo":{"name":"Download Version","description":""},"isAvailableForStorePickup":true,"isAvailableInStore":false,"quantityMinimum":0,"quantityMaximum":1}],"savings":353.99,"description":"Free 256GB PRO Memory Card & Capture One Subscription","rebateId":304938},"variants":[{"sku":"INKD850","primaryImageName":"INKD850.JPG","primaryImageNameWebp":"nikon-d850-dslr-camera-body_inkd850.webp","options":[],"websiteUrl":"https://www.adorama.com/nikon-d850-dslr-camera-body-46-mp/p/inkd850", xt":""},"asLink":false},"mfr":"1659","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[{"title":"Sell or Trade your Gear","link":"/g/used-quote","trackData":"listing page, ways to save, sell or trade","type":4},{"title":"Save up to $880.00 with bundle","link":"https://www.adorama.com/nikon-z-6ii-mirrorless-camera/p/nkz6m2","trackData":"listing page, ways to save, bundle","type":3},{"title":"Buy for as low as $1,045.00 in Used","trackData":"listing page, ways to save, available in used","type":0}],"variantSku":"NKZ6M2","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"129\",\"TotalPrice\":\"1546.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>129</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"KELLY P.","creationDate":"2025-03-11T16:01:23","text":"Love my new camera.  The sling strap is not the best as it goes in the bottom of the camera.  Makes it a little awkward","title":"Love this mirrorless camera"},{"authorName":"JEREMY D.","creationDate":"2024-12-29T04:12:04","text":"This camera is amazing. I am an old school film user and very happy with the camera. I like having all the external buttons just like my old Nikons. The kit is very handy as it includes most of what you need for a day out.","title":"GReat bundle to get you going"},{"authorName":"Jeremy D.","creationDate":"2024-12-18T02:08:28","text":"So far this camera is perfect for me. Solid build and takes great pics.","title":"Perfect for me"},{"authorName":"ROBERT P.","creationDate":"2024-09-15T03:37:22","text":"Everything I expected in a nikon.\n\nGreat price for such a featured filled camera.\n\nChose this over z6iii based on cost and I don't do video.","title":"5 star"},{"authorName":"Benjamin C.","creationDate":"2024-09-10T08:15:38","text":"Adorama is my go to for camera gear, and the z6ii bundle from them has been perfect. Much higher value than other bundles I've seen and cheaper.","title":"Adorama has the best bundle options out there!"},{"authorName":"JENI D.","creationDate":"2024-08-09T03:01:59","text":"This is a great camera.  It is easy to use in an automatic mode and provides amazing photos, but also allows for more experienced and enthusiasts of photography to control and vary their work.","title":"Simple, yet complex all in one camera!"},{"authorName":"ERIN B.","creationDate":"2024-07-31T08:03:13","text":"Second time buying this set! Great for weddings.","title":"Great for Weddings"},{"authorName":"JERRY K.","creationDate":"2024-07-19T08:23:20","text":"Product was well packaged and delivered on time.","title":"Nikon Z6ii bundle"},{"authorName":"ERIN D.","creationDate":"2024-04-16T08:07:51","text":"Arrived quickly and the camera is excellent in low light situations. I upgraded from a D750, and its my first mirorrless and its easy to get used to","title":"100% recommend"},{"authorName":"Elie S.","creationDate":"2024-03-28T12:44:55","text":"Lightweight and very versatile.  This camera fits great in my hands and has a very easy learning curve.","title":"Great allround camera."},{"authorName":"KEVIN M.","creationDate":"2024-03-14T08:35:29","text":"Awesome camera. I'm a very big fan of image quality and got the camera is affordable for what you get.","title":"Great Full Frame Camera"},{"authorName":"JOSE E.","creationDate":"2024-03-12T12:05:42","text":"I couldn't be happier with my choice.  After comparing other brands base on my budget, and specs, I went with Nikon.  Always been a Nikon fan.  It feels good in the hands, easy to carry around, and the dials/nav are easy to use and to get to.  It's a learning curve, first time venturing into a full frame mirrorless camera and I'm happy with what I've seen so far.  The shots here were taken with the Nikon Z 28 f2.8 SE lens... such a fun lens!","title":"POWER HOUSE"},{"authorName":"Tim W.","creationDate":"2024-03-01T04:01:11","text":"Upgraded from my D750. I shoot mostly wildlife. The first thing I noticed is that the images are clearer compared to the DSLR. Shot some photos of a hawk that hangs around our back yard with an f mount 300 f4 lens. Images were awesome. Another reason I went mirrorless is I'm wanting to try video. Will be selling some f mount lenses to buy z mounts. So far very pleased with the upgrade.","title":"Glad I went mirrorless"},{"authorName":"Martygair","creationDate":"2024-02-28T08:41:32","text":"Outstanding all the way around, I do a great deal of low light photos, this is the perfect tool","title":"Perfect tool"},{"authorName":"William H.","creationDate":"2024-02-16T12:20:53","text":"I recently upgraded to the full frame Z 6II from my D500. The first thing I noticed was the difference in weight. The Z 6II is much lighter and the body is more compact. I have fairly large hands so the smaller grip on the Z 6II takes some getting used to. I have noticed that the kit lens that came with my Z 6II is an S Line series lens which provides extremely clear photo detail compared to the lenses on my D500. Don't get me wrong, I still love my D500 but the clear advantages of the new full frame mirrorless cameras is very noticeable indeed. I have only used the camera for a short time, and I am very pleased with the results I'm getting so far. Great camera and lens combination at a good price. Thank you Nikon.","title":"Upgrade From My D500"},{"authorName":"ikoniknikon","creationDate":"2024-02-14T13:21:39","text":"Picked up one of these while they were on sale for $400 off and I don't regret it one bit, the performance of this thing is outstanding all around and fairly easy to use. Mildly heavy and my only complaint is that extended or long exposure pictures absolutely need to be on a tripod as this camera's VR is honestly not the greatest. Wouldn't trade it for anything else still, it's an incredible value and well done product by Nikon who I've grown to love as a beginner and first time customer. Battery life is also excellent and the fold out screen is great except it can't fold out like a door, buttons are pretty solid and some are even metal, doesn't really get hot with mild use.","title":"Best value and outstanding quality."},{"authorName":"DAN D.","creationDate":"2024-02-11T16:04:01","text":"I love this camera!  I upgraded from a Z6 and I am not disappointed.   It is amazing how you tolerate things because you have to.  Case in point, the Z6's auto focus.  Subsequent firmware updates did make it better.   But the Z6ii, blows away the Z6 in every way.  Focus, buffer, processing speed.  If you are on the fence about getting this camera, even in 2024, just do it.  You won't regret it.","title":"Great Upgrade from Z6"},{"authorName":"Silverfox","creationDate":"2024-01-22T03:40:52","text":"Works great\nCompact\nExcellent picture quality in low light\nPut the 24 to 200 on it and you are all set for travel photography","title":"Great Travel Companion"},{"authorName":"Jesse W.","creationDate":"2024-01-08T08:00:27","text":"Amazing camera. The best camera I've ever owned... well, until last week I bought the Z8. That one takes the cake. I still love the Z 6ii though.","title":"Great Camera"},{"authorName":"Leif P.","creationDate":"2023-12-28T17:23:42","text":"Lessons learned about the Z6ii over the last few weeks - mostly for video.\n\n-manual ISO only works in photo and not video.  To adjust brightness for videos use the Exposure Compensation button.  \n\n-The camera overheats in 4K video with 60 frames per second  (fps).  You have to switch down to 24 fps and it won't overheat. \n\nOverall, it's a great camera, and I can't wait to get some other lenses.","title":"Overheats during 4K Video with 60 FPS"},{"authorName":"Michael S.","creationDate":"2023-12-25T02:00:35","text":"I made the leap from DSLR after lots of research and lm glad I did. The clincher for me is that I can use my AF-S type lenses with the FTZ-2 adapter. \nOutstanding!!","title":"Outstanding Performance."},{"authorName":"Matt H.","creationDate":"2023-12-20T08:16:27","text":"First foray into full-frame mirrorless moving up from D500 (previously D5100 my first Nikon!).  Still learning some different button locations and adapting to the smaller size from the D500 but learning curve is simplified due to Nikon's fairly consistent menu system. I'm shooting with all my DX lenses with the FTZii adapter and have been very impressed so far. Can't wait to get my Z full-frame lenses to realize the full potential of this camera.","title":"Love this so far!"},{"authorName":"Dewman","creationDate":"2023-12-11T01:18:53","text":"I've used  both the D850 and D750 extensively. They are good but the Z6 ii is better. It's phenomenal in low light. The ability to customize the menu is outstanding. Coupled with the Z 70-200 2.8 S lens you get the sharpest photos and spot on color balance!","title":"Outstanding Mirrorless camera for the money"},{"authorName":"Adam L.","creationDate":"2023-12-10T08:38:32","text":"I have been wanting to try mirrorless photography for some time and just couldn't pass up the deal on the refurbished 6II. I am still learning about all the features available in this camera, but, so far, am very impressed. It is so nice to be able to make adjustments to the settings without taking my eye away from the EVF. I really like that the image in the EVF and monitor are always live view instead of having to flip a switch to get to live view. The IBIS is great for low light conditions for lenses without VR capability. And, as with all Nikon cameras, the image quality is incredible. I am looking forward to many adventures with this camera.","title":"Still learning but very impressed"},{"authorName":"Monty","creationDate":"2023-12-03T08:15:19","text":"Ok, been out of photography for about 10 years.  So, this is a vast step up from D200 previous.  So far, best camera I have ever owned.  Some concerns however, just how strong is the lens mount?  YES, with FTZ adapter, hold onto lens instead of camera.  New mindset for that, although love the way my Nikkor AF-S 70-200G F/2.8 (F-type Mount) lens works on this camera.  My old AF-S 28-70 F/2.8 lens has bad focus motor-unrepairable so had to buy Z-24-120 F-4-S lens. it's great.  Still learning all the ins and outs on camera.  Purchased from B and H, just best place to buy stuff.  Low light inside is good.  Switching between auto and A modes.  Have not tried video, since that is NOT reason I got this.  One day might know enough to be competent.  Great Starting Out camera-high enough up line to give great performance, but down enough not to break bank if not professional.  Should, based on past quality last me for years.","title":"Old new User"},{"authorName":"Dennis S.","creationDate":"2023-11-25T17:05:50","text":"Only just beginning to get used to it, but so far I love it (and I have owned Nikon DSLRs from the D70 through D750, D800, and D850). I haven't had a chance to try my \"older\", non-Z lenses but I hope I won't find that I need replacements.","title":"Remarkable Camera"},{"authorName":"Chris J.","creationDate":"2023-11-15T02:02:05","text":"I've been waiting for a long time to make this purchase and finally had the opportunity to make the upgrade. It's amazing how the quality of shot improves. I love the feel and user friendliness. Game changer","title":"Game changer"},{"authorName":"Carmelo L.","creationDate":"2023-11-14T03:58:30","text":"Too soon to tell, but the pictures I have created have been awesome. Loving the camera","title":"New owner"},{"authorName":"McKeon R.","creationDate":"2023-10-04T08:37:01","text":"A  little too soon to tell, but in a recent photo gig touring the Grand Canyon I was blown away.","title":"Blown Away!"},{"authorName":"Marko K.","creationDate":"2023-10-01T00:39:35","text":"I love this camera. It has the right weight for taking videos. The quality of pictures and videos is excellent. It has all the features that I like and of course much more. I was able to use it without too much effort right out of the box but I am still discovering features that help improve the quality and make things easier. With this camera and also with Z5 I am able to take videos of quality that is for the first time completely satisfying. I mostly take videos in HD.","title":"Excellent camera!"}],"highlights":["24.5MP Full-Frame: Exceptional image quality.","Superb low-light performance with ISO up to 51200.","Fast, reliable autofocus for sharp, clear shots.","Record stunning 4K video at up to 30fps.","Versatile Nikon Z lens mount for sharp optics."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"freeBundleItems":{"items":[{"sku":"ILXSD2561667","isConfigurable":false,"title":"Lexar SILVER Series Professional 1667x UHS-II SDXC Memory","stockStatus":"In","productId":"ILXSLVR1667X","brand":"Lexar","mfgModel":"SILVER Professional 1667x","primaryImageName":"ILXSD2561667.JPG","primaryImageNameWebp":"lexar-silver-series-1667x-256gb_ilxsd2561667.webp","subStatusInfo":{"name":"In Stock"},"isAvailableForStorePickup":true,"isAvailableInStore":true,"quantityMinimum":1,"quantityMaximum":1},{"sku":"INKENEL15C","isConfigurable":false,"title":"Nikon EN-EL15c 7V 2280mAh Rechargeable Lithium-Ion
