ntContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"6\",\"financePrice\":\"117\",\"TotalPrice\":\"699.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>117</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 6&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"RUSSELL S.","creationDate":"2026-08-26T16:32:00","text":"Camera works as it should. Had an interesting issue with an aftermarket soft case for the camera. Pressure in several areas of the soft case would turn the camera to on. Not great for battery life. Solved by two icecream sticks placed inside the case so the stiff icecream sticks blocked pressure from turning on either of the camera's two switches. Sticks held inplace with double sided VHB tape. No more suprise dead batterys.","title":"5 stars for the SX740 HS"},{"authorName":"lo222","creationDate":"2026-06-28T20:00:00","text":"I bought this camera for an upcoming trip to Iceland, but I never received the camera. I work in-person, so I was not home when Fed Ex came to deliver the camera which required a signature. Fed Ex came 3 times all of which I was at work because they were weekdays around 12pm. I contacted Fed Ex to pick up the package on the day of the 3rd failed delivery attempt and they said the package had already been shipped back to Canon. There were no instructions left by Fed Ex on when the final delivery would be or how to schedule a pick up. I called Canon the next day to request they redeliver the camera and they said that the camera had been returned to the warehouse and could not  be redelivered to me because they were out of stock. I was not able to get the camera I paid for. I am getting a refund, but only because I called Canon. I would not have received a refund otherwise. I am extremely frustrated and disappointed with Canon's terrible customer service and am sad I will not have this camera for my trip. They should have made the delivery instructions much more clear when purchasing this camera from their website. I will never buy from Canon again. I want to warn other of this policy as well.","title":"Terrible Customer Service"},{"authorName":"Ches47","creationDate":"2026-06-27T20:00:00","text":"I bought this the other week and noticed that the lens looked a little off. I tried emailing or doing a live chat to see if it was cosmetic or something wrong with it but both of those were not options, so my only option was calling and there was no way of sending pictures so they recommended return or send it in for service. Since the camera is out of stock it's not able to be exchanged and would have to return without knowing when I could purchase a replacement. It also does not give me the option to submit pictures on here as well..","title":"Nice camera"},{"authorName":"LOVE","creationDate":"2026-04-08T20:00:00","text":"I love this and so happy I got it. I recommend to all.","title":"love this camera"},{"authorName":"FRANCISCO P.","creationDate":"2026-03-31T11:57:00","text":"Great Quality Camara And Image Quality. Easy To Carry Around. Battery Live Is Also Perfect.","title":"Great!"},{"authorName":"BRADLEY M.","creationDate":"2025-12-24T10:11:06","text":"Very pleased with this camera. Easy to use with lots of options to take great shots. Perfect for my needs as an artist who takes street photos.","title":"Very handy. Easy to use. Great pics."},{"authorName":"Catu","creationDate":"2025-10-03T20:00:00","text":"Best camera I could've bought, so compact yet has so many features takes the mode high-quality HD photos I've ever seen on a camera. HIGHLY recommend. If this one breaks I won't buy anything else but another one!","title":"BEST CAMERA THUS FAR"},{"authorName":"KIRA T.","creationDate":"2025-08-15T09:04:02","text":"Love my camera!! Easy to use and takes great pics for a point and shoot camera! Excited to take on my vacation to Greece.","title":"LOVEE"},{"authorName":"CHAIM I.","creationDate":"2025-07-29T22:46:04","text":"I am very happy with this product , It takes great pictures.\n\nI am also very happy with Adorama customer service. This is my third camera I purchased this year.","title":"Amazing product."},{"authorName":"CHAD F.","creationDate":"2025-07-17T21:39:20","text":"The Canon PowerShot SX740 HS Digital Camera is a fantastic little camera, especially for those looking for incredible performance in a compact package. Its standout feature is undoubtedly the powerful 40x optical zoom, allowing you to capture distant subjects with surprising clarity, complemented by effective optical image stabilization. The addition of 4K video recording and a tilting LCD screen for easy selfies or creative angles makes it a versatile companion for travel and everyday moments. It's a great choice for casual photographers who want impressive zoom capabilities without the bulk of a DSLR.","title":"Great little camera"},{"authorName":"ALIZBETH O.","creationDate":"2025-05-14T08:09:57","text":"In love with this camera and with Adorama customer service and attentive communication since it had been out of stock for a while. Definitely recommend them they are the best!!!","title":"In love with this camera and adorama"},{"authorName":"YAKOV M.","creationDate":"2025-04-24T08:28:43","text":"i highly recommend it the camera","title":"meyrowitz"},{"authorName":"nyeb2","creationDate":"2025-04-20T20:00:00","text":"it's never in stock or always out of stock the same day it restocks. Please work on that","title":"ALWAYS OUT OF STOCK"},{"authorName":"CHAVI R.","creationDate":"2025-04-14T21:35:42","text":"Great camera with excellent features. Connects to wifi which is wonderful","title":"Excellent camera"},{"authorName":"Chrissyc","creationDate":"2025-04-10T20:00:00","text":"Restock the item that people want. Apple doesn't have this issue with their technology devices, so I do not understand how this is a hard ask.","title":"Always out of stock."},{"authorName":"CAMILLE D.","creationDate":"2025-01-08T09:52:24","text":"Love the image quality and zoom capabilities of this compact. Also has awesome features for movie and web content.","title":"Packed with convenience and features!"},{"authorName":"Rick L.","creationDate":"2025-01-06T09:56:40","text":"I had the SX720HS before it broke and loved it, so I bought the SX740HS...It definitely does not take as good of photos as the SX720. Hard to focus and has blurrier photos overall. Bummed at the downgrade.","title":"Keep Your SC720HS"},{"authorName":"MARCELA C.","creationDate":"2024-12-17T08:09:59","text":"Loved it! Pictures are so dreamy. Would recommend for someone looking 2 take pictures.","title":"Dreamy"},{"authorName":"CAROL G.","creationDate":"2024-08-11T12:51:33","text":"For a little camera, it works great!  The zoom is amazing. I was in the 3rd tier at a baseball game and was able to zoom in on just the top half of the player, showing the bat and his torso and face only, and it was clear. Looking forward to playing a lot more with it!","title":"Great little camera with powerful zoom!"},{"authorName":"Emily M.","creationDate":"2024-07-27T20:00:00","text":"I absolutely love this camera for how advanced and clear the photos come out. It is such a good price and better than any other camera that may be around or over this price. 100% worth it.","title":"The best camera for the price"},{"authorName":"HYOUNG C.","creationDate":"2024-07-23T08:25:58","text":"Bought it for my daughter who is a photography enthusiast.  Absolutely loves it.  Will see if it is as durable as expected.  Quality of photos are good.","title":"So far so good"},{"authorName":"KATELYN H.","creationDate":"2024-07-18T08:07:31","text":"I absolutely love this camera. I was originally looking at the Canon G7X Mark II for a few specific reasons. I wanted a flip screen for selfies, flash, something light for travel, and of course takes good pictures. I picked this based on price and availability and I am so happy with my purchase. I have to play around with it more but even on auto the pictures are amazing.","title":"Perfect for travel & daily life"},{"authorName":"catlady4114","creationDate":"2024-07-11T20:00:00","text":"I replaced a PowerShot A550 with the SX510 HS. When the SX510 started giving me trouble, I considered getting a $1000 phone with a great camera or a decent pocket camera for half the price. I opted for the SX740 HS and feel the image quality is a step down from the older Canons. Everything looks like AI assisted digital zoom. Whether wide, zoomed or in between, there's no detail. Focus is soft. Edges have an AI smooth, vague crispness like older cell phones. It's also less intuitive to use. \n\nClose up focus is sllllooooowww. I missed tons of shots waiting for the camera to focus. If you stop the lens in increments before you get to maximum zoom, it's more likely to eventually focus. If you zoom to the subject rapidly, the lens toggles between close blur and wide blur before settling on wide blur. The zoom range is phenomenal, but optics are not. There's no detail. Bricks, grass, hair, etc, become graduated color blobs. \n\nPressing the shutter takes a bit more pressure than I'm accustomed to. It causes more shake than usual with slower shutter speeds. The first time I used it, I thought I was taking photos and video but hadn't pressed the shutter hard enough.\n\nFor the price, I expected better optics and user experience. I never expected this camera to be a replacement for my professional equipment, but I expected it to be as good as my older, defunct PowerShot pocket cameras. \n\nI was on the fence about sending it back so I re-shot a few scenes I'd done with my old powershots and took it on vacation, which is why I originally purchased it. The deal breaker wasn't the inferior sharpness, it was connectivity problems. Instead of simple transfer by cable, you have to pair the camera with your phone or computer every time you change networks. The camera disconnected frequently while I tried to transfer files. Restarting the camera helped the first few days of my vacation. By day 5, I couldn't get it to resume transfer of that day's photos no matter how many times i re-started. Transfer by cable isn't an option for this model and I didn't have a card reader with me. I thought is was just a network security problem that would be over once I got home, but it wasn't. I spent hours pairing, un-pairing, pairing again and looking for (non existent) information on how to transfer by cable. Eventually, I hooked up an old printer with a card reader and transferred the remaining files that way. \n\nIf sharpness and cable connectivity isn't important to you, you might like the camera. However, it's a big deal to me so I returned the camera and I'm back on the market, looking for something sharp, fast and small. that way.","title":"Underwhelmed"},{"authorName":"Catlady4114","creationDate":"2024-07-11T20:00:00","text":"I replaced a PowerShot A550 with the SX510 HS. When the SX510 started giving me trouble, I considered getting a $1000 phone with a great camera or a decent pocket camera for half the price. I opted for the SX740 HS and feel the image quality is a step down from the older Canons. Everything looks like AI assisted digital zoom. Whether wide, zoomed or in between, there's no detail. Focus is soft. Edges have an AI smooth, vague crispness like older cell phones. It's also less intuitive to use. \n\nClose up focus is sllllooooowww. I missed tons of shots waiting for the camera to focus. If you stop the lens in increments before you get to maximum zoom, it's more likely to eventually focus. If you zoom to the subject rapidly, the lens toggles between close blur and wide blur before settling on wide blur. The zoom range is phenomenal, but optics are not. There's no detail. Bricks, grass, hair, etc, become graduated color blobs. \n\nPressing the shutter takes a bit more pressure than I'm accustomed to. It causes more shake than usual with slower shutter speeds. The first time I used it, I thought I was taking photos and video but hadn't pressed the shutter hard enough.\n\nFor the price, I expected better optics and user experience. I never expected this camera to be a replacement for my professional equipment, but I expected it to be as good as my older, defunct PowerShot pocket cameras. \n\nI was on the fence about sending it back so I re-shot a few scenes I'd done with my old powershots and took it on vacation, which is why I originally purchased it. The deal breaker wasn't the inferior sharpness, it was connectivity problems. Instead of simple transfer by cable, you have to pair the camera with your phone or computer every time you change networks. The camera disconnected frequently while I tried to transfer files. Restarting the camera helped the first few days of my vacation. By day 5, I couldn't get it to resume transfer of that day's photos no matter how many times i re-started. Transfer by cable isn't an option for this model and I didn't have a card reader with me. I thought is was just a network security problem that would be over once I got home, but it wasn't. I spent hours pairing, un-pairing, pairing again and looking for (non existent) information on how to transfer by cable. Eventually, I hooked up an old printer with a card reader and transferred the remaining files that way. \n\nIf sharpness and cable connectivity isn't important to you, you might like the camera. However, it's a big deal to me so I returned the camera and I'm back on the market, looking for something sharp, fast and small.","title":"Underwhelmed"},{"authorName":"CHARLES S.","creationDate":"2024-06-06T16:36:35","text":"I have had three compact pocket cameras, the others being a Nikon Coolpix A300 and a Panasonic DC-ZS80. The Canon is definitely my favorite. I have purchased extra batteries batteries and a spare memory card in case of trouble. The Canon will be going with me on my upcoming trips to Italy and an Avalon Waterways river cruise on the Po River in Portugal. I think this camera will be with me for quite a while.","title":"This is a dandy compact camera"},{"authorName":"RACHEL G.","creationDate":"2024-05-10T06:36:56","text":"Love it! Takes the best photos and videos","title":"My best purchase this year"},{"authorName":"TONI A.","creationDate":"2024-05-03T16:59:23","text":"I am learning how to use it! Love the flip screen for selfies. I have a little time before I go on vacation!\nToni","title":"New camera"},{"authorName":"Sewjourner","creationDate":"2024-04-19T20:00:00","text":"I found the 740 quite an improvement over my 730.  I had over 1,000,000 pictures on the 730 and wanted to upgrade & update.  I was waiting for a newer version instead of one from 2018, but I'm really happpy with it.  I pretty much just leave it on auto, and haven't been disappointed yet.","title":"740 much improved over the 730"},{"authorName":"vsyazzie","creationDate":"2024-04-17T20:00:00","text":"Love the zoom capabilities,  fast accurate shots as long as your steady handed. Great at handling fast and medium burst shots.","title":"Great camera to handle all your picture perfect shots."},{"authorName":"YeeYeeAR","creationDate":"2024-04-03T20:00:00","text":"I adore this camera sooo much. Im so impressed with the quality and how easy it is to maneuver, would definitely say its a close dupe to the g7 mark ii. Would highly recommend if you're trying to achieve stunning photos (especially for my social media girlies) I recommend putting the setting on \"P\" changing the IOS to 400, -1,2 exposure and do the force flash on the side!!","title":"Swaggy Camera"}],"highlights":["Capture crisp 20.3MP image quality instantly.","Powerful optical zoom: Up to 40x available.","Compact digital camera fits your pocket.","Enjoy intuitive and easy-to-use controls.","Extended battery life for longer shoots."],"freeShipTypeName":"Free Shipping","isPrintiqueProduct":false,"variants":[{"sku":"ICASX740B","primaryImageName":"ICASX740B.JPG","primaryImageNameWebp":"canon-powershot-sx740-hs-black_icasx740b.webp","options":[{"name":"color","value":"Black","sequence":6,"valueSequence":10}],"websiteUrl":"https://www.adorama.com/canon-powershot-sx740-hs-digital-camera/p/icasx740b","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":699.95,"effectivePriceCode":5,"highPrice":699.95,"guestPrice":699.95,"trialPrice":49,"isSale":false,"isEdu":false},"isAvailableForStorePickup":false,"isAvailableInStore":false,"thumbnailImageName":"ICASX740B.JPG","thumbnailImageNameWebp":"canon-powershot-sx740-hs-black_icasx740b.webp"},{"sku":"ICASX740S","primaryImageName":"ICASX740S.JPG","primaryImageNameWebp":"canon-powershot-sx740-hs-silver_icasx740s.webp","options":[{"name":"color","value":"Silver","sequence":6,"valueSequence":20}],"websiteUrl":"https://www.adorama.com/canon-powershot-sx740-hs-digital-camera/p/icasx740s","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":699.95,"effectivePriceCode":5,"highPrice":699.95,"guestPrice":699.95,"trialPrice":49,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":false,"thumbnailImageName":"ICASX740S.JPG","thumbnailImageNameWebp":"canon-powershot-sx740-hs-silver_icasx740s.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllCompon ":"/g/used-quote","trackData":"listing page, ways to save, sell or trade","type":4},{"title":"Save up to $930.00 with bundle","link":"https://www.adorama.com/nikon-z5ii-mirrorless-camera/p/nkz5m2","trackData":"listing page, ways to save, bundle","type":3}],"variantSku":"NKZ5M2","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"142\",\"TotalPrice\":\"1696.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>142</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Matthew E.","creationDate":"2026-04-28T14:46:31","text":"I'm extremely impressed with the camera's autofocus and the speed of this camera. Photographers of all levels, whether you're a beginner or professional of 10 years, shouldn't hesitate to add this to your bag.","title":"Impressive body for all levels of enthusiast"},{"authorName":"Rayon C.","creationDate":"2026-04-21T09:23:04","text":"Absolutely love this camera. Great entry into the mirrorless world","title":"LOVE"},{"authorName":"Janet W.","creationDate":"2026-04-17T08:13:05","text":"I love this camera. Very fast, and light. Wish I hadn't waited so long to get it. Love love love","title":"Happy"},{"authorName":"Melissa M.","creationDate":"2026-01-11T07:38:32","text":"The Z5ii is amazing and with the 24-200mm makes the perfect travel camera. It is compact and light, but feature packed. I added a 105mm which also performs well with the Z5ii. I'm an enthusiast level photographer, but taking shots comparable to the professionals I hang out with.  Love this camera!","title":"Perfect Travel Camera"},{"authorName":"Darnell T.","creationDate":"2025-12-30T15:47:15","text":"On December 2nd, I visited Adorama to trade in my Nikon D7500. I also traded in my 200-500mm f/5.6, 35mm f/1.8, and 85mm f/1.8 all NIKKOR lenses. This marked the beginning of my journey into the world of mirrorless cameras, and I chose the Nikon Z5ii as my first choice. To enhance my bird photography skills, I also purchased the used NIKKOR Z 180-600mm f/5.6-6.3 VR lens. I also bought an extra battery. Both Angel and William were incredibly helpful and knowledgeable throughout the process. They provided valuable insights and assistance with my trade-ins and new purchases. This is a huge upgrade coming from the D7500. Speed and autofocus plus bird detection. I'm looking forward to using this during my trip to the bird festival in Laredo Texas in February.","title":"A great upgrade from the Nikon D7500"},{"authorName":"John S.","creationDate":"2025-07-17T03:18:47","text":"I really liked my Z5, it was a great way to wonder back into photography after a 40+ year hiatus. The Z5ii is a great upgrade, my main driver for the upgrade was to get better autofocus ability especially with wildlife. The Z5ii delivered solid AF performance as well as much better light performance. The old Z5 was great at landscape, the new Z5ii is great at landscape, wildlife/nature and even astro. I really like the way the dual thumb wheel controls work when selecting either i-menu functions or with the function buttons, this is really convenient and intuitive for me. I find overall the AF is so much better that I take one or two photos of a subject rather than 5 or 6 or 10 because I know the focus is right on the money and more \"only get one chance\" wildlife photos turn out great! I also find myself snickering a lot when taking pictures of dogs when they are  walking away from me with their tail up and eye detection is on.","title":"Great upgrade from Z5"},{"authorName":"THOMAS R.","creationDate":"2025-05-16T08:49:05","text":"High end features in an \"entry level\" camera.","title":"??????????"},{"authorName":"PAUL R.","creationDate":"2025-05-16T08:22:34","text":"So far the camera has been amazing. Purchased the 50mm 1.8S and it makes great shots.","title":"Awesome Full Frame"},{"authorName":"DONALD A.","creationDate":"2025-05-01T06:55:58","text":"I absolutely love this new Z5!  I am taking pictures at ISO 64,000 and they are coming out with very light noise - easy to fix in Lightroom!  I no longer have any need for f/2.8 or f/4 lenses.  f/5.6 is now the new fast lens!  And the auto focus settings give you several different areas for the continuous autofocus to work in.  And there are settings where the autofocus will find birds in flight and people's faces.  This camera is light years ahead of the original Z5.  My new favorite lens is the Nikon Z 28-400mm f/4-8.  With this camera and lens I can go just about anywhere and shoot just about anything.","title":"Wonderful low light camera"}],"highlights":["24.5MP Mirrorless Camera: Stunning image quality.","Full-Frame sensor excels in low light Nikon Z5II.","Fast, reliable autofocus: Capture every moment.","4K UHD video recording for pro-quality films.","Nikon Z mount offers extensive lens compatibility."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"NKZ5M2","primaryImageName":"NKZ5M2.JPG","primaryImageNameWebp":"nikon-z5ii-mirrorless-camera_nkz5m2.webp","options":[],"websiteUrl":"https://www.adorama.com/nikon-z5ii-mirrorless-camera/p/nkz5m2","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice" ta":"CAR5M2 page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"6536C002","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[{"title":"Sell or Trade your Gear","link":"/g/used-quote","trackData":"listing page, ways to save, sell or trade","type":4},{"title":"Buy for as low as $3,799.00 in Used","trackData":"listing page, ways to save, available in used","type":0}],"variantSku":"CAR5M2","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"334\",\"TotalPrice\":\"3999\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>334</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"J V.","creationDate":"2026-09-16T20:00:00","text":"Works great!! Major change from my old 6D. Bigger and different screen. Challenge finding all the settings but that is just a learning process. Love the touch screen. Have found no issues so far. Another challenge is getting this camera working properly with my collection of EF lenses. No problems so far.","title":"Love my R5 mk 2"},{"authorName":"JOYCE D.","creationDate":"2026-09-15T09:14:39","text":"I am a retired professional photographer and I chose the R5 Mark II for its smaller size and less weight than my previous DSLR. It has many other features to recommend it including the in-camera IS, advanced AF, touch screen and ability to send images to my iPhone. I am very happy with this purchase.","title":"Canon R5 II is the Perfect Downsize"},{"authorName":"WILLIAM C.","creationDate":"2026-09-10T08:14:51","text":"Everything needed for a pro setup. No complaints.","title":"Fantastic Camera"},{"authorName":"Brian C.","creationDate":"2026-09-08T07:52:18","text":"I was perfectly happy with my R5 Mk 1. or so i thought, lol. The R5 Mk 2 is everything i wanted to fix from the Mk 1. The fans for overheating are very helpful as I use the camera for portraits as well as indie film making. The small changes like a dedicated photo/ video switch and the right hand on/off switch just make the camera easier to work with in situations where i need to get the camera out fast and start shooting right away. The package deal was great value for the money. The extra battery is super helpful upon getting a new camera.","title":"The upgrade I didn't know I needed..."},{"authorName":"ROSALIE B.","creationDate":"2026-09-07T11:24:50","text":"Tech is tech, right? The new version should always out perform the last, and this one certainly does. I've shot Canon cameras since I transitioned from film with the 10D, 20D, and most recently 60D. I knew I wanted my next camera to be full frame for the dynamic range and low light capabilities, and this one really does not disappoint. I can't compare it to equivalent Nikon or Fuji cameras as it's been years since I've shot on any of those, but I can say that I'm happy with the output.","title":"Best camera I've ever purchased"},{"authorName":"Canoeman","creationDate":"2026-08-25T20:00:00","text":"I've only had the R5 two weeks so don't expect to know everything about it... and I own Canon products so expected the upgrade operating to be somewhat seamless on basic operation.  The lack of a starter manual was disappointing.  So, I called Canon for help, and here comes their strength, the tech answered all my questions and got me going.  In my opinion, the US based very competent techs is what sets Canon apart.  This phone service is why I choose another Canon.","title":"R5 Awesome, Instructions to get going not so awesome"},{"authorName":"Maine M.","creationDate":"2026-08-20T20:00:00","text":"I already owned an R5, which is a dream camera!  I needed to replace an old, malfunctioning 90D and I thought I was going to get another R5 but I decided to upscale with the R5 Mark II.  A weekend photo shoot recently produced remarkable images from both cameras.  I keep a telephoto lens on the R5 and a 24-105 mm lens on the R5 Mark II to avoid changing lenses in the field and getting dust on the sensors.  The new batteries that came with the Mark II are amazing and I'm now using them on both cameras since updating the firmware on the R5.  I do landscape, wildlife, and astrophotography.  It's with the astrophotography that these cameras shine brightest.  Using proper techniques, you get pin-point stars with the 45 megapixel lenses when zoomed-in, not little squares.  Love the R5 and the R5 Mark II!","title":"An Outstanding Camera!"},{"authorName":"Timoteo","creationDate":"2026-07-19T20:00:00","text":"I appreciate the updates to the R5 on the Mark II.  So far, eye tracking is quicker and more spot on than the R5.  I also like the configuration/placement of the function buttons.","title":"The Mark II is a step above for me"},{"authorName":"GrantA","creationDate":"2026-07-18T20:00:00","text":"I bought this camera after trading up from the canon 7D MkII. Wow what an upgrade. The 24-105L lens has been great. Not as good in low light as others but I knew what I was getting when I bought it. That is not a negative. Just get body only if wanting a lower f stop lens. But this kit has been great","title":"Exceptional Camera"},{"authorName":"Jesse L.","creationDate":"2026-07-16T09:20:03","text":"I've been shooting Canon for 20 years, with my \"love\" beginning with purchasing a 5D mk ii in 2009. I briefly went to another lover (Sony) and have few complaints with the equipment itself (great products). But, Canon was my first love. It seems appropriate that my favorite camera ever is now the spiritual successor to the 5D mk ii in the R5 mk ii. \n\nI like everything about this body. It feels right in my hands. The controls are where I want them to be. The menu is great, custom picture and other settings are fantastic, and my most favorite - autofocus is just wonderful. Obviously lenses play into many aspects of the camera's behavior. That's worth noting. But I'm super happy with this body.","title":"My First Love"},{"authorName":"Dr H.","creationDate":"2026-07-11T15:32:02","text":"Great camera, easy to use and lots of customization options. I am not a fan of the shutter sound, but I can shoot in silent mode with this fast sensor readout this camera has. \nA nice upgrade from my beloved R6ii.","title":"Absolutely wonderful"},{"authorName":"Zero s.","creationDate":"2026-07-09T03:30:01","text":"Very good product","title":"Very good product"},{"authorName":"Big W.","creationDate":"2026-06-25T20:00:00","text":"I bought this camera a few months ago.  It has turned out to be one of the best cameras, I love it.  Just an overall amazing camera for all types of photography ranging from sports to potraits.","title":"Got To Get One"},{"authorName":"Emily M.","creationDate":"2026-06-13T01:00:07","text":"I love this camera! The menu allows me to zoom out the display for my astigmatism, unlike the mid-tier Sony's. Great ergonomics and intuitive menu system with Canon. I also like that I can shoot CRAW to both cards. I wish Canon had more lens selection, but that's my only complaint.","title":"No regrets!"},{"authorName":"DAVID K.","creationDate":"2026-06-02T08:16:26","text":"The pictures are very clear, I am excited to continue to learn all the things I can do in camera which saves time when I get in to Light room or photoshop.\nI am have fun doing things with this camera.","title":"Canon R5 Mark ii"},{"authorName":"Russell C.","creationDate":"2026-05-23T08:28:55","text":"An absolute gem of a camera - maybe Canon's best 5-series sequel ever. It takes a little while to \"get to know it,\" especially the subtle (yet good) differences from the R5, but worth every penny. I took this on a month-long trip to Australia and New Zealand, and it performed beautifully and I captured images that will last a lifetime. \n\nA few things are wonky that I hope Canon fixes in subsequent updates, namely the camera reverting to Auto ISO. I've yet to scour the Internet for a fix, but I shouldn't have to at this price. \n\nIf you're in Canon's ecosystem and you're asking yourself if it's worth the upgrade, IT IS. I kept my R5 as a back-up, but I rarely use it now - that's how much I love the Mark II. And I love the R5, so that's saying something!\n\nTotally worth getting the battery grip of your choice and extra batteries, if you can swing it.","title":"Worth every penny - Canon's best 5-series ever!"},{"authorName":"Mengting W.","creationDate":"2026-05-19T08:23:12","text":"Really impressed with the R52 so far. The image quality looks great for both photos and casual video. Definitely a fun everyday camera","title":"Great compact camera for everyday use"},{"authorName":"Myer K.","creationDate":"2026-05-15T20:00:00","text":"A little disappointed in the amount of noise at slightly higher ISO. Aside from that satisfied.","title":"R5 Mark II"},{"authorName":"Sruthi B.","creationDate":"2026-05-14T20:04:02","text":"Very nice camera very useful for Event Videos and clicks","title":"Canon R5 Mark 2"},{"authorName":"Allen M.","creationDate":"2026-05-07T12:34:22","text":"cool camera","title":"cool"},{"authorName":"RICHARD F.","creationDate":"2026-04-15T01:59:47","text":"Love the camera and my order for Adorama was perfect. Shipping was very fast and the camera was perfect.","title":"5 stars across the board"},{"authorName":"kilo 2.","creationDate":"2026-04-12T20:00:00","text":"I purchased R5 mk 2 in February 2026 ..  Set up was as Easy as my R6 .. R6 mk 2 ..  if yoy are a Canon User with Any Real Experience , there is NO LEARNING CURVE with the R 5 mk 2 ..  any Questions on set up or New Features are Easily Explained on Numerous Youtube Videos ..   R 5 mk 2 is VASTLY SUPERIOR to the R 6 mk 2 ..  Focus is Slightly Quicker ,  Focus REMAINS LOCKED on Subject Far .. Far  Better than R6 mk 2 and the Eye Track Focus is MASSIVE  Improvement over ZONE FOCUS for Sports ..  Allows you to ISOLATE the Subject you want in a Crowded Field ..  Enclosed are JPEG shots from the 2026 Daytona 200 Motorcycle Race taken with RF 100 - 500 L ..  and  RF 200 - 800 ..  I can not Emphasize how Great a Camera this really is ..  For the Price ,  this is  FANTASTIC !   .....   You will Not Be Dissapointed ..","title":"Outstanding for Sports as well as Wildlife"},{"authorName":"JESSICA M.","creationDate":"2026-04-07T11:20:58","text":"Super excited to upgrade to this camera!  Very impressed with the picture quality.","title":"Love it!"},{"authorName":"Eric J.","creationDate":"2026-03-20T20:00:00","text":"It was not the first time I ordered directly from Canon but it was my first time purchasing a refurbished camera. I am extremely satisfied, all the accessories were present, the camera looked and functioned like a new one. I will buy again from Canon. Excellent service.","title":"Excellent experience"},{"authorName":"BikerDude1","creationDate":"2026-02-28T19:00:00","text":"I purchased the R5 MK II Camera in November of 2025 and this has been a nice upgrade from the R6 MK II, but enjoying both of them. Fast, Sharp, Accurate, and a joy to use.  I will keep this simple and just show you some basic photos that were shot with Canon L series lenses including the RF14-35 F4, RF24-105 F4, RF50 1.4, RF70-200 F4, and RF100-500 F4.5-7.1.","title":"R5 MK II Camera Review - Great Camera"},{"authorName":"NatureNerd","creationDate":"2026-01-27T19:00:00","text":"I am a Wildlife Photographer, focusing on birds and upgraded from the R6 M2 to the R5 M2. The speed, accurate auto focusing, pre-focusing ability and the Highlight tone Priority are a game changer! As I prefer to shoot in bright light, I am not overly concerned that this camera does not perform as well as the R6 M2 in low light. Overall, a good choice for me!","title":"Enjoying this camera!"},{"authorName":"Peter R.","creationDate":"2026-01-13T00:20:04","text":"I love this camera. The autofocus is fantastic. I love the pre-shot feature and the improved rolling shutter. They also fixed the overheating issues and the recording time limit that the R5 had. For sports or bird photography, all these improvements are a huge step forward. The big question is whether I should upgrade from the R5 to the R5 Mark II. My answer is: If you do sports and wildlife photography, YES. But if you do landscape or portrait photography, you can continue using the R5 without any problems.","title":"RecommendShould I upgrade from the R5 to the R5 Mark II?.."},{"authorName":"MAGDA H.","creationDate":"2025-12-21T07:16:43","text":"The Canon R5 Mark II is fast, confident, and enjoyable to shoot with, offering excellent frame speed that makes capturing action and fleeting moments feel effortless, along with outstanding image quality marked by rich detail, strong dynamic range, and clean, natural color straight out of the camera. Focus tracking is generally solid and dependable, particularly in good light, though it is not flawless and can occasionally hesitate or switch targets in complex scenes or with very fast, erratic subjects, benefiting from thoughtful settings and user input. Overall, the R5 Mark II feels polished and reliable, delivering consistently strong results while still rewarding an attentive photographer.","title":"Solid camera"},{"authorName":"Darren W.","creationDate":"2025-12-20T13:48:54","text":"Truly fantastic camera, magnificent in low light conditions and it is pretty much fully customizable.","title":"Highly recommend"},{"authorName":"oldjames","creationDate":"2025-12-17T19:00:00","text":"I have been using the 5D Mark IV for a long time and wanted to add the R5 Mark II to do wildlife. Some of the things that I like the R5 are: 1. The Auto Exposure Bracketing will take the three photos, in drive mode, with out having to use a timer; 2. The Focus Bracketing.  What I do not like is that if I have the Viewfinder only, the back screen will not come on when you press the menu button or the Playback button.IT only can be see in the viewfinder. That is coming from the 5D use that I am use to. But that is a personal issue and not the camera. all the photos are from the camera without editing.","title":"Old photographer review of the R5 Mark II"}],"highlights":["Capture stunning detail with 45MP resolution.","Exceptional low-light performance with advanced tech.","Experience fast, precise autofocus for sharp images.","Record cinematic 8K video with ease and clarity.","Explore versatile lens options with the Canon RF mount."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"freeBundleItems":{"items":[{"sku":"ILLCXEX128NG","isConfigurable":false,"title":"Lexar Gold Series Professional CFexpress 4.0 Type-B","stockStatus":"In","productId":"ILXCXEXP4","brand":"Lexar","mfgModel":"Gold CFexpress 4.0 Type-B","primaryImageName":"ILLCXEX128NG.JPG","primaryImageNameWebp":"lexar-gold-series-cfexpress-128gb_illcxex128ng.webp","subStatusInfo":{"name":"In Stock"},"isAvailableForStorePickup":true,"isAvailableInStore":true,"quantityMinimum":1,"quantityMaximum":1},{"sku":"COPROSCCB","isConfigurable":false,"title":"Capture One Pro, Camera Bundle Prepai 8 R WR Lens, Silver","mainImageName":"IFJXE5SK.JPG","mainImageNameWebp":"fujifilm-x-e5-mirrorless-silver_ifjxe5sk.webp","ratings":{"count":17,"averageRatingStars":5},"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Fujifilm X-E5 Mirrorless Camera with XF 23mm f/2.8 R WR Lens, Silver","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"IFJXE5SK page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"16949961","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[],"variantSku":"IFJXE5SK","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"159\",\"TotalPrice\":\"1899\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>159</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Irem T.","creationDate":"2026-09-26T06:09:32","text":"Nice camera","title":"Classic fuji"},{"authorName":"RONALD C.","creationDate":"2026-09-08T07:27:42","text":"Superb camera. My first range finder in 65 years of making photographs. This camera has opened up a new way of seeing and provided the tool to implement the new vision.","title":"New tool, new vision"},{"authorName":"VINAY U.","creationDate":"2026-08-16T05:09:03","text":"Wonderful camera and service from Adorama in helping me choose it. I've fell in love with photography all over again!","title":"Fell in love with photography all over again!"},{"authorName":"Man W.","creationDate":"2026-08-13T18:13:51","text":"Pros:\nThe form factor is great and the build quality is excellent. \nThe image quality from the camera is excellent. \nExtremely portable\n\nCons\nWhat I don't like is the slower autofocus compared to Canon/Nikon/Sony\nthe command wheel is to easy to adjust, needs more resistance\nThe paired 23mm F2.8 lens has an issue with this camera causing slow power on times\n\nOverall an excellent everyday carry camera compared to my R6.","title":"Fuji XE-5"},{"authorName":"AMANDA G.","creationDate":"2026-07-21T08:28:58","text":"Really love this camera. It's a lot of fun to shoot with. A lot of flexibility with filters / settings.","title":"Love it"},{"authorName":"JAMES K.","creationDate":"2026-07-15T09:06:00","text":"It's a great camera, small, light, inconspicuous, easy to use.  The 23mm (full frame 35mm equivalent) is perfect for the type of photography.  I have extensive experience with Fujifilm cameras and am coming back to the system after a break","title":"Great camera"},{"authorName":"NICK Z.","creationDate":"2026-05-29T04:25:59","text":"Excellent replacement for X-E4!  I found the 40mp higher resolution and IBIS are the two important features that made the upgrade more appealing.  There is a long list of new features that are described on Fuji's website, but these two are what are worth mentioning for me.\nThe only negative issue I have encountered is difficulty scrolling the rear command dial left or right without activating the secondary function.  Because the resistance to push the dial in for the secondary function is so light, scrolling the dial often triggers the secondary function.","title":"Is the Fuji X-E5 a worthwhile upgrade to X-E4?"},{"authorName":"Olga M.","creationDate":"2026-05-04T16:32:18","text":"South this camera as travel camera. Love it! It's so light and perfect to have for capturing every day moments.","title":"Amazing travel camera"},{"authorName":"MARK H.","creationDate":"2026-03-12T02:58:01","text":"This is a great camera to take on the go. I use the black and white film recipes more than I expected and the image quality is very impressive and I really like Fuji's colors.","title":"First Fuji"},{"authorName":"Brian M.","creationDate":"2026-01-27T04:40:41","text":"Gorgeous camera with all the image and build quality you've heard about, however, the lack of weather sealing and the LCD resolution prevent me from giving five stars, which I've given to all my other Fujifilm equipment. For this price, these features sould be included. Some marketing camera differiation deal on Fujifilm's part.","title":"A beauty of a camera"},{"authorName":"JOSE G.","creationDate":"2025-11-13T02:32:27","text":"Incredible camera, great colors, feels robust enough in the hand, has great opportunities to crop and create images the way you want with its as some 40 megapixel sensor.","title":"Great Camera"},{"authorName":"Orlando T.","creationDate":"2025-11-04T23:36:36","text":"Still learning as I just got it but wow, loving it already!","title":"Loving my new Fujifilm X-E5 camera"},{"authorName":"ARISTOTLE P.","creationDate":"2025-10-07T07:16:10","text":"Debated between this and x100vi. Feels and looks like a x100v that I had and sold because of the fixed lens. Mind you that I still have my xt5. I keep both because I need one for shooting with my bigger prime and zoom lens and another for compactness and use for travel. Cant chose one because different purposes. Camera image is exactly the same.","title":"Cant decide which to keep"},{"authorName":"JIM G.","creationDate":"2025-10-06T07:27:43","text":"I'll keep it simple. This is a reasonable alternative to the x100VI for those who need inter-changeable lens options. The added film simulation dial is an interesting addition. Other considerations: A tilt LCD screen like the x100VI, excellent video features (6.2K recording and F-Log/F-Log2), improved AF, and five-axis in-body image stabilization.  There are trade offs: no weather sealing, no dedicated video controls, and a meh EVF. And of course, it's not cheap. \n\nRecommended for anyone who requires more lens options than the X100 models and is willing to trade off a few of the X100VI features for lens interchangeability.","title":"Fujifilm X-E5"},{"authorName":"Bernabe T.","creationDate":"2025-09-19T08:23:05","text":"What a beauty of a camera! Haven't had the chance to test it much but happy with a visit to the botanic gardens.","title":"Beautiful camera!"},{"authorName":"MANUEL O.","creationDate":"2025-09-16T08:34:11","text":"I simply love this camera. I'm still getting to grips with some of the details that are different from the dials operation of my X-T5, but I've taken it out a couple of times now and it hasn't disappointed. It's everything I expected, the look and feel of the X100VI with the versatility of being able to change lenses. I don't miss the niceties you get with the X100VI, like the hybrid viewfinder, the built-in ND filters, or the leaf shutter. I don't even mind that it's not weather sealed, after all the X100VI isn't exactly weather sealed (you have to put a filter on the lens to make it fully weather sealed), and if I have to go out shooting in bad weather, I have my X-T5 or even my X-H2S. The included strap is fantastic; excellent length, comfortable, and very good quality. I'm still waiting for an L-bracket; it's something you're willing to pay for a little handling comfort. Overall, it has quickly become my favorite camera.","title":"My new favorite camera."},{"authorName":"Steven H.","creationDate":"2025-09-05T05:08:33","text":"The X-E5 is a pretty nice street camera.  I was hoping for a bit smaller and lighter, but it feels good in your hand and takes great photos.  My pet peeve is the large and worthless exposure compensation dial.  Hey Fuji, let us reassign it to something else.  An ISO wheel would be perfect.  If you want to make the experience like a Leica, you have to make all three components of the exposure triangle easy and accessible.","title":"Almost a great camera"}],"highlights":["Capture stunning detail with 40.2MP image quality.","XF 23mm lens excels in various shooting conditions.","Achieve sharp focus with advanced autofocus speed.","Shoot 6.2K video: high resolution, pro-level quality.","Excellent low light performance with ISO up to 51200."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXE5SK","primaryImageName":"IFJXE5SK.JPG","primaryImageNameWebp":"fujifilm-x-e5-mirrorless-silver_ifjxe5sk.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-e5-mirrorless-camera-xf-23-mm-f-2-8-lens/p/ifjxe5sk","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1899,"effectivePriceCode":5,"highPrice":1899.95,"guestPrice":1899,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":false,"thumbnailImageName":"IFJXE5SK.JPG","thumbnailImageNameWebp":"fujifilm-x-e5-mirrorless-silver_ifjxe5sk.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true},{"sku":"IFJXT30M3KCA","persuasionStrategies":null,"brand":"Fujifilm","prices":{"price":1259.89,"youSave":{"dollar":72.89,"percent":5},"highPrice":1332.78},"stock":"In","subStatus":{"name":"In Stock"},"categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/fujifilm-x-t30-iii-mirrorless-camera-13-33-mm-lens/ edToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"LEMMUEL D.","creationDate":"2026-09-14T08:36:06","text":"Good for a starting camera!","title":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Black"},{"authorName":"THANH T.","creationDate":"2026-06-19T08:59:59","text":"Came packaged well!","title":"Camera"},{"authorName":"Robert P.","creationDate":"2026-06-02T15:44:34","text":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtl\u00e4nder lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["26.1MP APS-C sensor for superior image quality.","Fast, accurate autofocus ensures sharp photography.","Compact mirrorless design, ideal for portability.","Record stunning 6.2K videos for cinematic detail.","Versatile 13-33mm lens compatibility included."],"freeShipTypeName":"Free Expedited Shipping","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"IFJXT30M3KCS","image":"IFJXT30M3KCS.JPG","imageWebp":"fujifilm-x-t30-iii-charcoal-silver_ifjxt30m3kcs.webp","desc":"Fujifilm X-T30 III Mi nancing-rate-dollars\"><span>$</span>88</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Sawyer","creationDate":"2026-09-04T20:00:00","text":"As a beginner I love it. Looks brand new!\nI paired it with the RF 100-400 and it's amazing and light for wildlife photography.","title":"Great deal! Love canon refurbished!"},{"authorName":"Such s.","creationDate":"2026-08-31T20:00:00","text":"The prices just jumped 100 bucks. I've been seating for like less than a week. I got my money in order and put 600 bucks into the card I'll be paying it on and now it's 700 bucks. Absurd.","title":"- they'll raise the price if you wait to buy"},{"authorName":"HANNAH L.","creationDate":"2026-08-03T22:13:20","text":"The body is really sleek and comfortable to hold in terms of size, weight, and grip.","title":"Pretty good!"},{"authorName":"JACK N.","creationDate":"2026-07-30T20:53:45","text":"my first mirrorless camera and very comfortable to hold and different experience.","title":"compact and nice"},{"authorName":"Hollie P.","creationDate":"2026-06-29T09:37:10","text":"It's okay camera have to learn how to work it cameras are expensive so I don't really honestly know how good","title":"Mirror less camera"},{"authorName":"Gerald L.","creationDate":"2026-06-20T20:00:00","text":"I didn't mind the crop factor on 4k on the M50, but I couldn't put up with the focus. The R50 fixed that. It also allowed me to move Canon's RF 600mm f11 lens. Very satisfied!","title":"Upgraded from M50 Mark 2"},{"authorName":"HOLLIE P.","creationDate":"2026-05-30T01:00:11","text":"I don't know much about camera I'm still learning I got it to take softball pictures and family photos.","title":"Mirrorless Camera"},{"authorName":"ETHAN L.","creationDate":"2026-05-20T10:00:34","text":"Camera kit and everything in the package came in perfect condition and I've been loving the camera ever since. Also shipped and delivered extremely fast!","title":"Very trusted, reliable, and fast"},{"authorName":"NANCY W.","creationDate":"2026-05-19T13:04:17","text":"Love my new mirrorless camera. It takes sharp pics and its fast as lightning.  My only concern is the body is much smaller than my old Canon and I keep hitting buttons I don't mean too - by accident.  I'm sure I'll get use to it the more I use it.  Love the lense adapter - a big asset when you can't afford to buy all new gear.  Great camera, good value ...","title":"Canon R50"},{"authorName":"Kavinda","creationDate":"2026-05-15T20:00:00","text":"The R50 arrived with multiple scuffs and scratches on the lens. The body itself was pretty good, no indications of ware. I was waiting 2 weeks for the camera to be back in-stock so that I can exchange it. Quite disappointed in the quality of the camera condition, since I did pay a lot for a camera to look and feel \"Refurbished\" rather than feeling used.","title":"Condition of the Refurbished Camera Was Disappointing"},{"authorName":"Robert P.","creationDate":"2026-04-19T20:00:00","text":"Nothing more than the title is necessary. A good beginners camera or a great one on a very limited budget.","title":"A good beginners camera or a great one on a very limited budget."},{"authorName":"jen m.","creationDate":"2026-03-15T08:58:58","text":"just tested out and so far i'm loving it with the lightness of it and the quality of photo. i can't wait to take more","title":"light for travel"},{"authorName":"JohnR07","creationDate":"2026-03-12T20:00:00","text":"I purchased this refurbished R50 about a month ago with the kit lens. Upon arrival, it came just as it should with everything that was included on the description. However, shortly after taking some pictures, I quickly noticed a very thin line stretching from the bottom of the picture to the top. After using different SD cards and doing a deep reset, I came to a conclusion... The sensor was broken. Yes, they sent me a camera that was defective. I was not happy about this at all after spending the money on it that I did. Fast forward a couple days later, I talked to Canon support on the phone and they told me there was no way I could exchange it because there were no more in stock. So, what they recommended is that I have it repaired. Shipped it off and they repaired it free of charge because of the warranty included.\nNeedless to say, be careful when buying refurbished products. Always check to make sure everything is working properly before waiting until it is too late (luckily I found out quickly)","title":"Great camera, but..."},{"authorName":"JAMIE A.","creationDate":"2026-03-04T02:41:42","text":"Still figuring got all out but I am liking  it","title":"Great camera for the money"},{"authorName":"Dataman","creationDate":"2026-03-01T19:00:00","text":"Mediocre camera. It's sluggish, not very responsive. Lack of command dials killed it for me. Canon refurbished sales system is good. Camera and accessories were in perfect condition.","title":"Mediocre"},{"authorName":"Maurice","creationDate":"2026-02-06T19:00:00","text":"Buying a refurbished R50 seemed like the best value to stick my toe into the world of mirrorless cameras. Lower priced than a new one, but still backed with a Canon warranty. Although I didn't really want the standard kit lens, it was cheaper to buy it that way than buy the body only. The R50 is a lot smaller than it appears in online photos. I was expecting a full size DSLR camera, and it's smaller than a Rebel. Good if you like to travel light and have small hands. With the Canon adapter, it works great with my old lenses, which makes the transition to mirrorless less painful. The R50 has allowed me to play with mirrorless in a cost effective way. Opinions seem in favor of mirrorless, but personally, I'll stick with conventional DSLR for as long as I can. I just don't care for electronic viewfinders.","title":"Good camera to dip your toe in the mirrorless world"},{"authorName":"Jacob E.","creationDate":"2026-01-29T14:46:20","text":"Like others have said, this is a great beginner camera & lens kit. I bought this kit a little over a year ago to try out learning \"real\" photography and take pictures of birds in my backyard and when I go on hikes. Overall I like the camera - Canon's menus are fairly intuitive and, while I wish there were more physical buttons, it feels like there's just enough camera here to get the job done without getting in your way too much. It's able to shoot fast enough to capture birds in flight, and the mobile app to transfer pics to your phone is capable enough, at least. I've included a few examples of pictures I've taken with this kit.\n\nKnowing what I know now, I might have instead invested a little more and just purchased the base camera with the RF 100-400mm lens (which can be used with RF 1.4x and 2.0x down the road) and maybe the RF 50 mm to cover the rest. That being said, the lenses included do plenty for the price, and the fact that they both come with image stabilization for such a low price is pretty great. \n\nCheers.","title":"Great beginner kit for birding"},{"authorName":"RITA C.","creationDate":"2026-01-20T07:46:37","text":"Great camera. Easy to use","title":"Good for ametuers"},{"authorName":"Orlando P.","creationDate":"2026-01-01T19:00:00","text":"Great camera it's compact, user friendly & light weight.","title":"Love the camera ??"},{"authorName":"DeaconDad78","creationDate":"2025-12-26T19:00:00","text":"Item arrived well packed and protected. Came with everything imaged and as stated. The camera set up well, registered / connected, and worked well after charging battery overnight and installing. Took photos well with minimal setup, and as this was a gift, the person gifted the camera enjoyed it and said it worked great!","title":"Great working camera, like new!"},{"authorName":"Shenny L.","creationDate":"2025-12-16T19:00:00","text":"The condition is excellent, feels like new! My first camera","title":"Absolutely great product"},{"authorName":"Skumsainar","creationDate":"2025-12-03T19:00:00","text":"I would not use this site. I bought a camera and then dropped the price. When I called they would not price match as it was not in stock. Poor service.","title":"Beware"},{"authorName":"Looshky","creationDate":"2025-12-02T19:00:00","text":"Looks and performs perfectly. I am glad, as I am new to photography, that I was able to save a bit with a refurbished camera.","title":"Refurbished is good as new"},{"authorName":"eyespy223","creationDate":"2025-11-24T19:00:00","text":"i just purchased last week, what an exceptional camera","title":"great camera"},{"authorName":"Zyggie","creationDate":"2025-11-18T19:00:00","text":"I love it.  It is light weight and takes outstanding pictures.","title":"Great Pictures and Easy to Use"},{"authorName":"ROBERT F.","creationDate":"2025-11-07T09:45:34","text":"The Adorama Canon EOS R50 2 lens camera package was the most complete camera package for the same price found on multiple websites.  I highly recommend this Adorama R50 camera package. This was a birthday gift for my daughter who is becoming an advanced amateur photographer.  Her main use if for sports at her high school and local travel clubs.  This package provided my daughter a lightweight camera that she can learn still photography.  I recommend this camera package from Adorama.  I ordered the camera on a Thursday and received the camera at no shipping cost by Sat. morning.","title":"Awesome Adorama Canon R50 2-lens Camera Kit!"},{"authorName":"BuyerPF","creationDate":"2025-11-06T19:00:00","text":"Overheats after just a small amount of video recording","title":"Not for video use"},{"authorName":"Dad 6.","creationDate":"2025-11-02T19:00:00","text":"After reading up on entry level models the r50 stood out for a number of reasons. It's allot of camera for the money and did not disappoint. The packaging/presentation is that of a new unit so it served well as my sons 18th birthday present-\nHe's been enjoying it and says the shots are \"crispy\" ?? \nShipping was completed quickly and without hiccup. It was refreshing to be reminded what a quality brand is like to do business with, well done Canon.","title":"Crispy pics"},{"authorName":"Randy_shep","creationDate":"2025-10-16T20:00:00","text":"Last camera I used was film. The r50 was complicated but canon manuals helped a lot. I'm shooting regularly","title":"Film to r50"},{"authorName":"Garen","creationDate":"2025-10-15T20:00:00","text":"It has a pop-up flash, fully articulating back and is small size. It is a good camera for casual shooting and a travel companion. Canon's does not offer any prime RFS lenses. The zooms are limited also. I like 1.4 to 1.8 lens for interior shooting and a macro for flowers/stamps/coins.","title":"A Good Travel Camera"}],"highlights":["Capture stunning detail with 24.2 megapixel.","Dual Pixel CMOS AF ensures fast, precise focus.","Enjoy versatile shooting with included 18-45mm lens.","Record high-quality 4K video at up to 30 frames.","Excellent low light performance with ISO up to 51200."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"CAR50K2","image":"CAR50K2.jpg","imageWebp":"canon-eos-r50-mirrorless-camera-black_car50k2.webp","desc":"Canon EOS R50 Camera with 18-45mm f/4.5-6.3 & 55-210mm f/5-7.1 Lens, Black","isConfigurable":false,"productId":"CAR50K2"},{"sku":"IDS032GN3IN","image":"IDS032GN3IN.JPG","imageWebp":"sandisk-ultra-32gb-uhs-i-sdhc_ids032gn3in.webp","desc":"SanDisk Ultra 32GB UHS-I SDHC Memory Card","isConfigurable":false,"productId":"IDS032GN3IN"},{"sku":"SLALPINE160","image":"SLALPINE160.JPG","imageWebp":"slinger-alpine-160-shoulder-bag_slalpine160 ra","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"NKZ6M3 page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"1890","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[{"title":"Sell or Trade your Gear","link":"/g/used-quote","trackData":"listing page, ways to save, sell or trade","type":4},{"title":"Save up to $880.00 with bundle","link":"https://www.adorama.com/nikon-z6iii-mirrorless-camera/p/nkz6m3","trackData":"listing page, ways to save, bundle","type":3}],"variantSku":"NKZ6M3","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"184\",\"TotalPrice\":\"2196.95\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>184</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Christopher D.","creationDate":"2026-09-29T22:17:54","text":"The best camera I have owned by far. I love Nikon and this is the top of my budget. I love the bright EVF, ergonomics, and great image quality.","title":"Best camera in its budget"},{"authorName":"Irem T.","creationDate":"2026-09-26T06:11:22","text":"Nice combo for wild life","title":"Birds"},{"authorName":"YVONNE V.","creationDate":"2026-09-23T09:34:02","text":"Perfect size & nice & soft","title":"Perfect size"},{"authorName":"HUGO O.","creationDate":"2026-09-03T09:00:36","text":"Great AF, if you know what you are doing and no need for ultra high speed accuracy, it is perfectly fine","title":"Excellent hybrid camera"},{"authorName":"Richard A.","creationDate":"2026-08-06T08:59:59","text":"Camera is great if not hard to get used from my DSLR The bundle is OK. The cable is way short, I don't have a laptop so I can not use it to connect to my PC, The extra battery is slow to charge and seems to discharge rather quickly. After only shooting a handful of shots and trying setup the camera for modes that I wanted the battery was almost dead. Took a couple hours to recharge. The other battery, the original one, seems to hold up well. Have not used the microphone yet but feel it will be acquit for any video I do, I do mostly landscapes and animals.All in all this bundle gave me the items I need in one place.","title":"Great camera, average bundle"},{"authorName":"Rajesh Y.","creationDate":"2026-08-02T22:03:39","text":"I Love this camera, I am not a Professional Photographer, I am Intermediate Photographer. But I learnt new things, how to use more professional techniques.","title":"Great Camera to learn for Beginners."},{"authorName":"METHA R.","creationDate":"2026-07-27T11:37:20","text":"After being a longtime viewer and fan of their YouTube content, I finally took the plunge to trust them in buying an expensive gear from Adorama when I decided to upgrade my aging DSLR to a brand new Nikon Z6iii. \nI timed my purchase during the sale window. In fact, the sale on Adorama lasted a few days longer than the competitors.\nExtremely satisfied with the whole process from browsing, to delivery at my doorstep. The system did flag me for the right reasons as I was shopping out of a different state while I was on a tour. However, their fraud verification team was so efficient and quick to validate my authenticity and release the product for shipment in a jiffy. \nThe product arrived right in time, at my doorstep and I was able to execute my plan that was tightly scheduled. \nWithout any second thoughts, I would refer Adorama to my family and friends and I'd continue to trust them for all my photo/video equipment needs. Impressed.","title":"Adorama all the way!!!"},{"authorName":"Zero s.","creationDate":"2026-07-13T01:32:36","text":"exelent product","title":"exelent"},{"authorName":"Todd W.","creationDate":"2026-07-11T06:49:25","text":"Great camera and fast shipping","title":"Z6III"},{"authorName":"WILLIAM H.","creationDate":"2026-07-03T07:00:13","text":"Very rapid response and delivery.  I will definitely be staying with Adorama.","title":"Great response and delivery."},{"authorName":"JASON M.","creationDate":"2026-06-19T08:10:12","text":"I've shoot many brands in my 20 years of event work but I always come back to Nikon. \nThis is a perfect event camera, in my opinion.  Great files, comfortable to carry all day and the specs are more than the vast majority will ever need, including me.","title":"Perfect Event Camera"},{"authorName":"LINDA B.","creationDate":"2026-06-16T18:05:08","text":"Extremely satisfied with Adorama, the products received and the customer service.","title":"Extremely Satisfied"},{"authorName":"MATTHEW S.","creationDate":"2026-06-12T08:19:29","text":"Going from a Sony a6600 to Nikon was a real struggle. However I can say this is hands down the best camera I have ever owned. Pair it with the Tamron 24-75 lens and the image quality is unmatched. Additionally, the number of real resources by professionals, Nikon, and amateurs related to this camera specifically is unmatched. Great lens selection-not as many as Sony- but no where near limited like some people would lead you to believe.","title":"Amazing Camera"},{"authorName":"MICHELLE V.","creationDate":"2026-06-10T08:48:55","text":"Major upgrade from my D7100! I cannot begin to describe how much of a difference the Z6iii makes in photo quality. It's as if I've been living without glasses my entire life, and just had a major prescription overhaul.","title":"Major Upgrade"},{"authorName":"DANIUS C.","creationDate":"2026-06-09T09:26:45","text":"Absolutely brilliant camera. Especially for video. Great bang for the buck and versatile for photo and video.","title":"The best versatile camera on the market"},{"authorName":"LINDA G.","creationDate":"2026-05-26T14:12:37","text":"I really like how the camera feels in my hands. It is light enough to not cause me any neck problems. And I've always loved Nikon Cameras!","title":"My best camera ever!"},{"authorName":"DONNIE P.","creationDate":"2026-05-13T07:27:20","text":"I love my new Nikon Z6iii. I've had it long enough to see how amazing the quality is.  Adorama was extremely helpful and professional.  Fast delivery!","title":"Fast professional delivery!!"},{"authorName":"Seth N.","creationDate":"2026-04-30T10:22:37","text":"Very satisfied. I shot primarily Sony for my personal work before but looking at the features per dollar, this camera won out. \nSome features could use some working on, for example FTP UI is frustrating in that it does not show a specific error for not working. I also miss being able to use peaking with autofocus like I would on my Sony cameras.","title":"Good camera."},{"authorName":"Diana S.","creationDate":"2026-04-26T03:11:57","text":"I had the Nikon Z6 and decided to upgrade to the Z6iii. This camera is a great improvement auto tracking is much better!","title":"Great upgrade from Z6"},{"authorName":"STEVEN P.","creationDate":"2026-04-15T08:17:15","text":"I am loving my new Z6iii.  It has satified all my likes and requirements in a camera.","title":"Nikon Z6iii is a BEAST"},{"authorName":"ROSS P.","creationDate":"2026-03-31T17:39:11","text":"Very fast new 3D focusing system. I have zero missed shots during a dance play.","title":"Fast and reliable 3D focusing system"},{"authorName":"MARC K.","creationDate":"2026-03-18T14:42:22","text":"All seems excellent so far.  Nice little bundle with the camera.  I upgraded from a DSLR and the focus seems fast and accurate.   It will take me a bit to learn the nuances of the autofocus system but I am glad I held out until this update to the Z6.","title":"So far So good"},{"authorName":"KRYSTINE P.","creationDate":"2026-01-22T06:00:53","text":"Adorama service is outstanding, for the same price at the nikon store, in adorama I got like 4 free gifts. a DSL card, a flash, an extra battery and a capture one 1 year subscription. I descovered Adorama and now I can not change it.","title":"Awesome Adorama Service"},{"authorName":"ROSS P.","creationDate":"2026-01-05T18:30:11","text":"Very fast autofocus using 3D tracking at a night event.","title":"Fast and reliable 3D tracking."},{"authorName":"ALEJANDRO R.","creationDate":"2025-12-16T01:50:37","text":"Upgrade from a Z5 to the Z6iii and it was worth it. Great camara for the value. Accurate and fast. Not a fan of the flip screen but you get use to it.","title":"Nikon z6 iii"},{"authorName":"BETH M.","creationDate":"2025-11-28T04:35:11","text":"This is a learning curve for me coming from a D800. So far I like it but I'm still finding my way around the camera and menus. Sometimes I go back to the 800 just because I'm familiar and know what it can do. I gave it 4 stars only because I'm missing the larger files - I wish it shot bigger files like the z7ii. I might change my mind with more experience.","title":"Nikon z6iii"},{"authorName":"Jatinkumar P.","creationDate":"2025-11-14T15:10:57","text":"Bundle is great but the supported Greenworks battery is not recognized by Z6III camera.","title":"Great Camera"},{"authorName":"Jatinkumar P.","creationDate":"2025-11-14T15:10:10","text":"Great camera and no issue so far but I don't link when Auto mode goes to shutter speed to 1/30 or 1/60 of seconds along with flash..","title":"Great Camera"},{"authorName":"Seth N.","creationDate":"2025-11-13T20:56:44","text":"Solid camera, good hybrid. Only wish some of the menus would make settings more obvious.  Also, it is heavy, but feature full, so it makes sense.","title":"Solid"},{"authorName":"KARMA S.","creationDate":"2025-11-09T13:29:05","text":"Recently updated from by Z 6II and couldn't be happier. So much easier to capture sports with the Z 6 III","title":"Happy with upgrade to Z 6III"}],"highlights":["24.5MP Full-Frame: Capture stunning image quality.","Exceptional low-light performance with Nikon cameras.","Fast, precise autofocus system for sharp photos.","Record cinematic 6K video with ease and clarity.","Versatile lens options for every photography style."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"NKZ6M3","primaryImageName":"NKZ6M3.JPG","primaryImageNameWebp":"nikon-z6iii-mirrorless-camera_nkz6m3.webp","options":[],"websiteUrl":"https://www.adorama.com/nikon-z6iii-mirrorless-camera/p/nkz6m3","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":2196.95,"effectivePriceCode":22,"highPrice":2696.95,"guestPrice":2196.95,"trialPrice":140,"isSale":true,"isEdu":false,"youSave":{"dollar":500,"percent":19}},"isAvailableForStorePickup":true,"isAvailableInStore":true,"thumbnailImageName":"NKZ6M3.JPG","thumbnailImageNameWebp":"nikon-z6iii-mirrorless-camera_nkz6m3.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":140,"rebateSavings":880},{"sku":"ISOA7M4K1A","persuasionStrategies":null,"brand":"Sony","prices":{"price":2198,"youSave":{"dollar":500,"percent":19},"highPrice":2698},"stock":"In","subStatus":{"name":"In Stock"},"badgeT
