an>192</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Deborah M.","creationDate":"2026-09-10T13:04:11","text":"I just purchased this camera the day it came out to take with me on an Alaskan trip.  I had regretted not having a telephoto on safari in South Africa earlier this year.  I will start off by saying that having only an online manual that is 577 pages long is unbelievable.  There is just so much to learn about this camera I had to start by just setting it for automatic, basically point and shoot while on this trip.  I definitely used the zoom and the focus lock while on this trip.  I used it on two days, Glacier Bay day to get closer pictures of the glaciers and wildlife and the following day on a bear excursion.  Because I wasn't sure about how the camera was doing, I was also taking shots with my iPhone 17 Pro Max.  \n\nHonestly, I am disappointed with this camera.  Head to head on regular landscape shots the iPhone beats it hands down.  Obviously I was able to get a little closer on wildlife but it didn't impress me that much.  I imported all the shots to my iPhone and then used the iPhone camera app to edit the photos.  I had to add sharpness and definition to most photos, and had to adjust the exposure and black point to even get the shots close to what the iPhone did without adjustment.  \n\nI'm not giving up, as this is a lot of camera and maybe as I learn more about it I'll get better shots.  However for now, unless I think I'm going to need a telephoto, my iPhone is my travel pick as this is a heavy camera.","title":"Not thrilled"},{"authorName":"FRANK C.","creationDate":"2026-09-09T11:03:34","text":"Beautiful device, very well made, high quality product.  Steep learning curve if one is not familiar with Sony cameras.   Thankfully tutorials online and in paperback books are now available.","title":"Sony RX10V Camera; Will Be Fun To Travel With"},{"authorName":"Stonk","creationDate":"2026-09-08T20:00:00","text":"I've had the RX10 4. For a number of years, the 5 such an upgrade to the previous model. \nI'm still finding out how to use it but enjoying every minute. \nWell worth the price for excellent camera.","title":"Great Camera."},{"authorName":"So T.","creationDate":"2026-09-05T20:00:00","text":"Really excellant product, I am really pleased I bought it , even though ithat I very much t was unauthorised!\nThe only thing I could really pass comment on is that being a learner, you could have could a couple of pounds on the initial product, to include a handbook or even recommend one. \nAs I am really struggling!!","title":""},{"authorName":"Paulv61","creationDate":"2026-09-03T20:00:00","text":"Replaced all\nMy DSLR gear with this and couldn't be happier . Zoom is amazing.","title":"Next Level"},{"authorName":"Daz 1.","creationDate":"2026-08-31T20:00:00","text":"Only had this a few weeks and it does not fail to impress. The autofocus is unbelievably fast and accurate. The burst mode is simply astounding. The quality of the build is what you'd expect from such a premium camera. \nThe sensor is old and the lens unchanged but it does a stunning job for an all in one package. \nIt truly is the best of all worlds. No more carting my 600mm lens around when I'm travelling. This is more than up to the job.","title":"Simply fantastic."},{"authorName":"Thread b.","creationDate":"2026-08-30T20:00:00","text":"A great camera it will take me a while to fin out all the features, a pity that it doesn't come with a printed instruction manual","title":"A great camera"},{"authorName":"Jazz2","creationDate":"2026-08-30T20:00:00","text":"I bought this camera two weeks ago and generally like the camera but I am disappointed that it does not have inbuilt panorama mode or HDR mode. Having read reviews praising the camera and that it was an all in one camera I must have missed that it did not have have these features. It does however focus very well on subjects such as birds.","title":"I wish the camera included panorama and HDR in c"},{"authorName":"Hairybeast","creationDate":"2026-08-29T20:00:00","text":"Looking for a very light, easy to use camera with a great zoom, excellent sharpness, then you have found the right one when you have come to the Sony RX10V5. Thought I would never get one to match my A911 fitted with my 200-600mm lens, however I have and there is no changing lenses when needing to reduce or adding a 1.4 extender as you can increase the zoom to 1200mm. The body is a great size, easy to hold and no need for a big carry case to take camera and lenses. It is all my other cameras and lenses in one unit. The photographs attached have not been as they say processed, I shoot in JPEG, might sharpen, lighten or darken a bit and that is it.","title":"Just what I wanted"},{"authorName":"Bromptonboy","creationDate":"2026-08-28T20:00:00","text":"I have had the camera for just a couple of weeks but so far I am liking it very much. It is very easy to use (I haven't explored the advanced features yet). I have taken photos of birds in flight and boats while sailing myself! Fast, clear, well focussed images.","title":"Easy to get good images"},{"authorName":"EDWIN S.","creationDate":"2026-08-27T08:45:41","text":"Love the powerful lense. Take a while to figure out how to get the sharpest images.","title":"RX 10 V"},{"authorName":"RobCan","creationDate":"2026-08-26T20:00:00","text":"The new capabilities of this camera have brought it up to date. Autofocus features that can now differentiate between multiple subjects is a real bonus. Controls get a bit of getting used to. As far as I am concerned the degradation of the RX10M4 HFR facility is rather disappointing. On the RX10M5 10x slower, as a maximum, is very disappointing. In fact, if using PAL rather than NTSC, it is only 8x slower. Not much good when trying to get slow-mo video of things like Bees or even motorsport. I am struggling to find a use for Quick video.\nGeneral handling and feel is very good. In the main it delivers well. I am not a great user of flash, but now having to purchase a flash device for those odd occasions when it is needed is yet another negative. Perhaps a very basic flash unit could have been supplied with the camera.","title":"Long awaited upgrade BUT..."},{"authorName":"mixed b.","creationDate":"2026-08-26T20:00:00","text":"The camera is great by the software/firmware is a nightmare","title":"mixed bag"},{"authorName":"carpetdriver61","creationDate":"2026-08-24T20:00:00","text":"got my camera 1 week ago and they can't even be bothered to supply a usb cable or a prpoer manual. spoke to a representative in egypt who said she would send me an email with all details on it and i am still waiting for a week. this is attrocious behavior from a so called top tech company. \"\u00a32199 for sweet naff all on how to use the equiptment and not even a cable to charge the battewry with..disgusted..","title":"disgusted"},{"authorName":"ADS23","creationDate":"2026-08-24T20:00:00","text":"My first camera for some time so bit of a learning curve. Some help on this front would have been helpful. Only out few time to try out but very happy with the product. \nSome things you could improve on. No charger?? A get starters guide. \nIt is a camera I use more because my DSLR kit was weighty. Comfortable feel, shoots well and happy with images.","title":"New Beginnings"},{"authorName":"58Chris","creationDate":"2026-08-21T20:00:00","text":"As a long time user of the RX10iv which has accompanied me across the globe, obviously I was going to move to the Mark 5 but must admit so many things have changed I'm finding it hard to comprehend all the settings. I'm sure everything in the end will be just fine, but for now after fifty years of photography as a keen amateur..I feel like a novice.","title":"I'm sure it will be great, but for now...."},{"authorName":"Jer923","creationDate":"2026-08-21T20:00:00","text":"I've had a few Sony cameras over the years ? this seems the best yet. I don't want to lug lenses and swap them. A pocket point and shoot even with great little zoom ? seems to me to not do that much more than a modern phone. The auto focus has come on so significantly since I last had a camera. Sometimes the speed is beyond reason! Anyway ergonomics are great. Does everything from wildlife to grandchildren. Wonderful. Lack of flash doesn't bother me. Got a great one for \u00a3100 (5%) of camera price that will do more than a little build in one would.","title":"Does everything well and nothing badly"},{"authorName":"RichieCat","creationDate":"2026-08-21T20:00:00","text":"My first ever DSLR was Sony Alpha100 and although I love taking photos I moved away from carrying around 2 tonnes of bodies and lens a few yrs ago, relying day to day on the inevitable mobile phone. With an upcoming Safari holiday I quickly decided I couldn't risk capturing the trip of a lifetime on a phone and began researching cameras again. Time after time the Sony RX10 IV kept appearing in Top10 reviews and after deciding that would be perfect then stars aligned and I found out the MkV was available to pre-order. \n\nIn all honesty I haven't used it in earnest yet but the ergonomics are great, the UI and menu system seems easy to navigate and the detail it can resolve in a couple of test shots is amazing...plus I haven't found one negative review anywhere so I'm quietly confident.","title":"Now I feel Safari ready!"},{"authorName":"Madmagpie","creationDate":"2026-08-21T20:00:00","text":"I bought this to replace the Mark IV bought in 2018 and which had served me so well. The Mark V keeps this bridge camera, universally accepted as the best bridge in the world, at the top of the tree.","title":"Still the very best"},{"authorName":"HARRY M.","creationDate":"2026-08-20T10:46:52","text":"I'm into nature photography and used the RX10 IV (purchased from Adorama) for over six years. I loved it. The one-inch sensor and Zeis 24-600mm lens produced excellent quality shots. I've only used the V for a short time, but I think it will be even better. I especially like the subject recognition feature.","title":"Sony RX10 V even better than the IV"},{"authorName":"MICHAEL S.","creationDate":"2026-08-20T05:38:28","text":"Absolutely love this camera.  I have taken close ups that are wonderful and the 600mm end is marvelous to catch birds.  Easy to set up and use.  Sure makes my backpack tons lighter now that I don't haul all those lenses and accessories.","title":"Superb camera for travel and wildlife photography"},{"authorName":"Moor I.","creationDate":"2026-08-16T20:00:00","text":"A week into owning the Mk5 after six years of the MK4. Was it worth it? Definitely. \nIs the camera more usable? Yes. \nIt's the touch screen better? Unrecognisable. (Disappointed it doesn't have full articulation) \nThings I love: the joystick for focus point, the touch screen menu's, the autofocus (mind blowing), the customisation buttons, the slightly bigger grip, the dials on the top right. \nThings I don't love: the lack of articulation on the screen, the creator app needs another level of sophistication to be really top drawer. \nPleased I spent the money? Yes very much so.","title":"Well worth the upgrade"},{"authorName":"Robert G.","creationDate":"2026-08-09T20:00:00","text":"I have been a very happy user of RX10iv for several years, and when I learned that there will be a Mark 5 (accidentally on the day the RX10v was launched) I have preordered without hesitation. It arrived a week or so later and I still cannot be believe how good the Mark 5 is. For me three best things about it are:\n* ability to focus while zooming in and out\n* fast and reliable, AI-enabled auto-focus\n* hugely improved ergonomics and extensive customisation features\nI will definitely continue to impress (and annoy at the same time) all those interchangeable-lens camera users lugging around they ridiculously expensive and heavy kits!","title":"Ultimate bridge camera"},{"authorName":"Fotofixr","creationDate":"2026-08-08T20:00:00","text":"I have absolutely loved the Sony a 6700, but when I travel, this will be my go to one lens does everything very well camera set up. Thank you Sony for bringing the RX 10 back to your line. Although I've been a professional photographer for many years with back in the film era, I am perfectly comfortable with this all in one system. look forward to the possible release of the RX 100 in the future.","title":"Excellent one camera carry"},{"authorName":"Andy 6.","creationDate":"2026-08-04T20:00:00","text":"Purchased nearly three weeks ago as my first Sony camera, I am still familiarising myself with the button layout and menu settings. The camera itself boasts excellent build quality and a solid feel in hand. The zoom range is outstanding across all focal lengths, consistently producing sharp, detailed images with impressive color accuracy.","title":"Sony RX10 V"},{"authorName":"Ben h.","creationDate":"2026-08-01T20:00:00","text":"Disappointed when you discontinued the rx10iv but am very happy with my new rx10v","title":"All round good performing camera"},{"authorName":"Panda2026","creationDate":"2026-08-01T20:00:00","text":"As an amateur videographer I absolutely love the RX 10 series and was wondering what I was going to do when my old RX10 IV finally gave up so was thrilled when the V was announced recently and ordered one immediately. My only complaint about the new RX 10V is that it no longer features pre-capture which I used so much on the IV. It also gets hot very quickly but that could be something to do with the weather that we have had recently.\nThe auto focus is superb and the macro magnificent. I can't wait to take it travelling as I know the results will be fantastic","title":"Higher quality video than ever before."},{"authorName":"SarahW","creationDate":"2026-07-31T20:00:00","text":"I bought the RX10v as a replacement for the RX10iv and it is an excellent upgrade. The viewfinder is big and bright, the new battery lasts for ages and the form is easier to hold without chance of dropping. The best improvements are in the super-fast focus and the subject detection. This is a game changer for nature photography. What is still missing is PreCapture which I hope Sony will add in a later firmware update. Brilliant camera, it will replace my OM1ii mirrorless system. If you have an RX10iv and are considering upgrading you won't regret it, unless you take indoor images with the old popup flash, the mark 5 doesn't have this.","title":"Brilliant camera especially for nature photography"},{"authorName":"Richard98","creationDate":"2026-07-29T20:00:00","text":"I have the Rx10M4 which I loved, but the M5 has so many improvements e.g. Auto focus, image stabilisation, layout similar to A7 range, touch screen, weather resistance better battery life. Its the best travel camera out there, even though I had to buy a separate flash (even though I rarely use flash)","title":"Best travel camera ever"},{"authorName":"meinnit","creationDate":"2026-07-27T20:00:00","text":"I haven't splashed out on a decent camera for many years. This bridge camera is excellent for an enthusiast who is happy with the compromises it makes. Excellent for general landscape, zoom and macro photography. The iphone app quicky transfers images to your photo library. And wow has autofocus improved in the last few years! Excellent tracking of wildlife and subjects. I like a nice camera but got fed up of lens changes and (guess what) always having the wrong lens on at the wrong time. Not anymore :)","title":"Superb bridge camera."}],"highlights":["Experience superior image quality with 20.9MP.", o-financing-rate-dollars\"><span>$</span>102</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"LEMMUEL D.","creationDate":"2026-09-14T08:36:06","text":"Good for a starting camera!","title":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Black"},{"authorName":"THANH T.","creationDate":"2026-06-19T08:59:59","text":"Came packaged well!","title":"Camera"},{"authorName":"Robert P.","creationDate":"2026-06-02T15:44:34","text":"Excellent second camera. Good camera for close-ups of flowers, especially with the Voigtl\u00e4nder lens I added. Compact and easy to carry when I don't want to take my large camera. I'm very happy with the image quality. I especially like the dials which allow me to adjust settings without looking through a menu.","title":"Great Second Camera"},{"authorName":"SHANE G.","creationDate":"2026-05-22T04:08:13","text":"I love it, the battery life is a little small so I recommend investing in a second but overall love this camera. Came in perfect condition and makes photography fun again :)","title":"Love it!"},{"authorName":"IRIANA S.","creationDate":"2026-04-22T08:05:23","text":"The camera is easy to use and perfect for beginners. It is lightweight and compact, which makes it a great travel camera.","title":"Beginner friendly"},{"authorName":"AYANA A.","creationDate":"2026-03-19T04:30:44","text":"IN LOVE, came quickly in the mail, as described. Huge Fujifilm fan now. Can't wait to start taking it on my vacations and using it daily !","title":"WORTH EVERY PENNY"},{"authorName":"CAMILA F.","creationDate":"2026-03-11T18:26:01","text":"Super fun camera to use, definitely still learning as my previous one didn't have all these settings, but super fun to play around with the recipes. Camera also feels sturdy but it's compact and easy to carry around.","title":"Fun learning experience"},{"authorName":"ANA E.","creationDate":"2026-03-11T12:51:51","text":"It's a great camera, love that you can use recipes and it aarived really quick","title":"Best camera ever"},{"authorName":"NOMAN F.","creationDate":"2026-02-26T14:33:08","text":"Captures great images and the form factor and film simulation dial make it easy to take on the go and use all the time. And it's beautiful to look at when it's sitting on the shelf as a bonus!","title":"Love it!"},{"authorName":"AUSTIN D.","creationDate":"2026-02-15T11:03:05","text":"This is my first mirrorless set up and i've used the camera a handful of times and i LOVE it! I would recommend this kit to anyone.","title":"Greatest Camera Ever"},{"authorName":"John H.","creationDate":"2026-01-29T12:56:24","text":"The X-T30III is a great camera for starters. It takes super sharp photos and the auto focus is an improvement compared to the II. With the upgraded X-Processor 5 it's faster at applying film sims.\n\nSomethings I dislike about this camera are\n\nThe front scroll dial is in a really awkward position for me, I always accidentally press it while scrolling, I don't have this issue for the XT-5 so I guess the ergonomics changed a bit.\n\nI appreciate the grip on the camera but it's a bit too small, I ended up having to by the smallrig to make it more usable.\n\nIt would be cool if the top left scroll wheel could adjust ISO instead. Seems like a waste of a dial for film sim.\n\nHonestly, If you could get a used X-T50 for a similar price I'd probably get that instead. But if not this is definitely a great starter cam","title":"Great entry levels with some gripes"}],"highlights":["Superior 26.1MP APS-C image quality captures every detail.","Blazing-fast autofocus for precision and speed.","Pro-level 6.2K video capabilities for cinematic shots.","Compact, lightweight design enhances portability for travel.","Diverse Fujifilm X lens selection for creative versatility."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"IFJXT30M3KB","image":"IFJXT30M3KB.JPG","imageWebp":"fujifilm-x-t30-iii-black_ifjxt30m3kb.webp","desc":"Fujifilm X-T30 III Mirrorless Camera with XC 13-33mm Lens, Black","isConfigurable":false,"productId":"IFJXT30M3KB"},{"sku":"SLALPINE120","image":"SLALPINE120_17.JPG","imageWebp":"slinger-alpine-120-shoulder-bag_slalpine120_17.webp","desc":"Slinger Alpine 120 Multi-Device Shoulder Bag","isConfigurable":false,"productId":"SLALPINE120"},{"sku":"GXNPW126","image":"GXNPW126.jpg","imageWebp":"green-extreme-np-w126-7_gxnpw126.webp","desc":"Green Extreme NP-W126 Battery Pack","isConfigurable":false,"productId":"GXNPW126"}],"sku":"IFJXT30M3KBB","primaryImageName":"IFJXT30M3KBB.JPG","primaryImageNameWebp":"fujifilm-x-t30-iii-black_ifjxt30m3kbb.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-t30-iii-mirrorless-camera-xc-13-33-mm-lens-bundle/p/ifjxt30m3kbb","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1217.95,"effectivePriceCode":5,"highPrice":1217.95,"guestPrice":1217.95,"isSale":false,"isEdu":false},"isAvailableForStorePickup":false,"isAvailableInStore":false,"thumbnailImageName":"IFJXT30M3KBB.JPG","thumbnailImageNameWebp":"fujifilm-x-t30-iii-black_ifjxt30m3kbb.webp"}],"isAllComponentsAvailableForStorePickup":false,"isAllComponentsAvailableInStore":false},{"sku":"NKZ8KG","persuasionStrategies":[{"expiresDate":"2026-10-04 23:59:00.0","message":"Limited Time Offer <span>3 days 11:26:32</span>","overallRating":null,"persuasionType":4,"reviewerInfo":null}],"brand":"Nikon","prices":{"price":5117.73,"youSave":{"dollar":700,"percent":12},"highPrice":5817.73},"stock":"In","subStatus":{"name":"In Stock"},"badgeText":"Special","categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorl financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Irem T.","creationDate":"2026-09-26T06:10:23","text":"Too expensive","title":"Price"},{"authorName":"NICK M.","creationDate":"2026-09-23T11:40:29","text":"Still learning the various settings. All good do far.","title":"New Z8"},{"authorName":"Erik H.","creationDate":"2026-09-03T19:38:26","text":"Just upgraded from a D500 - what a jump!  This thing is amazing, paired with a 24-70 is going to be a workhorse for me!  Glad I waited to make the jump to mirrorless until I could put this in my bag!","title":"Talk about upgrade!"},{"authorName":"Michael S.","creationDate":"2026-08-31T12:37:46","text":"This camera is a beast!  I love how amazing it is when used with the 180-600mm lens when it comes to taking pictures of birds, especially in flight!  Locks on and makes my keeper rate go up considerably.  I can crop the pics quite a bit and still keep the sharp resolution.  I also love the precapture feature which lets me get shots I would have never gotten.","title":"Amazing combo!"},{"authorName":"Quyen N.","creationDate":"2026-08-23T17:10:29","text":"Great kit to get started as I switched from my beloved Pentax. The learning curve is steep but not impossible. 24-120mm is fast enough, versatile, and not too heavy. I have an L-bracket attached to the body which helps with grip and mounting on tripod. I'd say the one thing from the kit that is not quite usable are the filters - they create crazy distortion.","title":"Nikon Z8 kit"},{"authorName":"BLAS G.","creationDate":"2026-08-07T12:41:29","text":"Perfect camera for wildlife photography and with this crazy good kit lens also ideal for the casual family, vacation and landscape pictures.","title":"Ideal wildlife camera"},{"authorName":"Andrzej I.","creationDate":"2026-07-30T14:47:23","text":"Z8 is one of the best cameras that I own. Little bigger then my previous Z6 (I did trade in it) but manageable size. Autofocus works great","title":"Z8"},{"authorName":"Andrzej I.","creationDate":"2026-07-30T14:45:06","text":"Nikon Z8 with 24-120 F4 lens is a fantastic camera and a great multi purpose lens. The bundle additional most viable items are: EN_EL15 battery, 128BG CF Express card... for free, that makes this purchase very attractive.","title":"Nikon z8 bundle."},{"authorName":"LAURA R.","creationDate":"2026-07-28T08:57:23","text":"Upgraded from a Nikon Z5. There was a learning curve but camera was fairly easy to figure out. It takes amazing pictures. A big upgrade from the Z5. I would highly recommend this camera","title":"GREAT camera"},{"authorName":"JOE L.","creationDate":"2026-07-24T11:56:45","text":"Good communication. Fast service","title":"Honest retailer"},{"authorName":"MATTHEW W.","creationDate":"2026-07-17T11:06:49","text":"Great bundle, bag was surprisingly nicer than expected, would recommend!","title":"10/10"},{"authorName":"Matthew M.","creationDate":"2026-07-14T17:58:28","text":"All items came in the timeframe given and most seem to be in good condition. The only minor issue that I could fine is that the joystick on the camera doesn't sit centerline and if used drifts to the left slightly with no tactile noise made. Not a big enough issue for me to return or require a replacement. I am unable to test the camera capabilities or other attachments as I do not have a lens for the camera (the camera is a gift).","title":"All in good order beside Joystick drift"},{"authorName":"Fletcher P.","creationDate":"2026-07-09T12:31:32","text":"After using my Z7II for a year, I bought the Z8.  While I like the Z7II, the Z8 feels a lot like the D850 that I had for many years. For me, the control locations provide a more comfortable fit with my hand size. While it is heavier than the Z7II, when carrying the camera with the 24-120mm lens and a Black Rapid strap, the weight isn't an issue.  Autofocus speed with my all of my Nikkor Z lens has been very good.","title":"Comfortable Transition From D850"},{"authorName":"ROBERT L.","creationDate":"2026-07-08T08:05:56","text":"Great package deal and my new everyday camera to carry everywhere. This item is perfect as it is lightweight and has a wide focal range to use in the street or in the country","title":"Adorama is awesome"},{"authorName":"RODRICK M.","creationDate":"2026-07-01T13:36:38","text":"I'm really glad I went with the Z8 over the Z6III.  The electronic shutter, I think, will make me happier long term.\n\nI am having an issue with it where, in bracketed shots, it sometimes replaces one of the shots with a shot from the previous bracket.  Not great.  I'm working with Nikon and they are researching the issue; a few others have reported it, too.  This is easy to check for by reviewing each picture before moving to the next one, so it's not the end of the world, but it is disappointing.\n\nOverall the camera works quite well.  I'm a little disappointed that the user modes (or whatever they now call it) doesn't store all settings, I have to remember to switch a few things on when I go back to that mode.  But that has always been the case with Nikon; even my D750 didn't remember critical things in its user modes.  (Like the role of the second card.)\n\nI like that it has controls for easily adjusting the delay - it's easy to switch from my usual 2 seconds to 5 or 10 seconds with just a button and a wheel.  My D750 required navigating menus.  The Z8 has several things like that that are a nice step forward for pro users.","title":"Mostly great"},{"authorName":"Doug H.","creationDate":"2026-06-29T14:16:21","text":"Superperb pro quality, feels good in my hands. Still getting the hang of the mirrorless world, but this is a great camera that should be part of the arsenal for many years to come.","title":"Fantastic mirrorless quality"},{"authorName":"ELLEN D.","creationDate":"2026-05-29T08:39:20","text":"Am loving this camera! It took me a while to get used to how quiet it was--I couldn't tell if I had actually taken a photo! Works great in low light, live focus is fast (always a problem with my previous Nikons), Love it!","title":"Love it!"},{"authorName":"Todd W.","creationDate":"2026-05-28T08:09:52","text":"Great camera and fast shipping","title":"Z8"},{"authorName":"Matthew B.","creationDate":"2026-05-26T11:05:59","text":"I have been using my Z8 for over a year! I love it! it has been a game changer. I still use my D850 as a backup but the Z8 is my go to camera now!","title":"Great go to camera from Nikon!"},{"authorName":"Elmer D.","creationDate":"2026-05-20T23:14:02","text":"Best camera I've ever owned! Sharp, fast with incredible color science.","title":"The best"},{"authorName":"Elmer D.","creationDate":"2026-05-20T23:13:41","text":"Best camera I've ever owned! Sharp, fast with incredible color science.","title":"The best"},{"authorName":"CARRIE T.","creationDate":"2026-05-08T11:37:54","text":"Seamless switch from my D800 to the Z8. Feels very similar, but a little lighter. The lens adapter does a great job, so I can continue to use all of my lenses.","title":"D800 to Z8 switch"},{"authorName":"CHRISTOPHER B.","creationDate":"2026-05-03T16:47:12","text":"The Nikon Z8 has become my main camera and one of the best creative tools I've ever owned. I use it for both photo and video work. It completely replaced my Nikon D750 for photo work and has also replaced my Blackmagic cinema pocket 6k camera for most of my video work. If you're coming from a DSLR or trying to consolidate photo and video into one system, the Z8 is a beast. It's easily one of the most capable creative tools I've owned. 5 stars.","title":"The best camera I've ever used"},{"authorName":"Adrian V.","creationDate":"2026-05-01T17:17:50","text":"Best Nikon Z camera for pro-users. I also own the Zf, a very different concept, but the Z8 remains the top of the Z line. Lenses are aplenty as of today, but you can adapt any old lenses to the Z8, with perfect results. I own over 50 Nikon F, M42, Olympus, etc lenses, and I have Z adapters for all of them. I highly recommend the Z8 for any serious shooters.","title":"Nikon Z8 camera"},{"authorName":"Bruce T.","creationDate":"2026-04-29T05:43:47","text":"I have my D5 and D6 as well as my work horse D850 and no interest in upgrading to the Z camera and lenses. Then I finally did it. I went to the Z8 because I didn't need all the extras of the Z9.  When I got it home and started using it with my F lens and was blown away with the picture quality of this Z8.  I now started buying the Z lenses and I'm absolutely loving the Z8 for the size and again for the picture quality and its speed.","title":"Such a fantastic camera a lenses"},{"authorName":"JAMES F.","creationDate":"2026-04-17T20:20:47","text":"Great camera, lots of stuff to learn and excellent tools to get better pictures.","title":"Excellent"},{"authorName":"GRACE M.","creationDate":"2026-04-07T08:05:55","text":"Came quickly, with all accessories, packaged nicely.","title":"Z8"},{"authorName":"PAUL H.","creationDate":"2026-03-18T13:51:02","text":"Excellent camera.  Big adjustment from a DSLR to Mirrorless, but pleased with the decision.  Photos are crisp.","title":"Enjoying the Camera"},{"authorName":"ROD B.","creationDate":"2026-03-05T04:55:45","text":"Z8 is focus campion. Replaced d500, good upgrade, love it. Adorama's package was just what I needed.","title":"NikoZ8 repalced D500"},{"authorName":"ABEL K.","creationDate":"2026-02-09T13:00:09","text":"The Nikon Z8 has a very good camera overall?.the image quality is excellent and the autofocus system is generally fast and reliable in most lighting conditions. However, I've noticed that in very bright backlit situations, the autofocus can sometimes miss focus or take a bit longer to lock on than expected. It still gets the job done, but it's not perfect in those extreme lighting conditions. Otherwise, for everyday shooting and most scenarios, the autofocus performs well and makes the camera a great choice for serious photographers.","title":"Extreme lighting Conditions"}],"highlights":["Capture stunning detail with 45.7MP sensor.","Exceptional low-light performance ensures clarity.","Pro-grade 8K video capabilities for filmmakers.","Advanced autofocus system for sharp images.","Versatile lens options for every scenario."],"freeShipTypeName":"Free Expedited Shipping","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"NKZ8K","image":"NKZ8K.jpg","imageWebp":"nikon-z8-mirrorless-24-120mm-f4_nkz8k.webp","desc":"Nikon Z8 Mirrorless Camera with NIKKOR Z 24-120mm f/4 S Lens","isConfigurable":false,"productId":"NKZ8K"},{"sku":"SLALPINE140","image":"SLALPINE140_18.JPG","imageWebp":"slinger-alpine-140-shoulder-bag_slalpine140_18.webp","desc":"Slinger Alpine 140 Multi-Device Shoulder Bag","isConfigurable":false,"productId":"SLALPINE140"},{"sku":"SDCFEB128GGN","image":"SDCFEB128GGN.JPG","imageWebp":"sandisk-extreme-pro-cfexpress-128gb_sdcfeb128ggn.webp","desc":"SanDisk Extreme PRO CFexpress 4.0 Type-B Memory Card Single 128GB","isConfigurable":false,"productId":"SDCFX4B"},{"sku":"NKMBN12","image":"NKMBN12.jpg","imageWebp":"nikon-mb-n12-z8-grip_nkmbn12.webp","desc":"Nikon MB-N12 Multi Battery Power Pack w/Vertical Grip for Z8 Camera","isConfigurable":false,"productId":"NKMBN12"},{"sku":"GXCRCFXB","image":"GXCRCFXB.JPG","imageWebp":"green-extreme-usb-c-3_gxcrcfxb.webp","desc":"Green Extreme USB-C 3.2 Gen 2 CFexpress Type-B and SD UHS-II Card Reader","isConfigurable":false,"productId":"GXCRCFXB"},{"sku":"GXENEL15CV4","image":"GXENEL15CV4.JPG","imageWebp":"green-extreme-en-el15c-battery-usb-c_gxenel15cv4.webp","desc":"Green Extreme EN-EL15c 16.8Wh 7.0V 2400mAh Li-ion Battery with USB-C Port","isConfigurable":false :"Took a bit to get used to focal length on this lens but I absolutely love the photos it creates. Small and pocketable is a true advantage. Slides right in my suit jacket pocket at weddings. Upgrade tip: adding a small external flash gives you an even greater set of photo options.","title":"Small, no-frills body that takes exceptional photos"},{"authorName":"ISHAAN L.","creationDate":"2025-02-11T07:47:43","text":"Great product - v easy to use. JPEG out of the camera are AMAZING. Solid build quality for something this small. Definitely something worth getting a case for","title":"Best go anywhere camera"},{"authorName":"BRANDON C.","creationDate":"2024-12-04T08:01:29","text":"I typically shoot with a Sony A7C, but wanted something more pocketable. This fit the bill nicely. \n\nThe main draw for this camera is that it's an all-in-one package that can streamline your workflow. It's design makes it easy to shoot one handed, image control let's you set different \"simulations\" to get a look you want without a ton of post-processing, and the built-in HDF means you have to carry one less piece of kit (if HDF is something you're interested in). \n\nThe only thing I'd recommend is a spare battery for longer shooting sessions.","title":"Great for those who want to shoot casually with as minimal kit as possible"},{"authorName":"SEAN T.","creationDate":"2024-12-03T08:45:09","text":"Great camera and great purchase","title":"Great camera"},{"authorName":"CARSTEN G.","creationDate":"2024-07-09T10:00:02","text":"Hold 2 weeks (during which it took beautiful pics!), then could not be put on anymore, nor did it start up on externally charged battery. Crap, sorry. Only using the supplied battery and charging cable, no water damage, no falls. Sent back to Adorama for repair/replacement","title":"Hold for 2 weeks"}],"highlights":["24.24MP Ricoh camera for stunning image quality.","Fast hybrid AF ensures sharp, precise autofocus.","Capture detailed shots with various lens options.","Shoot Full HD videos with built-in stereo sound.","APS-C sensor excels in low light photography."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IRCGR3XHDF","primaryImageName":"IRCGR3XHDF_1.JPG","primaryImageNameWebp":"ricoh-gr-iiix-hdf-digital-camera_ircgr3xhdf_1.webp","options":[],"websiteUrl":"https://www.adorama.com/ricoh-gr-iiix-hdf-digital-camera/p/ircgr3xhdf","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1346.95,"effectivePriceCode":5,"highPrice":1346.95,"guestPrice":1346.95,"trialPrice":94,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":true,"thumbnailImageName":"IRCGR3XHDF_1.JPG","thumbnailImageNameWebp":"ricoh-gr-iiix-hdf-digital-camera_ircgr3xhdf_1.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true,"trialPrice":94},{"sku":"IFJXE5BK","persuasionStrategies":null,"brand":"Fujifilm","prices":{"price":1899,"highPrice":1899.95},"stock":"In","subStatus":{"name":"In Stock"},"categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/fujifilm-x-e5-mirrorless-camera-xf-23-mm-f-2-8/p/ifjxe5bk","flags":{"isRefurbished":false,"isUsed":false,"isPreOrder":false,"isPreAnnounced":false,"isNoReturns":false,"isAvailableForPurchase":true,"hasAccessories":true,"hasFreeBundleToChoose":false,"isHidden":false,"isAvailableForComparison":true,"hasFAQ":false},"promoFlags":[{"name":"financing 24 months","startTimeStamp":"2020-08-18T04:00:00Z","endTimeStamp":"2028-01-30T05:00:00Z"}],"shortTitle":"Fujifilm X-E5 Mirrorless Camera with XF 23mm f/2.8 R WR Lens, Black","mainImageName":"IFJXE5BK.JPG","mainImageNameWebp":"fujifilm-xe5-mirrorless-black_ifjxe5bk.webp","ratings":{"count":17,"averageRatingStars":5},"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Fujifilm X-E5 Mirrorless Camera with XF 23mm f/2.8 R WR Lens, Black","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"IFJXE5BK page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"16949882","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[],"variantSku":"IFJXE5BK","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"159\",\"TotalPrice\":\"1899\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>159</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"Irem T.","creationDate":"2026-09-26T06:09:32","text":"Nice camera","title":"Classic fuji"},{"authorName":"RONALD C.","creationDate":"2026-09-08T07:27:42","text":"Superb camera. My first range finder in 65 years of making photographs. This camera has opened up a new way of seeing and provided the tool to implement the new vision.","title":"New tool, new vision"},{"authorName":"VINAY U.","creationDate":"2026-08-16T05:09:03","text":"Wonderful camera and service from Adorama in helping me choose it. I've fell in love with photography all over again!","title":"Fell in love with photography all over again!"},{"authorName":"Man W.","creationDate":"2026-08-13T18:13:51","text":"Pros:\nThe form factor is great and the build quality is excellent. \nThe image quality from the camera is excellent. \nExtremely portable\n\nCons\nWhat I don't like is the slower autofocus compared to Canon/Nikon/Sony\nthe command wheel is to easy to adjust, needs more resistance\nThe paired 23mm F2.8 lens has an issue with this camera causing slow power on times\n\nOverall an excellent everyday carry camera compared to my R6.","title":"Fuji XE-5"},{"authorName":"AMANDA G.","creationDate":"2026-07-21T08:28:58","text":"Really love this camera. It's a lot of fun to shoot with. A lot of flexibility with filters / settings.","title":"Love it"},{"authorName":"JAMES K.","creationDate":"2026-07-15T09:06:00","text":"It's a great camera, small, light, inconspicuous, easy to use.  The 23mm (full frame 35mm equivalent) is perfect for the type of photography.  I have extensive experience with Fujifilm cameras and am coming back to the system after a break","title":"Great camera"},{"authorName":"NICK Z.","creationDate":"2026-05-29T04:25:59","text":"Excellent replacement for X-E4!  I found the 40mp higher resolution and IBIS are the two important features that made the upgrade more appealing.  There is a long list of new features that are described on Fuji's website, but these two are what are worth mentioning for me.\nThe only negative issue I have encountered is difficulty scrolling the rear command dial left or right without activating the secondary function.  Because the resistance to push the dial in for the secondary function is so light, scrolling the dial often triggers the secondary function.","title":"Is the Fuji X-E5 a worthwhile upgrade to X-E4?"},{"authorName":"Olga M.","creationDate":"2026-05-04T16:32:18","text":"South this camera as travel camera. Love it! It's so light and perfect to have for capturing every day moments.","title":"Amazing travel camera"},{"authorName":"MARK H.","creationDate":"2026-03-12T02:58:01","text":"This is a great camera to take on the go. I use the black and white film recipes more than I expected and the image quality is very impressive and I really like Fuji's colors.","title":"First Fuji"},{"authorName":"Brian M.","creationDate":"2026-01-27T04:40:41","text":"Gorgeous camera with all the image and build quality you've heard about, however, the lack of weather sealing and the LCD resolution prevent me from giving five stars, which I've given to all my other Fujifilm equipment. For this price, these features sould be included. Some marketing camera differiation deal on Fujifilm's part.","title":"A beauty of a camera"},{"authorName":"JOSE G.","creationDate":"2025-11-13T02:32:27","text":"Incredible camera, great colors, feels robust enough in the hand, has great opportunities to crop and create images the way you want with its as some 40 megapixel sensor.","title":"Great Camera"},{"authorName":"Orlando T.","creationDate":"2025-11-04T23:36:36","text":"Still learning as I just got it but wow, loving it already!","title":"Loving my new Fujifilm X-E5 camera"},{"authorName":"ARISTOTLE P.","creationDate":"2025-10-07T07:16:10","text":"Debated between this and x100vi. Feels and looks like a x100v that I had and sold because of the fixed lens. Mind you that I still have my xt5. I keep both because I need one for shooting with my bigger prime and zoom lens and another for compactness and use for travel. Cant chose one because different purposes. Camera image is exactly the same.","title":"Cant decide which to keep"},{"authorName":"JIM G.","creationDate":"2025-10-06T07:27:43","text":"I'll keep it simple. This is a reasonable alternative to the x100VI for those who need inter-changeable lens options. The added film simulation dial is an interesting addition. Other considerations: A tilt LCD screen like the x100VI, excellent video features (6.2K recording and F-Log/F-Log2), improved AF, and five-axis in-body image stabilization.  There are trade offs: no weather sealing, no dedicated video controls, and a meh EVF. And of course, it's not cheap. \n\nRecommended for anyone who requires more lens options than the X100 models and is willing to trade off a few of the X100VI features for lens interchangeability.","title":"Fujifilm X-E5"},{"authorName":"Bernabe T.","creationDate":"2025-09-19T08:23:05","text":"What a beauty of a camera! Haven't had the chance to test it much but happy with a visit to the botanic gardens.","title":"Beautiful camera!"},{"authorName":"MANUEL O.","creationDate":"2025-09-16T08:34:11","text":"I simply love this camera. I'm still getting to grips with some of the details that are different from the dials operation of my X-T5, but I've taken it out a couple of times now and it hasn't disappointed. It's everything I expected, the look and feel of the X100VI with the versatility of being able to change lenses. I don't miss the niceties you get with the X100VI, like the hybrid viewfinder, the built-in ND filters, or the leaf shutter. I don't even mind that it's not weather sealed, after all the X100VI isn't exactly weather sealed (you have to put a filter on the lens to make it fully weather sealed), and if I have to go out shooting in bad weather, I have my X-T5 or even my X-H2S. The included strap is fantastic; excellent length, comfortable, and very good quality. I'm still waiting for an L-bracket; it's something you're willing to pay for a little handling comfort. Overall, it has quickly become my favorite camera.","title":"My new favorite camera."},{"authorName":"Steven H.","creationDate":"2025-09-05T05:08:33","text":"The X-E5 is a pretty nice street camera.  I was hoping for a bit smaller and lighter, but it feels good in your hand and takes great photos.  My pet peeve is the large and worthless exposure compensation dial.  Hey Fuji, let us reassign it to something else.  An ISO wheel would be perfect.  If you want to make the experience like a Leica, you have to make all three components of the exposure triangle easy and accessible.","title":"Almost a great camera"}],"highlights":["Capture stunning detail with 40.2MP resolution.","Excellent low-light performance; sharp, clear images.","Fast, accurate autofocus for fleeting moments.","Record cinematic 6.2K video with ease and clarity.","Versatile lens options with Fujifilm's X Mount."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"sku":"IFJXE5BK","primaryImageName":"IFJXE5BK.JPG","primaryImageNameWebp":"fujifilm-xe5-mirrorless-black_ifjxe5bk.webp","options":[],"websiteUrl":"https://www.adorama.com/fujifilm-x-e5-mirrorless-camera-xf-23-mm-f-2-8/p/ifjxe5bk","condition":{"abbreviation":"N","name":"New"},"prices":{"price":[],"effectivePrice":1899,"effectivePriceCode":5,"highPrice":1899.95,"guestPrice":1899,"isSale":false,"isEdu":false},"isAvailableForStorePickup":true,"isAvailableInStore":true,"thumbnailImageName":"IFJXE5BK.JPG","thumbnailImageNameWebp":"fujifilm-xe5-mirrorless-black_ifjxe5bk.webp"}],"isAllComponentsAvailableForStorePickup":true,"isAllComponentsAvailableInStore":true},{"sku":"IFJXM5BKNB","persuasionStrategies":null,"brand":"Fujifilm","prices":{"price":1085.88,"highPrice":1085.88},"stock":"In","subStatus":{"name":"In Stock"},"categoryId":240617,"categoryPath":"Photography/Cameras/Mirrorless Cameras","productUrl":"/fujifilm-x-m5-mirrorless-camera-15-45-mm-bundle/p/ifjxm5bknb","flags":{"isRefurbished":false,"isUsed":false,"isPreOrder":false,"isPreAnnounced":false,"isNoReturns":false,"isAvailableForPurchase":true,"hasAccessories":true,"hasFreeBundleToChoose":false,"isHidden":false,"isAvailableForComparison":true,"hasFAQ":false},"promoFlags":[{"name":"financing 24 months","startTimeStamp":"2020-08-18T04:00:00Z","endTimeStamp":"2028-01-30T05:00:00Z"}],"shortTitle":"Fujifilm X-M5 Mirrorless Ca ble":false,"productId":"PRO52KIT"},{"sku":"PROXCPK1","image":"PROXCPK1.JPG","imageWebp":"prooptic-complete-optics-care-kit-7x7in_proxcpk1.webp","desc":"ProOptic Complete Optics Care and Cleaning Kit","isConfigurable":false,"productId":"PROXCPK1"}],"isSynchronyEligible":false,"isVipProduct":true,"productTitle":"Fujifilm X-M5 Camera with XC 15-45mm f/3.5-5.6 Lens, Black, with Essentials Kit","cartButton":{"props":{"type":"button","rel":"","href":"","data-action":"addToCart","data-tooltip-source-url":"","data-tooltip-content":"","data-popup-class":"","data-track-data":"IFJXM5BKNB page, add to cart, listing","data-orig-val":"Add to Cart","data-action-timeout":"1000","disabled":false},"classes":"trackEvent add-to-cart action highlight-dark","label":{"defaultLabel":"Add to Cart"},"subText":{"defaultText":""},"asLink":false},"mfr":"16953950 B","variantCount":null,"isVariantPriceDiffers":false,"isShowShippingInfo":true,"isConsolidatedUsed":false,"waysToSave":[],"variantSku":"IFJXM5BKNB","monthlyPaymentContent":"<a rel=\"nofollow\" class=\"promo-financing short trackEvent popup\" data-track-data=\"financing apply,suggested minimum payment credit,plp\" data-callback-context=\"adrma\" data-callback-arguments='{\"financeMonth\":\"12\",\"financePrice\":\"91\",\"TotalPrice\":\"1085.88\",\"financeDateEnd\":\"12/31/9999\",\"financeDateStart\":\"01/01/1970\"}' data-callback=\"renderFinancingPromoPopup\" data-href=\"/api/getContent?ContentName=CAFinancingPromo&Output=Desktop\" data-popup-class=\"popup800 popupFinancing\"><span class=\"promo-financing-rate promo-financing-rate-dollars\"><span>$</span>91</span><span class=\"promo-financing-rate\">/mo</span> suggested payments with 12&#8209;month special financing. <span class=\"promo-financing-learn-how\">Learn&nbsp;how.</span></a>","kitBadges":{"allowKitsGrouping":false,"cheapestProductPrice":0,"isBaseItem":false,"isColorOptionAvailable":false,"isNeedToShowKitsAvailableBadges":false,"kitsPageLink":null},"expertReview":null,"productReviews":[{"authorName":"MARK H.","creationDate":"2026-09-24T06:22:24","text":"Basically an everyday carry for me! Easy transfers to my phone via app and the quality is excellent. New hobby acquired.","title":"Perfect"},{"authorName":"ELIZABETH B.","creationDate":"2026-09-10T01:06:10","text":"Overall I'm a fan. There was a bit of a learning curve to using it and there are some controls that drive me crazy (like the autofocus) but the photo quality is excellent","title":"Good quality"},{"authorName":"Annika M.","creationDate":"2026-06-25T11:36:34","text":"I have been lovingggg this camera! even the kit lens has been so versatile and i have enjoyed it. It is so small and portable while still being so capable.","title":"a perfect pocket sized camera"},{"authorName":"TOMMY L.","creationDate":"2026-06-07T10:08:32","text":"It's a great camera. It takes great photos for the price point and it has interchangeable lenses which is awesome.","title":"Love my FUJI"},{"authorName":"RUBEN C.","creationDate":"2026-03-20T04:52:58","text":"Great travel camera","title":"Fujifilm xm5"},{"authorName":"DEREK C.","creationDate":"2025-11-07T05:27:52","text":"I admit that I was skeptical of the boost in quality that we would see. Afterall, phone cameras do all the work for you. Point, shoot, and the software balances everything and spits out great photos these days. I was nervous that we would get the camera, play with it a couple times and find the photos to be underwhelming because we had to manually adjust so many settings to get the look just right. Out of the box, we fell in love with the film simulations and the ability to add custom recipes. These settings basically help bridge the gap between phone and a dedicated camera. We ran into a bunch of exposure issues initially, but after a couple youtube videos, we learned a TON and got things dialed in. \nI highly recommend this camera to anyone thinking about making the leap from phone to dedicated camera. It is a great stepping stone with all the settings available to you, but also the ability to let the camera do the work if you don't want to get into the weeds. \nI do wish it had an EVF","title":"Perfect step from phone to dedicated camera photography"},{"authorName":"RYAN S.","creationDate":"2025-10-21T09:16:14","text":"The X-M5 has been amazing. The photo quality is super sharp and the colors of the film simulations are great. Super compact as well. Very easy to carry around with you without taking up too much space. For what you pay, this camera is absolutely worth it.","title":"Amazing compact camera"},{"authorName":"RENE L.","creationDate":"2025-08-22T14:46:33","text":"I love the Fujifilm X - M5! It's my first camera ever, and it was so easy to start using. Out of the box image is amazing and the film simulations make it much easier for me. I am a visually, impaired person, who wants to get into photography. Little by little, I'm learning how to use the camera, and make my way into manual mode. The kit lens is also great. My photos and videos have received good compliments. Next step is buying a new lens for better photos and videos. I recommend it as a starter camera, even a travel camera. It's small and compact. I do recommend a thumb grip for it, which leads me to the negative?.. the battery life is not the greatest, and I found myself having to buy an extra battery. Besides that I recommend the camera and you won't be disappointed.","title":"Great Purchase!"},{"authorName":"Tony S.","creationDate":"2025-08-10T06:43:58","text":"I bought this camera because I wanted the smallest possible Fuji to primarily pair with 18mm and 27mm Voigtlander manual focus/aperture lenses, or Sigma 18-50 f/2.8, as a take-anywhere photo-centric carry kit. The camera is really compact and becomes a bit uncomfortable after a while with my large hands (i.e., wear large gloves). I do miss an EVF but it has not been a hindrance to taking photos. After using it for several months, I added SmallRig thumb and hand grips, which makes the camera easier to handle because holding it caused fatigue of my right hand. This makes it bigger, but it does not change the 3 dimensional aspect of the camera, so it effectively doesn't have much of a size impact. Each of these kits fit into my tiny Domke F-903 bag which, unfortunately, is no longer made.\n\nThe images are superb from this camera with its tried and true 26 mp sensor, and I am glad to have it. I have been using it more than my X-T4 simply because I've carried it pretty much where ever I go on a daily basis, whereas the X-T5 is used mostly for hikes, when I really need an EVF (e.g., when I need to use other, larger lenses). The battery is perfectly adequate for the camera and I have yet to exhaust it during its use, and I always shoot raw+JPEG fine and bracket with three film sims (i.e., 6 images recorded to the SD card with each shutter actuation), which is more energetically demanding.\n\nI really don't do much video, so I have no comments about it.\n\nThere are a few problems with the camera. The most significant is the front command dial. It is way too easy to inadvertently turn or push. On walks, there was never an instance where I did NOT accidentally change a setting, so I ended up just disabling it. This is really, really frustrating. This is much different than my X-T4 where the front command dial has much more resistance and does not have this problem. I also had to disable the back LCD touch mode because the camera would take photos when I had it just at my side walking down the street. The fully-articulating screen is distracting to me, so I usually just leave it flat against the back. Finally, the film sim dial on top is pretty much wasted space. I understand why it's there, but I only use 3 film sim modes and they are already set to record. This dial could have been used for something more useful (such as ISO dial). I knew about all of these limitations (except the terrible front command dial) in advance, but I bought the camera anyway and plan to keep it. It suits its intended purpose for my use.","title":"Great little camera with one major design flaw"},{"authorName":"Alondra G.","creationDate":"2025-05-27T07:11:30","text":"I've had cameras before but I've never felt excited to use it the way I'm excited to use this one. It's easy to operate, the app is user friendly, and its portability is unmatched. The quality is so good, regardless if you use a film simulation or not. This camera has ignited a passion for photography again. It is 100% beginner friendly. P.s. I want to give a shoutout to Adorama. They have amazing customer service and I'm so excited to become a repeat customer.","title":"Beginner friendly, great quality, fun to use"},{"authorName":"JEFFREY A.","creationDate":"2025-03-23T13:22:07","text":"Daily camera that is fun and small enough to carry where ever I go. Can't wait to travel with it.","title":"Can't wait for travel photography"},{"authorName":"SHIH-CHIANG L.","creationDate":"2025-03-16T06:29:46","text":"The camera is compact end easy to use.","title":"Great camera"},{"authorName":"Lambert G.","creationDate":"2025-02-13T08:39:42","text":"Adorama sent me a used one!\nAs for the camera, so far so good. I like the photo so far. Will venture into film simulation soon.","title":"Nice little camera"},{"authorName":"Joseph","creationDate":"2024-12-27T19:00:00","text":"W overall on the go camera and for starting a photography journey. \nVery compact and unique little camera.","title":"Fuji Film XM5"},{"authorName":"PARKER M.","creationDate":"2024-12-16T10:27:17","text":"For customers looking for something more capable than a smartphone or older camera the x-m5 is the perfect upgrade. While it may lack an evf, those coming from smartphones that are primarily using the camera for content creation likely won't miss it. Overall a great bang for your buck, hybrid capable camera.","title":"Compact, lightweight and capable"},{"authorName":"SUYUZHU X.","creationDate":"2024-12-13T07:20:57","text":"I recently purchased this camera, and it has exceeded my expectations in every way. The image quality is outstanding, delivering sharp, vibrant photos with excellent color accuracy. Whether shooting in daylight or low-light conditions, the results are consistently impressive.\n\nThe autofocus system is fast and reliable, making it easy to capture moments on the go. I also appreciate the intuitive controls and user-friendly menu, which make the camera accessible even for beginners. For more advanced users, the customizable settings allow for complete creative freedom.\n\nBattery life is another highlight-it lasts through long shooting sessions without any issues. The build quality feels solid and durable, while the lightweight design ensures it's convenient to carry around.\n\nOverall, this camera is an excellent choice for anyone looking to elevate their photography. It's a perfect blend of performance, ease of use, and portability. Highly recommended!","title":"Very good"},{"authorName":"JOSE G.","creationDate":"2024-12-09T18:50:15","text":"Love the camera and lens combo, the definition of the pictures is incredible and the film simulation wheel easily accessible and useful. \nThe video is clear and the exposure compensation very useful for night shooting.","title":"Love the camera"},{"authorName":"SCOTT Y.","creationDate":"2024-12-06T10:40:32","text":"I love this camera. It is small and that is what I want in place of my full frame Canon with heavy fat L lenses. I needed a smaller camera to frequently take so the wife isn't sick of my photo taking. I do miss the viewfinder but I am getting used to it. Takes great photos so far. This is my first Fuji so I am still learning the different simulated film modes but I like it. Since this is my casual, travel camera, I also paired it with a Sigma 17-300 zoom with a hand strap.  I wish they could have shipped the black one first?so I got a black wrap from aliexpress to change the look a bit but the silver was okay too. The camera takes some some very sharp photos. Still learning this camera's abilities in lower light as it iseems to be somewhere between my older Canon and my newer smartphone. As for Adorama- I was on the waiting list for a couple of months and I wish I would have been able to see a faster ship option. Once I finally saw it processing, a faster ship option was preferred.","title":"Love the X-M5"},{"authorName":"CHRIS F.","creationDate":"2024-12-06T05:07:09","text":"Knew I wanted this camera as soon as it was \"announced\" on Fuji Rumors, ordered it the second sales went live, arrived a few weeks later. Could not be more happy!\n\nI have had an X-M1 for a couple months and I love that camera, but the X-M5 is definitely an upgrade. There are subtle tweaks to the controls that make for much better handling. \n\nOne big difference was the top right dial. On the M1 (and the M5) it defaults to shutter speed, but on the M1 it is a much more satisfying, tactile \"click\" when turning. On the M5, I set that dial up to adjust ISO and I use the new-to-the-M5 front dial for shutter. So, despite the film sim dial (which I also surprisingly like albeit don't use much), I have manual controls for shutter, aperature, and ISO. What more can you ask for? Another bonus is that my 16mm 2.8, a lens I love to shoot with but hate the way it looks, somehow looks great on the M5. I think it has something to do with the very subtle curves of the M5 vs the M1. \n\nHighly recommend!","title":"Great Little Camera"}],"highlights":["Capture stunning detail with 26.1MP image quality.","Excellent low light performance with ISO up to 51200.","Fast, precise autofocus speed for sharp images.","Versatile lens options with Fujifilm X Mount system.","Record high-quality video with 6.2K video capabilities."],"freeShipTypeName":"FREE 2-Day Shipping ","isPrintiqueProduct":false,"variants":[{"pkgItems":[{"sku":"IFJXM5BKN","image":"IFJXM5BK.JPG","imageWebp":"fujifilm-xm5-mirrorless-blac  have been. It's compact size makes me place it my carry bag every where I go.\n\nIt is easy to use and I ordered the Leica D-Lux 8 instruction manual from Ebay and so happy I did.  The 217 page easy to read manual (with photos) makes it all worth the wait.  I'm just \"Gitty\" about this investment!","title":"Beginners review of the Leica D-Lux 8"},{"authorName":"LUIZ V.","creationDate":"2026-03-31T11:19:16","text":"Amazing camera. It was a gift to my wife and she loved!! Leica way of life! My daughter felt in love too!!","title":"Nice gift to my family"},{"authorName":"Don S.","creationDate":"2025-11-04T03:22:23","text":"The D-Lux 8 is the finest version of this camera. I have had every other version, and also from Lumix. The D-Lux 8 is a very user-friendly, intuitive camera. The lens is superb and, with the sensor, delivers stunning images.  The menu system and camera layout are very easy to navigate. The OIS works better than I expected. I can hand-hold and capture a sharp image at 1/5th of a second. Not an easy feat for an old timer with tremors. The Auto-ISO proves worthy of the Leica name. There is very little noise at high ISO's. All in all, the D-Lux 8 is a fine camera for anyone looking for an unobtrusive experience making photos. I highly recommend it, and I'm a very happy shooter.","title":"The D-Lux 8, a friend in hand."},{"authorName":"KEVIN B.","creationDate":"2025-04-04T08:41:50","text":"Well worth the wait (camera was on back order) .  Everything onw expects from Leica. Superlative ergonomics, flawless performance.","title":"Outstanding"},{"authorName":"ANTHONY J.","creationDate":"2024-08-30T06:42:52","text":"The Leica D-Lux is the perfect travel point and shoot camera. Compact, lightweight, incredible optics, outstanding build quality.","title":"Love the D-Lux"}],"highlights":["Capture crisp 17MP digital camera images.","Experience superior image quality and detail.","Enjoy intuitive operation with touchscreen display.","Compact portability for on-t
